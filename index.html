<title>L'Ultima Veglia</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;background:#07060a;overflow:hidden;touch-action:manipulation;
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:#d8cbb0}
#app{height:100dvh;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) 6px calc(env(safe-area-inset-bottom) + 2px)}

/* ---------- HUD ---------- */
#hud{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:6px 4px 5px;
  border-bottom:1px solid #251f2d}
.stat{display:flex;align-items:center;gap:4px;font-size:12px;letter-spacing:.06em}
.stat b{font-weight:600}
.sig{color:#c14a4a}.lac{color:#c9a227}.wav{color:#8fa5b0;margin-left:auto;font-size:10.5px;letter-spacing:.14em}
.ibtn{width:30px;height:26px;border:1px solid #332b3d;background:#120e18;color:#9c8f78;
  font:600 11px/1 ui-monospace,monospace;border-radius:2px}
.ibtn:active{background:#1e1826}
.ibtn.on{color:#c9a227;border-color:#5a4a22}

/* ---------- CAMPO ---------- */
#stage{flex:1 1 auto;display:flex;align-items:center;justify-content:center;position:relative;min-height:0}
#wrap{position:relative;filter:drop-shadow(0 0 18px rgba(0,0,0,.9))}
canvas#game{display:block;image-rendering:pixelated;image-rendering:crisp-edges;
  border:1px solid #2b2434;background:#07060a}
#banner{position:absolute;left:0;right:0;top:26%;text-align:center;pointer-events:none;opacity:0}
#banner.go{animation:ban 2.6s ease-out}
#banner .b1{font-size:9px;letter-spacing:.5em;color:#7d6a4a}
#banner .b2{font-size:15px;letter-spacing:.18em;color:#d8cbb0;margin-top:3px;
  text-shadow:0 0 12px #8e1b25}
@keyframes ban{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}

/* ---------- BARRA TORRI ---------- */
#bar{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:6px 2px 4px}
.tcard{border:1px solid #2b2434;background:linear-gradient(#14101b,#0c0912);border-radius:3px;
  padding:4px 2px 3px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.tcard canvas{image-rendering:pixelated;width:28px;height:36px;margin-top:-4px}
.tcard .tn{font-size:7.5px;letter-spacing:.05em;color:#9c8f78;text-align:center;line-height:1.15}
.tcard .tc{font-size:10px;color:#c9a227;letter-spacing:.04em}
.tcard.sel{border-color:#c9a227;background:linear-gradient(#221a12,#140e10);box-shadow:0 0 10px rgba(201,162,39,.18)}
.tcard.poor{opacity:.38}
.tcard.poor .tc{color:#8e1b25}

/* ---------- AZIONE ---------- */
#act{flex:0 0 auto;padding:2px 2px 4px}
.big{width:100%;padding:11px;border:1px solid #5a4a22;border-radius:3px;
  background:linear-gradient(#1d1710,#120d13);color:#c9a227;
  font:600 12px/1 ui-monospace,monospace;letter-spacing:.22em}
.big:active{background:#2a2016}
.big:disabled{opacity:.4}
.big.ghost{border-color:#332b3d;color:#8b7f6c;letter-spacing:.16em}

/* ---------- PANNELLO TORRE ---------- */
#panel{position:absolute;left:6px;right:6px;bottom:6px;z-index:5;
  border:1px solid #4a3f22;border-radius:3px;background:rgba(10,8,14,.97);
  padding:8px 9px;display:none}
#panel.on{display:block}
#panel .ph{display:flex;align-items:baseline;gap:6px;margin-bottom:5px}
#panel .pn{font-size:11px;letter-spacing:.1em;color:#d8cbb0}
#panel .pl{font-size:9px;color:#c9a227;letter-spacing:.1em}
#panel .px{margin-left:auto;color:#6b6070;font-size:14px;padding:0 4px}
#panel .pstats{font-size:9px;color:#8b7f6c;line-height:1.6;letter-spacing:.03em;margin-bottom:7px}
#panel .pstats span{color:#b9ac93}

<div id="app">

       parallasse, perché il campo si deve continuare a intravedere. -->

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════

   ═══════════════════════════════════════════════════════════ */

const TILE=16, COLS=12, ROWS=18, W=COLS*TILE, H=ROWS*TILE;
/* Cornice: il campo resta 192x288. La tela cresce mantenendo il rapporto 2:3
   (240x360): bordo di 24px ai lati e 36px sopra e sotto. MARG serve solo a
   evitare bordi neri quando lo schermo trema. */

const C={
  void:'#07060a', out:'#0a070c',
  stoneA:'#262030', stoneB:'#2d2637', stoneC:'#332b3e', crack:'#1a1522',
  pathA:'#463a32', pathB:'#3c3129', pathC:'#514236', pathEdge:'#241c1c',
  bone:'#d8cbb0', gold:'#c9a227', gold2:'#8a6f1c',

   quarto al sesto si entra nella città neon. È dichiarata prima del percorso
   perché anche gli ingombri decorativi cambiano materia fra i mondi. */
let INF=false,APO=false,CYBER=false,CYFASE=0;

/* ─────────── PIXEL ART ─────────── */

'.rrrrrrggrrrrrr.','rrrrrrrggrrrrrrr','rrrrrrrrrrrrrrrr','rrrrgggrrrgggrrr','rrrrrrrrrrrrrrrr',

/* ─────────── SPRITE CACHE (con outline automatico) ─────────── */
/* Righe di lunghezza diversa, o con uno spazio dentro, sono l'errore più
   facile da introdurre disegnando: la larghezza viene dalla prima riga, e
   tutto il resto scivola senza dire niente. Meglio fermarsi qui e dire dove. */
function controllaArt(art){
  const w=art[0].length;
  for(let r=0;r<art.length;r++){
    if(art[r].length!==w)
      throw new Error('sprite storta: riga '+r+' è lunga '+art[r].length+' invece di '+w);
    if(art[r].indexOf(' ')>=0)
      throw new Error('sprite con uno spazio: riga '+r+' — usa il punto per il vuoto');
  }

/* Il chiaroscuro non viene sfumato: nasce dai bordi dei gruppi di pixel.
   Ogni materia guadagna un filo di luce in alto a sinistra e un taglio scuro

   carta, e la stessa regola tiene insieme bestiario e architetture. */
function miscelaPixel(col,to,k){
  if(!/^#[0-9a-f]{6}$/i.test(col))return col;
  const n=parseInt(col.slice(1),16),m=parseInt(to.slice(1),16);
  const ch=s=>Math.round(((n>>s)&255)*(1-k)+((m>>s)&255)*k);
  return '#'+[ch(16),ch(8),ch(0)].map(v=>v.toString(16).padStart(2,'0')).join('');

function makeSprite(art,pal,outline,rifinita){
  controllaArt(art);
  const h=art.length,w=art[0].length;
  const cv=document.createElement('canvas'); cv.width=w+2; cv.height=h+2;
  const x=cv.getContext('2d');
  const filled=(r,c)=>r>=0&&c>=0&&r<h&&c<w&&art[r][c]!=='.';
  if(outline!==null){
    x.fillStyle=outline||C.out;
    for(let r=-1;r<=h;r++)for(let c=-1;c<=w;c++){
      if(filled(r,c))continue;
      if(filled(r-1,c)||filled(r+1,c)||filled(r,c-1)||filled(r,c+1))x.fillRect(c+1,r+1,1,1);
    }
  }
  for(let r=0;r<h;r++)for(let c=0;c<w;c++){
    const ch=art[r][c]; if(ch==='.')continue;
    const col=pal[ch]; if(!col)continue;
    x.fillStyle=col; x.fillRect(c+1,r+1,1,1);
  }
  if(rifinita!==false){
    const same=(r,c,ch)=>r>=0&&c>=0&&r<h&&c<w&&art[r][c]===ch;
    for(let r=0;r<h;r++)for(let c=0;c<w;c++){
      const ch=art[r][c],col=pal[ch];if(ch==='.'||!col)continue;
      const su=!same(r-1,c,ch),sx=!same(r,c-1,ch);
      const giu=!same(r+1,c,ch),dx=!same(r,c+1,ch);
      /* i dettagli di un solo pixel conservano il colore puro: il rilievo si
         posa soltanto sui blocchi abbastanza larghi da leggerlo davvero */
      if((su||sx)&&(same(r+1,c,ch)||same(r,c+1,ch))&&((r+c)&1)===0){
        x.fillStyle=miscelaPixel(col,'#fff4dc',.22);x.fillRect(c+1,r+1,1,1);
      }else if((giu||dx)&&(same(r-1,c,ch)||same(r,c-1,ch))&&((r*3+c)&1)===0){
        x.fillStyle=miscelaPixel(col,'#08060c',.28);x.fillRect(c+1,r+1,1,1);
      }else if(same(r-1,c,ch)&&same(r+1,c,ch)&&same(r,c-1,ch)&&same(r,c+1,ch)
        &&(r*11+c*7)%19===0){
        x.fillStyle=miscelaPixel(col,'#fff4dc',.12);x.fillRect(c+1,r+1,1,1);
      }
    }
  }
  return {cv,w,h};
}

}

function matricePixel(w,h){return Array.from({length:h},()=>Array(w).fill('.'));}
function pxPut(a,x,y,ch){if(y>=0&&y<a.length&&x>=0&&x<a[0].length)a[y][x]=ch;}
function pxBox(a,x,y,w,h,ch){for(let Y=y;Y<y+h;Y++)for(let X=x;X<x+w;X++)pxPut(a,X,Y,ch);}
function pxLine(a,x0,y0,x1,y1,ch){
  const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))||1;
  for(let i=0;i<=n;i++)pxPut(a,Math.round(x0+(x1-x0)*i/n),Math.round(y0+(y1-y0)*i/n),ch);
}
function cyberMobArt(ruolo,variante){
  const dim={base:[9,10],fast:[11,11],tank:[13,14],ghost:[11,13],big:[21,24],boss:[17,20],final:[29,30]}[ruolo];
  const w=dim[0],h=dim[1],a=matricePixel(w,h),cx=Math.floor(w/2);
  if(ruolo==='ghost'){
    pxBox(a,cx-2,1,5,4,'s');pxBox(a,cx-1,2,3,2,'x');pxPut(a,cx,2,'c');
    for(let y=5;y<h;y++)for(let x=1;x<w-1;x++)if(Math.abs(x-cx)<=Math.max(1,4-Math.floor((y-5)/2))&&((x+y)%3))pxPut(a,x,y,variante===1?'c':(variante===2?'p':'r'));
    return a.map(r=>r.join(''));
  }
  if(ruolo==='final'){
    for(let y=4;y<h;y++){const half=Math.min(cx-2,4+Math.floor((y-4)*.38));pxBox(a,cx-half,y,half*2+1,1,y>h-5?'x':'s');}
    pxBox(a,cx-5,8,11,10,'m');pxBox(a,cx-3,10,7,6,'x');pxBox(a,cx-1,11,3,4,'c');
    for(const dx of [-10,-6,6,10]){pxLine(a,cx+dx,h-5,cx+dx,7+Math.abs(dx)%4,'m');pxPut(a,cx+dx,6+Math.abs(dx)%4,'q');}
    for(let x=2;x<w-2;x+=4)pxPut(a,x,h-7,variante===1?'y':(variante===2?'c':'r'));
    return a.map(r=>r.join(''));
  }
  const grande=ruolo==='big'||ruolo==='boss',bodyW=grande?Math.floor(w*.62):(ruolo==='tank'?9:5);
  const headY=grande?2:1,headW=grande?7:(ruolo==='tank'?5:4);
  pxBox(a,cx-Math.floor(headW/2),headY,headW,4,'s');
  pxBox(a,cx-1,headY+1,3,2,'x');pxPut(a,cx,headY+1,variante===1?'c':(variante===2?'y':'r'));
  const bodyY=headY+4,bodyH=h-bodyY-3;
  pxBox(a,cx-Math.floor(bodyW/2),bodyY,bodyW,bodyH,'s');
  pxBox(a,cx-1,bodyY+1,3,Math.max(2,bodyH-2),ruolo==='tank'?'m':'x');
  pxPut(a,cx,bodyY+2,variante===1?'r':(variante===2?'c':'y'));
  if(ruolo==='fast'){
    pxLine(a,cx-2,bodyY+2,0,h-3,'r');pxLine(a,cx+2,bodyY+2,w-1,h-5,'c');
  }else{
    pxLine(a,cx-Math.floor(bodyW/2),bodyY+1,1,h-5,'m');
    pxLine(a,cx+Math.floor(bodyW/2),bodyY+1,w-2,h-5,'m');
  }
  const foot=Math.max(1,Math.floor(bodyW*.28));
  pxBox(a,cx-Math.floor(bodyW/2),h-3,foot,3,'x');pxBox(a,cx+Math.floor(bodyW/2)-foot+1,h-3,foot,3,'x');
  if(grande)for(let x=1;x<w-1;x+=4)pxPut(a,x,bodyY+Math.floor(bodyH/2),'c');
  if(ruolo==='boss'){pxLine(a,1,4,cx-3,bodyY+2,'p');pxLine(a,w-2,4,cx+3,bodyY+2,'p');}
  return a.map(r=>r.join(''));
}

/* `cyberMobArt` ricava la sagoma dal solo ruolo: fra un atto e l'altro cambia
   la tinta e due pixel, e in campo le schiere sembrano le stesse ridipinte.
   Chi ha una sagoma disegnata a mano in ART la usa; il generatore resta come
   ripiego per quelle non ancora fatte, e sparirà quando saranno tutte. */
for(let v=0;v<CY_SCHIERE.length;v++)for(const ruolo in CY_SCHIERE[v]){
  const nome=CY_SCHIERE[v][ruolo],art=ART[nome]||cyberMobArt(ruolo,v);
  reg(nome,art,PAL_NEON[v],'#ffffff');
  if(ruolo==='big'||ruolo==='final')reg(nome+'_b',art,PAL_NEON_B[v],'#ffffff');
}

const PAL_CY_TOW={s:'#343746',o:'#171a24',m:'#656b80',x:'#070a12',c:'#20d8ff',r:'#ff35b8',
  y:'#ffca48',q:'#e8fbff',p:'#7040d8',w:'#45495a',d:'#252936',b:'#556070',v:'#bff7ff',t:'#8a255f'};
const PAL_CY_TOW5={s:'#dce7ef',o:'#78889a',m:'#ffffff',x:'#101624',c:'#55eaff',r:'#ff65cf',
  y:'#fff2a6',q:'#ffffff',p:'#8b72ff',w:'#eef8ff',d:'#aab8c8',b:'#e8f2ff',v:'#ffffff',t:'#cf55ae'};
const CY_TOWER_SET=new Set(['impulso','plasma','stasi','rotaia','sciame','disturbo']);
function cyberTowerArt(tipo,lv){
  const w=14+(lv-1)*2,h=17+(lv-1)*3,a=matricePixel(w,h),cx=Math.floor(w/2),base=h-5;
  pxBox(a,2,base,w-4,4,'s');pxBox(a,3,base+1,w-6,1,'m');pxBox(a,4,h-2,w-8,1,'o');
  for(let x=4;x<w-4;x+=4)pxPut(a,x,base+2,(x+lv)%2?'c':'r');
  if(tipo==='impulso'){
    pxBox(a,cx-2,5,5,base-5,'s');pxBox(a,cx-1,7,3,base-8,'x');pxPut(a,cx,8,'c');
    const n=1+Math.floor(lv/2);for(let i=-n;i<=n;i+=2){pxBox(a,cx+i-1,2,2,5,'m');pxPut(a,cx+i,1,'c');}
  }else if(tipo==='plasma'){
    pxBox(a,cx-4,6,9,base-6,'s');pxBox(a,cx-2,7,5,base-8,'x');
    pxBox(a,cx-1,8,3,Math.max(3,base-10),lv===4?'q':'y');
    pxLine(a,cx-5,5,cx-3,2,'m');pxLine(a,cx+5,5,cx+3,2,'m');
  }else if(tipo==='stasi'){
    pxBox(a,cx-2,7,5,base-7,'s');
    for(let d=0;d<4+lv;d++){pxPut(a,cx-d,6+Math.abs(d-2),'p');pxPut(a,cx+d,6+Math.abs(d-2),'p');}
    pxBox(a,cx-1,5,3,3,'q');pxPut(a,cx,6,'r');
  }else if(tipo==='rotaia'){
    pxBox(a,cx-3,3,7,base-3,'s');pxBox(a,cx-1,1,3,base-2,'x');pxBox(a,cx,2,1,base-4,'r');
    pxLine(a,cx-4,base-1,cx-2,5,'m');pxLine(a,cx+4,base-1,cx+2,5,'m');
  }else if(tipo==='sciame'){
    pxBox(a,cx-3,7,7,base-7,'s');pxBox(a,cx-1,9,3,3,'p');
    const n=2+lv;for(let i=0;i<n;i++){const side=i%2?-1:1,dx=side*(4+(i%3)*2),dy=3+(i*3)%(base-4);pxBox(a,cx+dx-1,dy,3,2,'m');pxPut(a,cx+dx,dy,'c');pxLine(a,cx+side*3,9,cx+dx,dy+1,'o');}
  }else{
    pxBox(a,cx-3,7,7,base-7,'s');pxBox(a,cx-1,8,3,base-10,'r');
    pxLine(a,cx,7,cx,2,'m');pxPut(a,cx,1,'c');
    for(let n=1;n<=Math.min(3,lv);n++){pxPut(a,cx-n*2,2+n,'p');pxPut(a,cx+n*2,2+n,'p');pxPut(a,cx-n*2-1,3+n,'p');pxPut(a,cx+n*2+1,3+n,'p');}
  }
  return a.map(r=>r.join(''));
}

function blit(x,sp,px,py,flip,alpha){
  if(alpha!==undefined)x.globalAlpha=alpha;
  if(flip){x.save();x.translate(Math.round(px)+sp.w/2,0);x.scale(-1,1);
    x.drawImage(sp.cv,-sp.w/2-1,Math.round(py)-1);x.restore();}
  else x.drawImage(sp.cv,Math.round(px)-1,Math.round(py)-1);
  if(alpha!==undefined)x.globalAlpha=1;
}

/* ─────────── PERCORSO ─────────── */
/* Un tracciato per scenario. Gli estremi non si toccano: il valico a nord è
   disegnato sulla colonna 1 e il cancello in basso sulla colonna 5, cuciti
   nella scenografia (drawNord, drawSagrato, buildFG, buildBG) e nel punto in
   cui si conta una fuga. A variare è solo il modo di andare dall'uno all'altro:
   quattro traverse nella Veglia, tre nella Discesa, due nel Giudizio. Meno
   serpentina vuol dire meno tempo sotto tiro, ed è per questo che il gradino
   di ATTO[a].hp è tarato sul percorso dell'atto, non in astratto. */
const WPS={
  1:[[1,-2],[1,2],[10,2],[10,6],[2,6],[2,10],[9,10],[9,14],[5,14],[5,19]],  // 53 caselle
  2:[[1,-2],[1,3],[9,3],[9,9],[2,9],[2,14],[5,14],[5,19]],                  // 39 caselle
  3:[[1,-2],[1,5],[8,5],[8,12],[5,12],[5,19]],                              // 31 caselle
  4:[[1,-2],[1,3],[10,3],[10,7],[3,7],[3,12],[8,12],[8,15],[5,15],[5,19]],
  5:[[1,-2],[1,4],[9,4],[9,9],[2,9],[2,14],[5,14],[5,19]],
  6:[[1,-2],[1,5],[10,5],[10,11],[4,11],[4,15],[5,15],[5,19]]
};
let WP=WPS[1];
const PATHPX=[],SEGLEN=[],pathSet=new Set();
const isPath=(c,r)=>pathSet.has(r*COLS+c);

/* Le decorazioni sono una lista sola: quelle che cadono sulla via dell'atto
   corrente semplicemente non si posano. Con i tracciati attuali ne salta una
   nella Discesa e una nel Giudizio. */
const DECOR_ALL=[[0,0,'statua'],[11,0,'croce'],[6,1,'candela'],[11,5,'candela'],[4,4,'croce'],
 [0,9,'statua'],[6,9,'candela'],[7,8,'croce'],[8,12,'candela'],[3,13,'statua'],
 [1,16,'croce'],[10,16,'candela'],[0,17,'croce'],[11,17,'statua']];
const DECOR=[];
const blocked=new Set();
const LIGHTS=[];

/* Rifà percorso, ingombri e griglia per uno scenario. Va chiamata solo a campo
   vuoto: i nemici portano `seg`/`segD`, indici dentro SEGLEN, e cambiare il
   tracciato sotto ai loro piedi li spedirebbe fuori strada. */
function buildPercorso(a){
  WP=WPS[a]||WPS[1];
  PATHPX.length=0;
  for(const p of WP)PATHPX.push({x:p[0]*TILE+TILE/2,y:p[1]*TILE+TILE/2});
  SEGLEN.length=0;
  for(let i=0;i<PATHPX.length-1;i++){
    const p=PATHPX[i],q=PATHPX[i+1];SEGLEN.push(Math.hypot(q.x-p.x,q.y-p.y));}
  pathSet.clear();
  for(let i=0;i<WP.length-1;i++){
    const [c1,r1]=WP[i],[c2,r2]=WP[i+1];
    const dc=Math.sign(c2-c1),dr=Math.sign(r2-r1);
    let c=c1,r=r1;
    for(let g=0;g<80;g++){
      if(c>=0&&c<COLS&&r>=0&&r<ROWS)pathSet.add(r*COLS+c);
      if(c===c2&&r===r2)break; c+=dc; r+=dr;
    }
  }
  DECOR.length=0;blocked.clear();LIGHTS.length=0;
  for(const d of DECOR_ALL){
    if(isPath(d[0],d[1]))continue;
    const tipo=CYBER?(d[2]==='candela'?'terminale':(d[2]==='croce'?'antenna':'segnale')):d[2];
    DECOR.push([d[0],d[1],tipo]);blocked.add(d[1]*COLS+d[0]);

function waveDef(n){
  const g=[],cap=(v,x)=>Math.min(v,x);
  g.push({t:'base',n:cap(5+Math.floor(n*1.4),26),gap:.85,delay:0});
  if(n>=3)g.push({t:'fast',n:cap(3+Math.floor(n*.8),20),gap:.55,delay:4.5});
  if(n>=5)g.push({t:'tank',n:cap(2+Math.floor(n*.45),12),gap:1.7,delay:8});
  if(n>=8)g.push({t:'ghost',n:cap(2+Math.floor(n*.55),16),gap:.7,delay:12});
  if(n>=6&&(n-6)%5===0)g.push({t:'big',n:1+Math.floor(n/12),gap:9,delay:13});
  const chiude=(n%20===0);   // ogni ventesima chiude un atto: scende il Signore
  if(n%10===0&&!chiude)g.push({t:'boss',n:1,gap:7,delay:5});
  if(chiude)g.push({t:'final',n:1,gap:1,delay:24});
  return g;
}

function quaterneValida(q){
  const out=[];
  for(const k of (Array.isArray(q)?q:[]))
    if(TOWERS[k]&&out.indexOf(k)<0&&out.length<NSLOT)out.push(k);
  for(const k of QUATERNA_BASE){if(out.length>=NSLOT)break;
    if(out.indexOf(k)<0)out.push(k);}
  for(const k of TORDER){if(out.length>=NSLOT)break;
    if(out.indexOf(k)<0)out.push(k);}
  return out;
}

function audio(){

    noiseBuf=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);

  }catch(e){}

function tone(f,dur,type,vol,slide){
  if(!G.sound||!AC)return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,AC.currentTime);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),AC.currentTime+dur);
  g.gain.setValueAtTime(0,AC.currentTime);
  g.gain.linearRampToValueAtTime(vol||.06,AC.currentTime+.008);
  g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+dur);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+dur+.02);
}
function noise(dur,vol,freq){
  if(!G.sound||!AC||!noiseBuf)return;
  const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();
  s.buffer=noiseBuf;f.type='bandpass';f.frequency.value=freq||900;f.Q.value=1.2;
  g.gain.setValueAtTime(vol||.05,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+dur);
  s.connect(f);f.connect(g);g.connect(AC.destination);s.start();s.stop(AC.currentTime+dur);
}

function rect(g,col,X,Y,Wd,Ht){g.fillStyle=col;g.fillRect(X|0,Y|0,Wd===undefined?1:Wd,Ht===undefined?1:Ht);}

/* creste montuose: picchi triangolari interpolati fra vertici casuali */
function ridgePts(x0,x1,base,minH,maxH,step){
  const p=[[x0,base-minH]];
  let X=x0+step*(.4+rnd()*.6);
  while(X<x1){p.push([X|0,(base-(minH+rnd()*(maxH-minH)))|0]);X+=step*(.5+rnd()*.9);}
  p.push([x1,base-minH]);return p;
}
function fillRidge(g,p,bottom,col,topCol,snowY){
  for(let i=0;i<p.length-1;i++){
    const ax=p[i][0],ay=p[i][1],bx2=p[i+1][0],by=p[i+1][1],dx=(bx2-ax)||1;
    for(let X=ax;X<bx2;X++){
      const Y=Math.round(ay+(by-ay)*(X-ax)/dx);
      rect(g,col,X,Y,1,bottom-Y);
      rect(g,topCol,X,Y,1,1);
      if(snowY&&Y<snowY&&rnd()<.55)rect(g,topCol,X,Y+1,1,1+((rnd()*2)|0));
    }
  }
}
/* conifera */
function conifer(g,cx,by,h,col,hi){
  for(let i=0;i<h;i++){
    const w=Math.round((i/h)*h*.40);
    rect(g,col,cx-w,by-h+i,w*2+1,1);
    if(i>2&&i%3===0)rect(g,hi,cx-w,by-h+i,1,1);
    if(i>2&&i%4===0)rect(g,hi,cx+w,by-h+i,1,1);
  }
  rect(g,CF.trunk,cx,by-2,1,3);
}

  if(kind===0){ // teschio
    rect(g,'#c6b99e',X+3,Y+7,5,4);rect(g,'#c6b99e',X+4,Y+11,3,1);
    rect(g,'#100c14',X+4,Y+8,1,2);rect(g,'#100c14',X+6,Y+8,1,2);
    rect(g,'#8f836c',X+3,Y+7,5,1);
  }else if(kind===1){ // candela
    rect(g,'#c8bda2',X+5,Y+9,2,6);rect(g,'#8f836c',X+4,Y+14,4,2);
    rect(g,'#f2c14e',X+5,Y+7,2,2);rect(g,'#f7e08a',X+5,Y+7,1,1);
    LIGHTS.push({x:X+6-OX,y:Y+7-OY});
  }else if(kind===2){ // catena
    for(let i=0;i<5;i++){rect(g,'#5c5344',X+5,Y+4+i*2,2,1);rect(g,'#3d372c',X+5,Y+5+i*2,2,1);}
    rect(g,'#5c5344',X+4,Y+14,4,1);
  }else{ // stendardo
    rect(g,'#5c5344',X+2,Y+4,7,1);
    rect(g,'#5a1c28',X+3,Y+5,5,8);
    rect(g,'#c9a227',X+5,Y+7,1,4);rect(g,'#c9a227',X+4,Y+8,3,1);
    rect(g,'#5a1c28',X+3,Y+13,2,1);rect(g,'#5a1c28',X+6,Y+13,2,1);

}
/* ═══ LE PARETI DELLA CITTÀ ═══
   Al posto dei conci, delle merlature e delle nicchie con i teschi: facciate
   di pannelli, condotti che corrono in verticale, finestre accese e insegne.
   Le insegne prendono il posto delle nicchie una per una — stessa cadenza,
   stessa funzione (rompere la parete e fare luce), altro mondo. */
function insegnaCyber(g,X,Y,kind){
  const acc=CF.trim,vet=CF.win;
  rect(g,'#04070d',X-1,Y+1,13,17);            // cassa spenta
  rect(g,CF.wallLip,X-1,Y+1,13,1);
  rect(g,CF.wallLip,X-1,Y+17,13,1);
  if(kind===0){                                // schermo con scansione
    rect(g,'#071320',X+1,Y+3,9,13);
    for(let i=0;i<6;i++)rect(g,i%2?vet:'#0d2438',X+1,Y+4+i*2,9,1);
    rect(g,acc,X+1,Y+3,9,1);
    LIGHTS.push({x:X+5-OX,y:Y+9-OY});
  }else if(kind===1){                          // colonna di caratteri
    rect(g,'#050d16',X+1,Y+3,9,13);
    for(let i=0;i<5;i++){
      const w=2+((rnd()*4)|0);
      rect(g,rnd()<.4?vet:acc,X+2+((rnd()*3)|0),Y+4+i*2.4,w,1);
    }
    LIGHTS.push({x:X+5-OX,y:Y+9-OY});
  }else if(kind===2){                          // condotto e valvola
    rect(g,'#0a1220',X+3,Y+2,5,15);
    for(let i=0;i<4;i++)rect(g,CF.wallLip,X+3,Y+4+i*3,5,1);
    rect(g,acc,X+4,Y+9,3,3);rect(g,vet,X+5,Y+10,1,1);
  }else{                                       // insegna al neon, un glifo
    rect(g,'#060b14',X+1,Y+3,9,13);
    rect(g,acc,X+3,Y+5,5,1);rect(g,acc,X+3,Y+5,1,9);
    rect(g,acc,X+3,Y+9,4,1);rect(g,acc,X+3,Y+13,5,1);
    rect(g,vet,X+7,Y+6,1,3);
    LIGHTS.push({x:X+5-OX,y:Y+9-OY});
  }
}
function drawMuraCyber(g){
  for(const lato of [0,1]){
    const x0=lato?CW-OX:0;
    // facciata: pannelli larghi separati da giunti orizzontali
    let y=-2;
    while(y<CH+6){
      const h=7+((rnd()*4)|0);
      rect(g,CF.wall[(rnd()*4)|0],x0,y,OX,h);
      rect(g,CF.mortar,x0,y+h-1,OX,1);
      // finestre accese, rade
      let X=x0+2;
      while(X<x0+OX-3){
        if(rnd()<.30){
          const w=2+((rnd()*3)|0),hh=Math.max(1,h-4);
          rect(g,rnd()<.35?CF.win:'#0d1c2c',X,y+2,w,hh);
        }
        X+=4+((rnd()*4)|0);
      }
      y+=h;
    }
    // condotti verticali
    for(let k=0;k<2;k++){
      const cx=x0+3+k*11;
      rect(g,'#070c16',cx,0,3,CH);
      for(let Y=-2;Y<CH;Y+=9)rect(g,CF.wallLip,cx,Y,3,1);
      if(k===1)for(let Y=0;Y<CH;Y+=26)rect(g,CF.trim,cx+1,Y,1,4);
    }
    // insegne, alla stessa cadenza delle nicchie
    let k=lato?2:0;
    for(let ny=48;ny<CH-58;ny+=46){insegnaCyber(g,x0+(lato?7:6),ny,k%4);k++;}
    // spigolo interno: un tubo acceso invece della lesena
    const li=lato?x0:x0+OX-3;
    rect(g,'#05090f',li,0,3,CH);
    rect(g,CF.trim,li+(lato?0:2),0,1,CH);
    for(let Y=0;Y<CH;Y+=7)rect(g,CF.wallLip,li,Y,3,1);
    // gocce di pioggia sul filo interno: la città non smette mai
    for(let Y=0;Y<CH;Y++)if(rnd()<.05)rect(g,CF.star,li+(lato?3:-1),Y,1,1+((rnd()*3)|0));
  }
}
function drawMura(g){
  if(CYBER){drawMuraCyber(g);return;}
  for(const lato of [0,1]){
    const x0=lato?CW-OX:0;
    // conci
    let y=-2,row=0;
    while(y<CH+6){
      let X=x0+(row%2?-5:0);
      while(X<x0+OX){
        const w=7+((rnd()*6)|0);
        const cx=Math.max(x0,X),cw=Math.min(X+w,x0+OX)-cx;
        if(cw>0){
          rect(g,CF.wall[(rnd()*4)|0],cx,y,cw,6);
          rect(g,CF.mortar,cx,y+5,cw,1);
          rect(g,CF.mortar,Math.min(X+w-1,x0+OX-1),y,1,6);
          if(rnd()<.14)rect(g,'#191420',cx+((rnd()*cw)|0),y+1+((rnd()*3)|0),1+((rnd()*2)|0),1);
          if(rnd()<.09)rect(g,CF.moss,cx+((rnd()*cw)|0),y+((rnd()*5)|0),1,1+((rnd()*2)|0));
        }
        X+=w;
      }
      y+=6;row++;
    }
    // merlatura in cima
    for(let X=x0;X<x0+OX;X+=8){
      rect(g,'#07060a',X,0,4,5);
      rect(g,CF.wallLip,X+4,4,4,1);
    }
    // nicchie
    let k=lato?2:0;
    for(let ny=48;ny<CH-58;ny+=46){nicchia(g,x0+(lato?7:6),ny,k%4);k++;}
    // spigolo interno: lesena
    const li=lato?x0:x0+OX-3;
    rect(g,'#191420',li,0,3,CH);
    for(let Y=2;Y<CH;Y+=7)rect(g,'#2e2738',li,Y,3,1);
    // rampicanti sul bordo interno
    for(let Y=0;Y<CH;Y++)if(rnd()<.06)rect(g,'#1e3324',li+(lato?3:-1),Y,1,1+((rnd()*3)|0));
  }
}

function drawSagrato(g){
  if(CYBER){drawTerminaleCyber(g);return;}
  const y0=CH-OY, gx=OX+5*TILE+TILE/2, pav=7;
  // lastricato consacrato
  rect(g,CF.sagB,0,y0,CW,pav);
  for(let Y=y0-1;Y<y0+pav;Y+=4)for(let X=-5+((Y%2)?6:0);X<CW;X+=13){
    rect(g,rnd()<.5?CF.sagA:CF.sagC,X,Y,12,3);
    rect(g,'#37303f',X,Y+3,12,1);rect(g,'#37303f',X+12,Y,1,4);
    if(rnd()<.3)rect(g,'#5a5266',X+1+((rnd()*9)|0),Y+((rnd()*2)|0),1,1);
  }
  // due archi d'oro incisi attorno alla soglia
  for(let a=-1.5;a<=1.5;a+=.015){
    const rX=Math.round(gx+Math.sin(a)*30),rY=Math.round(y0+1+Math.cos(a)*4.5);
    if(rY>=y0&&rY<y0+pav)rect(g,CF.sagGold,rX,rY);
  }
  rect(g,'#6d5820',0,y0+pav-1,CW,1);
  // la via che entra in chiesa
  for(let Y=y0;Y<y0+pav+2;Y++){
    const w=8-Math.round((Y-y0)/pav*2);
    rect(g,Y%2?C.pathB:C.pathA,gx-w,Y,w*2,1);
  }
  // candele votive e lapidi
  for(const cx of [gx-50,gx-32,gx+32,gx+50]){
    rect(g,'#9a8e74',cx-2,y0+4,5,3);rect(g,'#d3c8ad',cx,y0+1,2,3);
    rect(g,'#f2c14e',cx,y0,2,1);rect(g,'#f7e08a',cx,y0,1,1);
    LIGHTS.push({x:cx+1-OX,y:y0-OY});
  }
  for(const cx of [OX+6,CW-OX-10]){
    rect(g,'#4a4356',cx,y0+1,6,6);rect(g,'#5c5468',cx,y0+1,6,1);
    rect(g,'#332c3e',cx+2,y0+3,2,1);
  }
  // gradini davanti alla soglia
  for(let i=0;i<3;i++){
    rect(g,i%2?'#5c5468':'#4a4356',gx-13-i*2,y0+pav-3+i,26+i*4,1);
    rect(g,'#332c3e',gx-13-i*2,y0+pav-2+i,26+i*4,1);
  }
  // ── facciata della cattedrale ──
  const fy=y0+pav;
  rect(g,CF.cath,0,fy,CW,CH-fy);
  for(let Y=fy+4;Y<CH;Y+=4)rect(g,'#1a1527',0,Y,CW,1);
  for(let Y=fy+4;Y<CH;Y+=4)for(let X=(Y%8)?0:6;X<CW;X+=12)rect(g,'#1a1527',X,Y-3,1,3);
  rect(g,CF.cathHi,0,fy,CW,3);rect(g,CF.trim,0,fy+3,CW,1);
  for(let X=1;X<CW;X+=9)rect(g,CF.cathHi,X,fy-3,5,3);
  // torri laterali con guglie
  for(const tx of [OX+4,CW-OX-22]){
    rect(g,CF.cathHi,tx,fy-9,18,CH-fy+9);
    rect(g,CF.cath,tx+2,fy-6,14,CH-fy+6);
    rect(g,CF.trim,tx,fy-9,18,1);
    for(let i=0;i<4;i++)rect(g,'#07060a',tx+1+i*5,fy-9,3,3);
    for(let i=0;i<6;i++)rect(g,CF.cathHi,tx+8-i,fy-15+i,3+i*2,1);
    rect(g,CF.win,tx+8,fy+8,2,7);rect(g,'#6d5820',tx+7,fy+7,4,1);
    rect(g,'#3a3020',tx+7,fy+7,1,9);rect(g,'#3a3020',tx+10,fy+7,1,9);
  }
  // rosone
  const rx=gx,ry=fy+9;const _r=5;
  for(let dy=-_r;dy<=_r;dy++)for(let dx=-_r;dx<=_r;dx++){
    const d=dx*dx+dy*dy;
    if(d>_r*_r)continue;
    let col='#241b12';
    if(d>_r*_r-6)col=CF.trim;
    else if(d>_r*_r-11)col='#4a3c1c';
    else if(Math.abs(dx)<1||Math.abs(dy)<1||Math.abs(Math.abs(dx)-Math.abs(dy))<1)col=CF.win;
    else if(d<4)col='#f7e08a';
    else if(d<14)col='#8a6f1c';
    rect(g,col,rx+dx,ry+dy);
  }
  // portale
  const px0=rx-10,py0=fy+21;
  rect(g,CF.cathHi,px0-3,py0-2,26,CH-py0+2);
  for(let i=0;i<4;i++)rect(g,CF.cathHi,px0-3+i,py0-2-i,26-i*2,2);
  rect(g,CF.trim,px0-1,py0,1,CH-py0);rect(g,CF.trim,px0+20,py0,1,CH-py0);
  // lancette e contrafforti
  for(const wx of [gx-34,gx+32]){
    rect(g,'#2e2718',wx,fy+9,4,13);rect(g,'#8a6f1c',wx+1,fy+11,2,10);
    rect(g,'#4a3c1c',wx,fy+8,4,1);
  }
  for(let X=OX+26;X<CW-OX-26;X+=22){
    if(Math.abs(X-gx)<26)continue;
    rect(g,'#0c0a12',X,fy+4,2,CH-fy-4);rect(g,'#1c1728',X+2,fy+4,1,CH-fy-4);
  }
}

/* ═══ PRIMO PIANO: chioma del bosco a nord, portale a sud ═══ */
const fgc=document.createElement('canvas');fgc.width=CW;fgc.height=CH;
const fg=fgc.getContext('2d');fg.imageSmoothingEnabled=false;
function buildFG(){
  fg.clearRect(0,0,CW,CH);
  const gx=OX+TILE+TILE/2;
  if(CYBER){
    // cavi e tetti tecnici stringono il varco d'ingresso; il centro resta libero
    for(const side of [-1,1]){
      const ax=gx+side*20;
      rect(fg,'#03060b',ax-(side<0?16:0),0,16,18);
      for(let i=0;i<4;i++){rect(fg,CF.cathHi,ax+side*i*3,2+i*4,side*3,1);rect(fg,CF.win,ax+side*i*3,2+i*4,1,1);}
    }
    const rx=OX+5*TILE+TILE/2,py0=CH-OY+28;
    rect(fg,CF.portal,rx-9,py0,19,CH-py0);
    for(let i=0;i<5;i++)rect(fg,CF.portal,rx-9+i,py0-i,19-i*2,2);
    rect(fg,CF.win,rx-10,py0-1,1,CH-py0+1);rect(fg,CF.trim,rx+10,py0-1,1,CH-py0+1);
    return;
  }
  // limitare del bosco: fronde fitte da cui esce la processione
  for(let X=gx-24;X<=gx+24;X++){
    const t=Math.abs(X-gx)/24;
    let h=20+Math.round(t*5)+((rnd()*4)|0)-1;
    for(let Y=0;Y<h;Y++){
      if(Y>h-5&&rnd()<.4)continue;
      rect(fg,'#060a08',X,Y,1,1);
    }
    // fronde pendenti
    if(rnd()<.35)rect(fg,'#080e0a',X,h,1,1+((rnd()*3)|0));
    rect(fg,rnd()<.25?'#101c16':'#080e0a',X,h-1,1,1);
  }
  conifer(fg,gx-19,30,30,'#050807','#0d1510');
  conifer(fg,gx+19,32,32,'#050807','#0d1510');
  conifer(fg,gx-9,22,22,'#060a08','#0d1510');
  conifer(fg,gx+10,21,21,'#060a08','#0d1510');
  conifer(fg,gx,17,18,'#050807','#0b120e');
  // rami che scendono ai lati del varco
  for(let i=0;i<9;i++){
    const bx0=gx+(i%2?12:-12),by0=8+i*2;
    rect(fg,'#060a08',bx0,by0,(i%2?1:-1)*(3+(i%3)),1);
  }
  // soglia del portale: i nemici vi scompaiono dentro
  const rx=OX+5*TILE+TILE/2,py0=CH-OY+28;
  rect(fg,CF.portal,rx-9,py0,19,CH-py0);
  for(let i=0;i<5;i++)rect(fg,CF.portal,rx-9+i,py0-Math.round(i*1.2),19-i*2,2);
  rect(fg,'#4a3c1c',rx-10,py0-1,1,CH-py0+1);rect(fg,'#4a3c1c',rx+10,py0-1,1,CH-py0+1);
  rect(fg,'#2a2114',rx-9,py0-9,19,1);
}
/* ═══ ATMOSFERA: nebbia sul bosco e cenere che cade ═══ */
const FLAKES=[];
for(let i=0;i<30;i++)FLAKES.push({x:rnd()*CW,ph:rnd()*90,sp:5+rnd()*11,dr:.4+rnd()*1.6,s:rnd()<.18?2:1});
let atime=0;
function drawNebbia(){
  for(let i=0;i<3;i++){
    const off=Math.sin(atime*.22+i*2.1)*26;
    x.globalAlpha=(CYBER?.035:(APO?.075:(INF?.06:.045)))+.022*Math.sin(atime*.7+i);
    x.fillStyle=CYBER?(CYFASE===1?'#82ff75':'#20d8ff'):(APO?'#e8e8f0':(INF?'#c0664a':'#9fb0c0'));
    x.fillRect(-OX,-OY+24+i*4,CW,2);
    x.fillStyle=CYBER?'#ff3bd4':(APO?'#b9c0d0':(INF?'#8e3a24':'#7d8ea0'));
    x.fillRect(-OX+off,-OY+26+i*4,CW*.5,1);
  }
  x.globalAlpha=1;
}
function drawCenere(){
  x.fillStyle=CYBER?(CYFASE===1?'#b7ff45':'#20d8ff'):(APO?'#f2ecd8':(INF?'#e8703a':'#c3b9d0'));
  for(let i=0;i<FLAKES.length;i++){
    const f=FLAKES[i];
    const t=(atime*f.sp+f.ph*9)%(CH+30);
    const Y=(INF&&!CYBER?(CH+30-t):t)-OY-15;
    const X=-OX+((f.x+(CYBER?atime*f.dr:Math.sin(atime*f.dr+f.ph)*8))%CW+CW)%CW;
    x.globalAlpha=Y<-OY+6?.12:.3;
    x.fillRect(X|0,Y|0,f.s,CYBER?f.s+2:f.s);
  }
  x.globalAlpha=1;
}

/* ═══ SFONDO DELLE SCHERMATE: parallasse ═══
   Sei strati che scorrono a velocità diverse dietro menu, compendio, fine
   atto, vittoria e sconfitta. Il cielo con la luna sta fermo (è lontano
   all'infinito), le creste vanno piano, il bosco in fretta, la sterpaglia
   di corsa. Ogni strato mobile è una tela larga MW disegnata due volte —
   a -off e a MW-off — così il giro si chiude senza cuciture.
   La tinta segue l'atto: gli strati leggono C/CF correnti, che applyAct
   ha già cambiato. Il seme viene salvato e rimesso a posto: è lo stesso
   di buildBG, e sporcarlo cambierebbe il fondale del campo. */
const mcv=document.getElementById('menubg');
const mg=mcv.getContext('2d');mg.imageSmoothingEnabled=false;
let MW=0,MH=0,MSC=0,MHZ=0,MACT=0,MMX=0,MMY=0,MMR=0,MHALO=null,MFOG=null,MFOFF=0,mtime=0;
const MLAY=[],MOFF=[0,0,0,0,0,0,0],MSPD=[0,4,7,11,17,28,40],MFLAKES=[];

/* la tela riempie il viewport a scala intera: pixel quadrati, niente sbavature */
function menuBgFit(){
  const a=document.getElementById('app');
  const vw=Math.max(1,a.clientWidth||CW),vh=Math.max(1,a.clientHeight||CH);
  const s=Math.max(2,Math.round(vw/150));
  const w=Math.ceil(vw/s),h=Math.ceil(vh/s);
  if(w===MW&&h===MH&&s===MSC)return false;
  /* l'orizzonte segue l'altezza dello schermo — il cielo sta dietro il testo,
     il paesaggio dietro i bottoni. Tutto il resto è misurato sulla LARGHEZZA:
     su un telefono alto MH cambia molto, MW quasi niente, e legare i rilievi
     all'altezza li stirava fino a farne guglie. */
  MW=w;MH=h;MSC=s;MHZ=Math.round(MH*.72);
  mcv.width=MW;mcv.height=MH;
  mg.imageSmoothingEnabled=false;
  if(mcv.style){mcv.style.width=(MW*s)+'px';mcv.style.height=(MH*s)+'px';}
  return true;
}
function mLayer(){
  const c=document.createElement('canvas');c.width=MW;c.height=MH;
  const q=c.getContext('2d');q.imageSmoothingEnabled=false;return q;
}
/* chi sta a cavallo del bordo va ridisegnato dall'altra parte, altrimenti
   il punto di ricongiunzione si vede. I casuali si tirano PRIMA di chiamare
   questa, se no le due copie escono diverse. */
function mWrap(f,cx){
  f(cx);
  if(cx>MW-16)f(cx-MW);
  if(cx<16)f(cx+MW);
}
/* cielo: bande, stelle, luna. Due terne per atto: il colore allo zenit
   e quello all'orizzonte, interpolati riga per riga */
const MSKY=[[9,7,17,26,20,35],[14,6,6,46,18,14],[8,10,18,34,40,58],
  [2,5,13,8,22,38],[3,8,7,18,38,25],[2,3,12,16,12,45]];
function mkCielo(){
  const q=mLayer(),k=MSKY[CYBER?3+CYFASE:(APO?2:(INF?1:0))];
  for(let y=0;y<MHZ;y++){
    const t=y/MHZ;
    rect(q,'rgb('+Math.round(k[0]+t*(k[3]-k[0]))+','+Math.round(k[1]+t*(k[4]-k[1]))
      +','+Math.round(k[2]+t*(k[5]-k[2]))+')',0,y,MW,1);
  }
  for(let i=0,n=Math.round(MW*MHZ/230);i<n;i++)
    rect(q,rnd()<.3?CF.star:CF.star2,(rnd()*MW)|0,(rnd()*MHZ*.86)|0);
  // luna di sangue, la stessa dell'orizzonte del campo ma più grande
  MMR=Math.max(5,Math.round(MW*.088));MMX=Math.round(MW*.72);MMY=Math.round(MHZ*.28);
  const mr=MMR,alo=Math.round(mr*2.1);
  for(let dy=-alo;dy<=alo;dy++)for(let dx=-alo;dx<=alo;dx++){
    const d=Math.sqrt(dx*dx+dy*dy);
    if(d>mr&&d<alo&&rnd()<(alo-d)/(alo*.6))
      rect(q,d<alo*.72?(CYBER?(CYFASE===1?'#5b4215':'#163d55'):(APO?'#b9c0d0':(INF?'#7a2a12':'#3a1622')))
                      :(CYBER?'#071523':(APO?'#6a7488':(INF?'#3d1408':'#251020'))),MMX+dx,MMY+dy);
  }
  for(let dy=-mr;dy<=mr;dy++)for(let dx=-mr;dx<=mr;dx++){
    const d=dx*dx+dy*dy;
    if(d>mr*mr)continue;
    if(CYBER)rect(q,d>mr*mr-mr*2?(CYFASE===1?'#ffd34f':'#73f4ff'):'#050912',MMX+dx,MMY+dy);
    else if(APO)rect(q,d>mr*mr-mr*2?'#e8e0c0':'#ffffff',MMX+dx,MMY+dy);
    else if(INF)rect(q,d>mr*mr-mr*2?'#e8703a':'#090405',MMX+dx,MMY+dy);
    else rect(q,d>mr*mr-mr*1.6?'#a3424a':(dx+dy<-mr*.5?'#8a2f3a':'#68202c'),MMX+dx,MMY+dy);
  }
  if(CYBER){
    rect(q,CYFASE===2?'#ff3bd4':'#20d8ff',MMX-mr-4,MMY-1,mr*2+8,2);
    for(let i=0;i<22;i++){const a=rnd()*6.283,l=mr+2+rnd()*mr*1.4;
      rect(q,rnd()<.7?'#20d8ff':'#ff3bd4',MMX+Math.cos(a)*l,MMY+Math.sin(a)*l);}
  }else if(APO)for(let i=0;i<40;i++){const a=rnd()*6.283,l=mr+1+rnd()*mr*1.6;
    rect(q,rnd()<.5?'#ffffff':'#c9d4e8',MMX+Math.cos(a)*l,MMY+Math.sin(a)*l);}
  else if(INF)for(let i=0;i<18;i++){const a=rnd()*6.283,l=mr+2+rnd()*mr;
    rect(q,'#a3421a',MMX+Math.cos(a)*l,MMY+Math.sin(a)*l);}
  else{rect(q,'#521a24',MMX-5,MMY-2,3,3);rect(q,'#521a24',MMX+2,MMY+3,4,2);
    rect(q,'#521a24',MMX+3,MMY-5,2,2);}
  return q.canvas;
}
/* creste: ridgePts apre e chiude alla stessa quota, quindi si cuciono da sole */
function mkCresta(base,minH,maxH,passo,col,top,neve){
  const q=mLayer();
  fillRidge(q,ridgePts(0,MW,base,minH,maxH,passo),MH,col,top,neve);
  return q.canvas;
}
/* Abbazia lontana: il nuovo punto focale del panorama. È abbastanza bassa da
   lasciare respiro al titolo e vive in uno strato proprio, quindi scorre con
   la valle senza strappare il loop. Le due copie non sono identiche: una è
   una grande rovina, l'altra poco più di una cappella spezzata. */
function mkAbbazia(){
  const q=mLayer(),base=MHZ+Math.round(MW*.16);
  const corpo=CF.treeA,profilo=CF.mtnNearTop;
  const luce=APO?'#e8d98a':(INF?'#e8703a':'#b08c3a');
  const rovina=(cx,sc,cappella)=>mWrap(x0=>{
    const w=Math.round(MW*(cappella?.12:.25)*sc),h=Math.round(MW*(cappella?.20:.38)*sc);
    const l=x0-Math.floor(w/2),t=base-h;
    rect(q,corpo,l,t+Math.round(h*.36),w,h);
    // tetto della navata: una cuspide larga, diversa dalle punte degli abeti
    const tettoY=t+Math.round(h*.18),tettoH=Math.max(3,Math.round(h*.19));
    const navX=l+Math.round(w*.43),navW=Math.round(w*.40);
    for(let yy=0;yy<=tettoH;yy++){
      const hw=Math.max(1,Math.round(navW*.5*yy/tettoH));
      rect(q,corpo,navX-hw,tettoY+yy,hw*2+1,1);
      rect(q,profilo,navX-hw,tettoY+yy,1,1);
    }
    // contrafforti e tetti mozzati
    for(let i=0;i<4;i++){
      const px=l+Math.round(w*(.10+i*.27));
      rect(q,corpo,px,t+Math.round(h*(.18+(i%2)*.10)),2,h);
      rect(q,corpo,px-1,t+Math.round(h*(.18+(i%2)*.10))+2,4,2);
    }
    const torreX=l+Math.round(w*.56),tw=Math.max(3,Math.round(w*.18));
    rect(q,corpo,torreX,t,tw,h);
    for(let y=0;y<Math.round(h*.30);y++)rect(q,corpo,torreX+Math.floor(tw/2)-Math.floor(y*.22),t-y,1+Math.floor(y*.44),1);
    // finestre a feritoia e rosone: pochi lumi, leggibili da lontano
    // due torri laterali spezzate danno alla rovina una sagoma inconfondibile
    if(!cappella)for(const tx of [l+2,l+w-5]){
      const th=Math.round(h*(tx===l+2?.56:.48));
      rect(q,corpo,tx,base-th,4,th);rect(q,profilo,tx,base-th,1,th);
      rect(q,corpo,tx+1,base-th-3,2,3);rect(q,profilo,tx+1,base-th-3,1,2);
    }
    // luce lunare sui profili rivolti a sinistra
    rect(q,profilo,l,t+Math.round(h*.36),1,Math.round(h*.64));
    rect(q,profilo,torreX,t,1,h);
    rect(q,profilo,torreX+1,t,Math.max(1,tw-2),1);
    if(!cappella){
      const ry=t+Math.round(h*.31),rx=torreX+Math.floor(tw/2);
      rect(q,luce,rx,ry-1,1,4);rect(q,luce,rx-1,ry,3,2);
      rect(q,corpo,rx,ry,1,1);
      rect(q,luce,l+Math.round(w*.18),t+Math.round(h*.63),1,2);
      rect(q,luce,l+Math.round(w*.82),t+Math.round(h*.67),1,2);
    }
    // denti di muro irregolari
    for(let i=0;i<w;i+=3)if(((i*7+w)&3)!==0)rect(q,corpo,l+i,t+Math.round(h*.34)-1,2,2);
  },cx);
  rovina(MW*.67,1,false);rovina(MW*.12,.72,true);
  return q.canvas;
}
function mkBosco(by,hMin,hMax,passo,col,hi,croci){
  const q=mLayer();
  /* il terreno non è un righello: ondeggia. Il seno fa un numero intero di
     giri sulla larghezza, così il bordo combacia con sé stesso al loop. */
  const k=2+((rnd()*2)|0),amp=Math.max(1,Math.round(MW*.02));
  for(let X=0;X<MW;X++){
    const dy=Math.round(Math.sin(X/MW*6.2832*k)*amp)+(rnd()<.3?1:0);
    rect(q,col,X,by+dy,1,MH-by-dy);
  }
  let cx=-8;
  while(cx<MW+10){
    const h=hMin+((rnd()*(hMax-hMin+1))|0),X=cx;
    mWrap(x0=>conifer(q,x0,by+2,h,col,hi),X);
    cx+=passo*(.55+rnd()*.95);
  }
  // croci sul limitare: pali storti con la traversa e un lume d'oro
  if(croci)for(let i=0;i<4;i++){
    const X=(rnd()*MW)|0,ht=Math.round(MW*.11)+((rnd()*5)|0),br=2+((rnd()*2)|0);
    const ty=Math.round(ht*.32);
    mWrap(x0=>{
      rect(q,CF.cathHi,x0,by-ht,1,ht+2);
      rect(q,CF.cathHi,x0-br,by-ht+ty,br*2+1,1);
      rect(q,CF.cathHi,x0-br,by-ht+ty+1,1,1);
      rect(q,CF.cathHi,x0+br,by-ht+ty+1,1,1);
      rect(q,CF.trim,x0,by-ht,1,1);
    },X);
  }
  return q.canvas;
}
/* foschia sul limitare: retinata a mano, non una barra piena.
   Il rilievo lungo X compie giri interi, quindi si cuce come gli altri. */
function mkNebbia(){
  const q=mLayer();
  const y0=MHZ+Math.round(MW*.09),hh=Math.max(6,Math.round(MW*.12));
  const col=CYBER?(CYFASE===1?'#4ca36a':'#225b78'):(APO?'#c9d4e8':(INF?'#b0563a':'#8fa0b4'));
  const k1=2+((rnd()*2)|0),k2=k1+4,k3=1+((rnd()*2)|0);
  const amp=Math.max(2,Math.round(hh*.35));
  for(let X=0;X<MW;X++){
    const u=X/MW*6.2832;
    // due onde a giri interi: la fascia serpeggia invece di stare in riga
    const sp=Math.round(Math.sin(u*k1+1.3)*amp+Math.sin(u*k2+.7)*amp*.4);
    const gonf=.6+.4*Math.sin(u*k3+2.2);
    for(let Y=0;Y<hh;Y++){
      const t=Y/hh,d=gonf*(1-Math.abs(t*2-1));
      // il cuore è pieno, i bordi si sfrangiano: così è foschia e non grandine
      if(d>.6||rnd()<d*d)rect(q,col,X,y0+sp+Y,1,1);
    }
  }
  return q.canvas;
}
/* sterpaglia in controluce: rovi neri sul bordo basso */
function mkSterpi(){
  const q=mLayer();
  const by=MH-Math.round(MW*.05);
  rect(q,CF.portal,0,by,MW,MH-by);
  // due sagome alte spezzano il bordo basso, come le conifere di buildFG
  for(let i=0;i<2;i++){
    const X=(rnd()*MW)|0,h=Math.round(MW*.18)+((rnd()*6)|0);
    mWrap(x0=>conifer(q,x0,by+1,h,CF.portal,CF.portal),X);
  }
  let cx=0;
  while(cx<MW+10){
    const h=3+((rnd()*8)|0),cur=(rnd()<.5?-1:1)*(1+((rnd()*2)|0));
    mWrap(x0=>{
      for(let i=0;i<h;i++)rect(q,CF.portal,x0+Math.round(cur*i*i/(h*h)*3),by-i,1,1);
      rect(q,CF.portal,x0-1,by-1,3,1);
    },cx);
    cx+=1+((rnd()*4)|0);
  }
  // lapidi e croci in primissimo piano: grandi, rade, mai tagliate dal bordo
  for(let i=0;i<Math.max(4,Math.round(MW/30));i++){
    const X=8+rnd()*(MW-16),h=4+((rnd()*7)|0),tipo=rnd();
    mWrap(x0=>{
      if(tipo<.42){
        rect(q,CF.portal,x0-2,by-h+2,5,h+3);
        rect(q,CF.portal,x0-1,by-h,3,2);
        rect(q,CF.treeBHi,x0-1,by-h+1,1,1);
      }else if(tipo<.74){
        rect(q,CF.portal,x0,by-h,1,h+3);rect(q,CF.portal,x0-2,by-h+2,5,1);
        rect(q,CF.treeBHi,x0,by-h,1,1);
      }else{
        rect(q,CF.portal,x0-1,by-h,3,h+3);rect(q,CF.portal,x0-2,by-h+2,5,2);
      }
    },X);
  }
  return q.canvas;
}
/* Mondo II: una megalopoli a strati, costruita in pixel e cucita sul bordo.
   Ogni fascia ha una grammatica diversa: torri lontane, blocchi industriali,
   sopraelevate, insegne e tetti tecnici in primo piano. */
function mkCyberCitta(base,minH,maxH,passo,prof){
  const q=mLayer();
  const corpi=['#06101a','#071520','#081923','#030811','#02050a'];
  const bordi=CYFASE===1?['#316747','#4a8b55']:['#12445d','#176786'];
  const luci=CYFASE===1?['#b7ff45','#ffd34f','#ff5cba']:['#20d8ff','#ff3bd4','#9b7bff'];
  let X=0;
  while(X<MW){
    const w=Math.max(4,Math.round(passo*(.65+rnd()*.8))),h=minH+((rnd()*(maxH-minH+1))|0),top=base-h;
    rect(q,corpi[Math.min(prof,corpi.length-1)],X,top,w,MH-top);
    rect(q,bordi[prof%2],X,top,w,1);
    if(rnd()<.42)rect(q,bordi[(prof+1)%2],X+Math.floor(w*.55),top-3-((rnd()*5)|0),1,4+((rnd()*5)|0));
    for(let wy=top+3;wy<base-2;wy+=3+prof)for(let wx=X+2;wx<X+w-1;wx+=3)
      if(rnd()<.52)rect(q,luci[(wx+wy+prof)%luci.length],wx,wy,prof<2?1:2,1);
    if(w>9&&rnd()<.36){
      const sy=top+3+((rnd()*Math.max(2,h-8))|0),sw=Math.min(w-3,5+((rnd()*8)|0));
      rect(q,'#02040a',X+2,sy,sw,4);rect(q,luci[(X+prof)%luci.length],X+2,sy,sw,1);
      rect(q,luci[(X+prof+1)%luci.length],X+3,sy+2,Math.max(1,sw-3),1);
    }
    X+=w+1;
  }
  return q.canvas;
}
function mkCyberPasserelle(){
  const q=mLayer(),y=MHZ+Math.round(MW*.18),c=CYFASE===1?'#b7ff45':'#20d8ff';
  rect(q,'#02050a',0,y,MW,5);rect(q,c,0,y,MW,1);rect(q,'#112233',0,y+4,MW,1);
  for(let X=3;X<MW;X+=13){rect(q,'#02050a',X,y-8,2,16);rect(q,c,X,y-2,1,2);}
  for(let X=7;X<MW;X+=29){
    rect(q,'#030811',X,y-14,12,8);rect(q,'#ff3bd4',X,y-14,12,1);
    rect(q,c,X+2,y-11,8,2);
  }
  return q.canvas;
}
function buildMenuBg(){
  if(!MW||!MH)return;
  const semeVero=seed;seed=77010203;   // seme proprio: quello del campo non si tocca
  MLAY.length=0;
  MLAY.push(mkCielo());
  if(CYBER){
    MLAY.push(mkCyberCitta(MHZ+Math.round(MW*.06),Math.round(MW*.12),Math.round(MW*.29),Math.round(MW*.09),0));
    MLAY.push(mkCyberCitta(MHZ+Math.round(MW*.16),Math.round(MW*.10),Math.round(MW*.24),Math.round(MW*.075),1));
    MLAY.push(mkCyberCitta(MHZ+Math.round(MW*.28),Math.round(MW*.12),Math.round(MW*.25),Math.round(MW*.09),2));
    MLAY.push(mkCyberPasserelle());
    MLAY.push(mkCyberCitta(MHZ+Math.round(MW*.46),Math.round(MW*.16),Math.round(MW*.30),Math.round(MW*.12),3));
    MLAY.push(mkCyberCitta(MH-Math.round(MW*.02),Math.round(MW*.12),Math.round(MW*.24),Math.round(MW*.10),4));
    MFOG=mkNebbia();MFOFF=0;
    MFLAKES.length=0;
    for(let i=0,n=Math.min(84,Math.round(MW*MH/300));i<n;i++)
      MFLAKES.push({x:rnd()*MW,ph:rnd()*90,sp:8+rnd()*15,dr:.2+rnd()*.8,s:rnd()<.12?2:1});
    MHALO=glowTex(MMR*3,CYFASE===1?183:32,CYFASE===1?255:216,CYFASE===1?69:255);
    MACT=G.act;seed=semeVero;return;
  }
  MLAY.push(mkCresta(MHZ,Math.round(MW*.08),Math.round(MW*.24),Math.round(MW*.13),
    CF.mtnFar,CF.mtnFarTop,MHZ-Math.round(MW*.16)));
  MLAY.push(mkCresta(MHZ+Math.round(MW*.05),Math.round(MW*.06),Math.round(MW*.17),
    Math.round(MW*.10),CF.mtnNear,CF.mtnNearTop,0));
  MLAY.push(mkAbbazia());
  MLAY.push(mkBosco(MHZ+Math.round(MW*.13),Math.round(MW*.05),Math.round(MW*.09),
    Math.round(MW*.06),CF.treeA,CF.treeAHi,false));
  MLAY.push(mkBosco(MHZ+Math.round(MW*.30),Math.round(MW*.08),Math.round(MW*.16),
    Math.round(MW*.08),CF.treeB,CF.treeBHi,true));
  MLAY.push(mkSterpi());
  MFOG=mkNebbia();MFOFF=0;
  MFLAKES.length=0;
  for(let i=0,n=Math.min(64,Math.round(MW*MH/380));i<n;i++)
    MFLAKES.push({x:rnd()*MW,ph:rnd()*90,sp:3+rnd()*8,dr:.4+rnd()*1.6,s:rnd()<.16?2:1});
  MHALO=APO?glowTex(MMR*3,232,224,192):(INF?glowTex(MMR*3,232,112,58):glowTex(MMR*3,163,66,74));
  MACT=G.act;
  seed=semeVero;
}
/* da chiamare all'apertura di una schermata: ricostruisce solo se serve */
function menuBgSync(){
  const cambiata=menuBgFit();
  if(cambiata||MACT!==G.act||!MLAY.length)buildMenuBg();
}
function drawMenuBg(dt){
  if(!MLAY.length)return;
  mtime+=dt;
  mg.drawImage(MLAY[0],0,0);
  // alone della luna: sopra il cielo, sotto i monti
  if(MHALO){
    mg.globalCompositeOperation='lighter';
    mg.globalAlpha=.16+Math.sin(mtime*.9)*.05;
    mg.drawImage(MHALO,MMX-MMR*3,MMY-MMR*3);
    mg.globalAlpha=1;mg.globalCompositeOperation='source-over';
  }
  for(let i=1;i<MLAY.length;i++){
    MOFF[i]=(MOFF[i]+MSPD[i]*dt)%MW;
    const o=Math.round(MOFF[i]);
    mg.drawImage(MLAY[i],-o,0);
    mg.drawImage(MLAY[i],MW-o,0);
    // la foschia si posa fra il bosco lontano e quello vicino
    if(i===4&&MFOG){
      MFOFF=(MFOFF+6*dt)%MW;
      const fo=Math.round(MFOFF);
      mg.globalAlpha=(CYBER?.16:(APO?.24:(INF?.21:.18)))+.05*Math.sin(mtime*.5);
      mg.drawImage(MFOG,-fo,0);
      mg.drawImage(MFOG,MW-fo,0);
      mg.globalAlpha=1;
    }
  }
  // cenere
  mg.fillStyle=CYBER?(CYFASE===1?'#b7ff45':'#20d8ff'):(APO?'#f2ecd8':(INF?'#e8703a':'#c3b9d0'));
  mg.globalAlpha=.28;
  for(let i=0;i<MFLAKES.length;i++){
    const f=MFLAKES[i],t=(mtime*f.sp+f.ph*9)%(MH+30);
    const Y=(INF&&!CYBER?(MH+30-t):t)-15;
    const X=((f.x+(CYBER?mtime*f.dr:Math.sin(mtime*f.dr+f.ph)*8))%MW+MW)%MW;
    mg.fillRect(X|0,Y|0,f.s,CYBER?f.s+2:f.s);
  }
  mg.globalAlpha=1;
}

/* ═══ MAPPA DELLA CAMPAGNA ═══
   Due pergamene sulla stessa tela: i mondi e, dentro un mondo, le sue veglie.
   Un sentiero che sale da sinistra a destra, una tappa per voce. Le posizioni
   si ricavano dal numero di voci: aggiungendo una veglia — o un mondo — la
   mappa si riadatta da sola. La tavolozza è tutta sua: la mappa è una
   pergamena, non una scena, e non deve cambiare tinta con l'atto in corso. */
const TW=144,TH=80;
const tcv=document.getElementById('tappe');

/* posto i-esimo di n lungo il sentiero, dal basso a sinistra all'alto a destra */
function viaPos(i,n){
  return {x:Math.round(TW*(i+.5)/n),
          y:Math.round(TH-15-(n<2?0:i/(n-1))*(TH-33))};
}
const scenDelMondo=()=>MONDO[msel].scen;
function tappaPos(a){
  const s=scenDelMondo(),i=s.indexOf(a);
  return viaPos(i<0?0:i,Math.max(1,s.length));
}
function mondoPos(m){return viaPos(m-1,NMONDI);}
function tappeFit(){
  const w=Math.max(120,(el('screen').clientWidth||300)-44);
  const s=Math.max(1,Math.min(3,Math.floor(w/TW)));
  tcv.style.width=(TW*s)+'px';tcv.style.height=(TH*s)+'px';
}
/* la via fra due tappe: un arco tratteggiato, acceso solo fin dove si è giunti */
function tVia(p,q,acceso){
  const mx=(p.x+q.x)/2,my=Math.min(p.y,q.y)-7;
  for(let i=0;i<=44;i++){
    if(i%3===2)continue;
    const t=i/44,u=1-t;
    rect(tb,acceso?TCOL.viaOn:TCOL.via,
      u*u*p.x+2*u*t*mx+t*t*q.x, u*u*p.y+2*u*t*my+t*t*q.y,1,1);
  }
}

/* pietra tonda con cerchione: dorato se il luogo è aperto, spento se no */
function medaglione(p,r,aperta,sp){
  for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    const d=dx*dx+dy*dy;
    if(d>r*r)continue;
    let col;
    if(d>r*r-r*2.2)col=aperta?TCOL.rim:TCOL.rimOff;   // cerchione
    else if(d>r*r-r*4.6)col='#140f1a';                // ombra sotto il bordo
    else col=(dx+dy<-r/3)?TCOL.discoHi:TCOL.disco;    // pietra, luce da nordovest
    rect(tb,col,p.x+dx,p.y+dy);
  }
  if(sp)blit(tb,sp,p.x-sp.w/2,p.y-sp.h/2);
}
/* una veglia sospesa porta il suo segno sopra il medaglione: una candela
   lasciata accesa, che è poi quello che è */
function tSospesa(p,r){
  const y=p.y-r-6;
  rect(tb,'#241f2b',p.x-2,y+3,5,3);        // il moccolo
  rect(tb,TCOL.sospesa,p.x-2,y+3,5,1);
  rect(tb,'#f2c14e',p.x,y+1,1,2);          // la fiamma
  rect(tb,'#f7e08a',p.x,y,1,1);
  rect(tb,'#f5ecd0',p.x-1,y+1,1,1);rect(tb,'#f5ecd0',p.x+1,y+1,1,1);
}
function tMedaglione(a){
  const p=tappaPos(a),r=9,aperta=a<=PROG.unl;
  medaglione(p,r,aperta,SEM[aperta?a:'chiuso']||SEM.chiuso);
  if(aperta&&haSalvataggio(a))tSospesa(p,r);
}
function mMedaglione(m){
  const p=mondoPos(m),r=12,aperta=mondoAperto(m);
  // l'emblema del mondo è quello della sua prima veglia
  medaglione(p,r,aperta,SEM[aperta?MONDO[m].scen[0]:'chiuso']||SEM.chiuso);
}
/* fondo comune alle due pergamene: la stessa pietra macchiata */
function tFondo(){
  for(let y=0;y<TH;y++){
    const t=y/TH;
    rect(tb,'rgb('+Math.round(8+t*9)+','+Math.round(6+t*7)+','+Math.round(14+t*12)+')',0,y,TW,1);
  }
  for(let i=0;i<70;i++)rect(tb,rnd()<.35?'#2b2434':'#191320',(rnd()*TW)|0,(rnd()*TH)|0);
}
function buildTappe(){
  const s0=seed;seed=31415926;   // la mappa ha il suo seme, come il fondale
  tFondo();
  const s=scenDelMondo();
  for(let i=0;i<s.length-1;i++)
    tVia(tappaPos(s[i]),tappaPos(s[i+1]),s[i]<PROG.unl);
  for(const a of s)tMedaglione(a);
  seed=s0;
}
function buildMondi(){
  const s0=seed;seed=31415926;
  tFondo();
  for(let m=1;m<NMONDI;m++)tVia(mondoPos(m),mondoPos(m+1),mondoCompiuto(m));
  for(let m=1;m<=NMONDI;m++)mMedaglione(m);
  seed=s0;
}
/* la ghirlanda che gira attorno alla voce scelta */
function tAlone(p,rag){
  tg.drawImage(tbc,0,0);
  tg.globalAlpha=.42+.42*Math.sin(mtime*2.4);
  for(let i=0;i<18;i++){
    const a=i/18*6.2832+mtime*.55;
    rect(tg,'#f2c14e',p.x+Math.cos(a)*rag,p.y+Math.sin(a)*rag,1,1);
  }
  tg.globalAlpha=1;
}

function drawMondi(){tAlone(mondoPos(msel),15);}
tcv.addEventListener('pointerdown',ev=>{
  ev.preventDefault();audio();
  if(smode!=='mappa'&&smode!=='mondi')return;
  const r=tcv.getBoundingClientRect();
  const px=(ev.clientX-r.left)/r.width*TW,py=(ev.clientY-r.top)/r.height*TH;
  if(smode==='mondi'){
    for(let m=1;m<=NMONDI;m++){
      const p=mondoPos(m),dx=px-p.x,dy=py-p.y;
      if(dx*dx+dy*dy<=225){msel=m;mondiAggiorna();return;}
    }

  }
  for(const a of scenDelMondo()){
    if(a>PROG.unl)continue;
    const p=tappaPos(a),dx=px-p.x,dy=py-p.y;
    if(dx*dx+dy*dy<=144){tsel=a;mappaAggiorna();return;}
  }
});

function buildBG(){
  // DECOR, blocked e LIGHTS li tiene buildPercorso: qui si disegna soltanto
  bx.setTransform(1,0,0,1,MARG,MARG);
  bx.fillStyle='#07060a';bx.fillRect(-MARG,-MARG,CW+MARG*2,CH+MARG*2);
  drawNord(bx);drawMura(bx);drawSagrato(bx);
  bx.save();bx.translate(OX,OY);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const px=c*TILE,py=r*TILE,p=isPath(c,r);
    if(p){
      bx.fillStyle=rnd()<.5?C.pathA:C.pathB;bx.fillRect(px,py,TILE,TILE);
      for(let i=0;i<7;i++){const a=(rnd()*TILE)|0,b=(rnd()*TILE)|0;
        bx.fillStyle=rnd()<.55?C.pathC:C.pathEdge;bx.fillRect(px+a,py+b,1+((rnd()*2)|0),1);}
      // bordi del sentiero
      bx.fillStyle=C.pathEdge;
      if(!isPath(c,r-1))bx.fillRect(px,py,TILE,1);
      if(!isPath(c,r+1))bx.fillRect(px,py+TILE-1,TILE,1);
      if(!isPath(c-1,r))bx.fillRect(px,py,1,TILE);
      if(!isPath(c+1,r))bx.fillRect(px+TILE-1,py,1,TILE);
    }else{
      const v=rnd();
      bx.fillStyle=v<.34?C.stoneA:(v<.72?C.stoneB:C.stoneC);
      bx.fillRect(px,py,TILE,TILE);
      bx.fillStyle=C.crack;
      bx.fillRect(px,py+TILE-1,TILE,1);bx.fillRect(px+TILE-1,py,1,TILE);
      for(let i=0;i<3;i++){const a=(rnd()*14)|0,b=(rnd()*14)|0;
        bx.fillStyle=rnd()<.5?C.crack:'#3b3346';bx.fillRect(px+a,py+b,1,1);}
      if(rnd()<.09){const a=2+((rnd()*10)|0),b=2+((rnd()*10)|0);
        bx.fillStyle=C.crack;bx.fillRect(px+a,py+b,3,1);bx.fillRect(px+a+2,py+b+1,2,1);}
    }
  }
  // arco / cancello finale
  const gx=5*TILE,gy=17*TILE;
  bx.fillStyle='#191320';bx.fillRect(gx-2,gy,TILE+4,TILE);
  bx.fillStyle='#3a3348';bx.fillRect(gx-3,gy,3,TILE);bx.fillRect(gx+TILE,gy,3,TILE);
  bx.fillStyle=C.blood;bx.fillRect(gx+2,gy+TILE-3,TILE-4,1);
  // decorazioni
  for(const[c,r,type]of DECOR){
    const sp=S[type];
    blit(bx,sp,c*TILE+(TILE-sp.w)/2,r*TILE+TILE-sp.h);
  }
  bx.restore();
  drawBordo(bx);
}

/* texture riusabili: niente gradienti ricreati ogni frame */
function glowTex(rad,r,g,b){
  const c=document.createElement('canvas');c.width=c.height=rad*2;
  const q=c.getContext('2d');
  const gr=q.createRadialGradient(rad,rad,0,rad,rad,rad);
  gr.addColorStop(0,'rgba('+r+','+g+','+b+',1)');
  gr.addColorStop(.45,'rgba('+r+','+g+','+b+',.34)');
  gr.addColorStop(1,'rgba('+r+','+g+','+b+',0)');
  q.fillStyle=gr;q.fillRect(0,0,rad*2,rad*2);
  return c;
}

/* ─────────── PARTICELLE ─────────── */
const MAXPART=190,pPool=[];
function part(px,py,vx,vy,life,col,grav,size){
  if(G.parts.length>=MAXPART)return;
  const p=pPool.pop();
  if(p){p.x=px;p.y=py;p.vx=vx;p.vy=vy;p.life=life;p.max=life;p.col=col;
    p.grav=grav||0;p.s=size||1;G.parts.push(p);}
  else G.parts.push({x:px,y:py,vx,vy,life,max:life,col,grav:grav||0,s:size||1});
}
function burst(px,py,n,col,spd,life,grav){
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=spd*(.35+Math.random()*.9);
    part(px,py,Math.cos(a)*s,Math.sin(a)*s-spd*.25,life*(.6+Math.random()*.7),col,grav);}
}
function coins(px,py,n){
  for(let i=0;i<n;i++)part(px+(Math.random()*6-3),py,(Math.random()*20-10),-24-Math.random()*22,
    .8,Math.random()<.5?C.gold:'#f0d97a',40);
}

/* ─────────── NEMICI ─────────── */
function spawn(type,wave,seg,segD){
  const d=ENEMIES[type];
  const wa=wAbs(wave);
  const hp=Math.round(d.hp*hpMul(wave));
  const e={type,def:d,hp,max:hp,speed:d.speed*spdMul(wave),
    armor:d.armor+Math.floor(wDur(wave)/7),
    bounty:Math.round(d.bounty*(1+.055*(wa-1))),
    seg:seg||0,segD:segD||0,x:PATHPX[0].x,y:PATHPX[0].y,dir:1,prog:0,
    slowAmt:0,burn:0,burnT:0,flash:0,bob:Math.random()*6,alive:true,spawnT:0,
    stepT:.3,broken:false};
  if(d.final){G.bossRef=e;G.shake=8;SFX.roar();
    banner(d.name.toUpperCase(),'SE VARCA LA SOGLIA È FINITA');}
  G.enemies.push(e);
  return e;
}
function damage(e,amt,ap){
  // lo scongiuro scrosta: la corazza che conta è quella che gli resta addosso
  const arm=e.armor*(1-(e.armorCut||0));
  const eff=Math.max(1,amt-arm*(1-(ap||0)));
  e.hp-=eff;e.flash=.09;
  checkBreak(e);
  if(e.hp<=0&&e.alive)kill(e);
}
function checkBreak(e){
  if(e.def.breakAt&&!e.broken&&e.hp>0&&e.hp<=e.max*e.def.breakAt)breakArmor(e);
}
function breakArmor(e){
  e.broken=true;
  e.armor=Math.round(e.armor*.4);
  e.speed*=1.15;
  G.shake=Math.max(G.shake,5);
  SFX.crack();
  G.rings.push({x:e.x,y:e.y-8,r:3,max:24,t:.45,col:'#e8a03a'});
  burst(e.x,e.y-8,16,'#6b6252',80,.6,110);
  burst(e.x,e.y-8,8,C.blood,60,.5,90);
}
function kill(e){
  e.alive=false;
  if(e.def.final){
    G.bossRef=null;G.shake=10;
    for(let k=0;k<70;k++)part(e.x,e.y-14,Math.random()*160-80,Math.random()*160-110,
      1.3,Math.random()<.5?C.gold:C.ember,60);
    G.rings.push({x:e.x,y:e.y-14,r:4,max:90,t:.9,col:'#f5ecd0'});
  }
  G.lacrime+=e.bounty;G.killed++;
  const heavy=e.def.boss||e.def.big;
  burst(e.x,e.y-(heavy?8:0),heavy?26:9,e.type==='ombra'?C.spirit:C.blood,heavy?90:55,.55,90);
  if(heavy)burst(e.x,e.y-6,14,'#6b6252',70,.7,120);
  coins(e.x,e.y,heavy?7:2);
  SFX.die();
  if(heavy)G.shake=6;
}

/* ─────────── ONDATE ─────────── */
function startWave(){
  if(G.state!=='play')return;
  if(G.waveOn){G.lacrime+=10+wAbs(G.wave)*2;coins(W/2,H/2,4);}
  G.wave++;
  G.sigilli++;
  const n=G.wave;
  const groups=waveDef(n);
  for(const g of groups){
    const tipo=mob(g.t);
    for(let i=0;i<g.n;i++)G.queue.push({t:tipo,at:G.t+g.delay+i*g.gap,wave:n});
  }
  G.waveOn=true;
  SFX.wave();
  let nm=NOMI[G.act][(n-1)%20];
  if(n>20)nm+=' · '+ROMAN(Math.floor((n-1)/20)+1);
  if(groups.some(g=>g.t==='big'))nm=BIGCRY[G.act];
  banner('ONDATA '+ROMAN(n),nm);
  syncUI();
}
function banner(a,b){
  const el=document.getElementById('banner');
  document.getElementById('banA').textContent=a;
  document.getElementById('banB').textContent=b;
  el.classList.remove('go');void el.offsetWidth;el.classList.add('go');
}

/* ─────────── UPDATE ─────────── */
function update(dt){
  G.t+=dt;
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*14);

  // coda spawn
  for(let i=G.queue.length-1;i>=0;i--){
    if(G.t>=G.queue[i].at){const q=G.queue[i];G.queue.splice(i,1);spawn(q.t,q.wave);}
  }

  // rallentamento e corazza scrostata si rifanno da zero a ogni giro: valgono
  // finché la creatura resta nell'aura, non un istante di più
  for(const e of G.enemies){e.slowAmt=0;e.armorCut=0;}

  // torri
  for(const t of G.towers)towerUpdate(t,dt);

  // nemici
  for(let i=G.enemies.length-1;i>=0;i--){
    const e=G.enemies[i];
    if(!e.alive){G.enemies.splice(i,1);continue;}
    e.flash=Math.max(0,e.flash-dt);e.bob+=dt*6;
    if(e.burnT>0){e.burnT-=dt;e.hp-=e.burn*dt;checkBreak(e);
      if(Math.random()<dt*9)part(e.x+(Math.random()*6-3),e.y-4,0,-14,.4,C.ember,-10);
      if(e.hp<=0){kill(e);continue;}}
    // passi del colosso
    if(e.def.big){
      e.stepT-=dt*(1-e.slowAmt);
      if(e.stepT<=0){e.stepT=.62;G.shake=Math.max(G.shake,1.7);SFX.thud();
        for(let k=0;k<4;k++)part(e.x+(Math.random()*12-6),e.y+1,Math.random()*26-13,
          -8-Math.random()*12,.45,'#6b6252',60);}
    }
    // spawner boss
    if(e.def.spawner){e.spawnT-=dt;
      if(e.spawnT<=0){e.spawnT=e.def.spawner;
        for(let k=0;k<2;k++){const m=spawn(mob('base'),Math.max(1,G.wave-3),e.seg,e.segD);
          m.x=e.x;m.y=e.y;}
        burst(e.x,e.y,10,'#6a2a4a',40,.5,20);}}
    moveEnemy(e,dt);
    if(e.escaped&&e.def.final){
      G.sigilli=0;G.bossIn=true;G.bossHp=Math.max(0,e.hp/e.max);
      G.bossRef=null;G.shake=9;SFX.over();
      burst(5*TILE+8,17*TILE+8,40,C.blood,90,1,50);
      e.alive=false;G.enemies.splice(i,1);
      gameOver();syncUI();continue;
    }
    if(e.escaped){
      G.sigilli-=e.def.dmg;G.shake=4;SFX.leak();
      burst(5*TILE+8,17*TILE+8,12,C.blood,60,.6,60);
      e.alive=false;G.enemies.splice(i,1);
      if(G.sigilli<0){G.sigilli=0;gameOver();}
      syncUI();
    }
  }

  // proiettili
  for(let i=G.shots.length-1;i>=0;i--){
    const s=G.shots[i];
    let tx=s.lx,ty=s.ly;
    if(s.target&&s.target.alive){tx=s.target.x;ty=s.target.y-4;s.lx=tx;s.ly=ty;}
    const dx=tx-s.x,dy=ty-s.y,d=Math.sqrt(dx*dx+dy*dy);
    const step=s.speed*dt;
    if(s.trail&&Math.random()<dt*30)part(s.x,s.y,0,0,.25,s.col,0);
    if(d<=step+1.5){
      impact(s);G.shots.splice(i,1);continue;
    }
    s.x+=dx/d*step;s.y+=dy/d*step;s.a=Math.atan2(dy,dx);
    s.life-=dt;if(s.life<=0){impact(s);G.shots.splice(i,1);}
  }
  function impact(s){
    if(s.pozR){
      // la pece non scoppia: si posa, e resta a bruciare dov'è caduta
      SFX.fire();
      G.pozze.push({x:s.x,y:s.y,r:s.pozR,t:s.pozT,max:s.pozT,dps:s.dmg,ap:s.ap});
      burst(s.x,s.y,8,'#3a2418',40,.5,60);
      return;
    }
    if(s.splash){
      SFX.fire();
      G.rings.push({x:s.x,y:s.y,r:2,max:s.splash,t:.32,col:C.ember});
      burst(s.x,s.y,10,C.ember,70,.4,30);
      const sr2=s.splash*s.splash;
      for(let i=0;i<G.enemies.length;i++){
        const e=G.enemies[i];if(!e.alive)continue;
        const dx=e.x-s.x,dy=e.y-s.y-4;
        if(dx*dx+dy*dy<sr2){
          damage(e,s.dmg,s.ap);
          if(s.burn){e.burn=Math.max(e.burn,s.burn);e.burnT=3;}
        }
      }
    }else if(s.target&&s.target.alive){
      damage(s.target,s.dmg,s.ap);SFX.hit();
      burst(s.x,s.y,3,'#c9b08a',34,.22,60);
      // l'arpione arretra chi è ancora vivo dopo il colpo
      if(s.pull&&s.target.alive)arretra(s.target,s.pull);
    }
  }

  // pece: brucia chi ci sta dentro finché dura
  for(let i=G.pozze.length-1;i>=0;i--){
    const p=G.pozze[i];p.t-=dt;
    if(p.t<=0){G.pozze.splice(i,1);continue;}
    const r2=p.r*p.r;
    for(let j=0;j<G.enemies.length;j++){
      const e=G.enemies[j];if(!e.alive)continue;
      const dx=e.x-p.x,dy=e.y-4-p.y;
      if(dx*dx+dy*dy<r2)damage(e,p.dps*dt,p.ap);
    }
    if(Math.random()<dt*14)
      part(p.x+(Math.random()*2-1)*p.r*.8,p.y+(Math.random()*2-1)*p.r*.4,
        0,-12-Math.random()*10,.5,Math.random()<.4?C.ember:'#5a3a22',-8);
  }

  // raggi & anelli & particelle
  for(let i=G.beams.length-1;i>=0;i--){G.beams[i].t-=dt;if(G.beams[i].t<=0)G.beams.splice(i,1);}
  for(let i=G.rings.length-1;i>=0;i--){const r=G.rings[i];r.t-=dt;
    r.r+=(r.max-r.r)*Math.min(1,dt*12);if(r.t<=0)G.rings.splice(i,1);}
  for(let i=G.parts.length-1;i>=0;i--){const p=G.parts[i];
    p.life-=dt;
    if(p.life<=0){if(pPool.length<MAXPART)pPool.push(p);G.parts.splice(i,1);continue;}
    p.vy+=p.grav*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}

  // fine ondata
  if(G.waveOn&&G.state==='play'&&G.queue.length===0&&G.enemies.length===0){
    G.waveOn=false;
    G.lacrime+=25+wAbs(G.wave)*6;
    // venti ondate chiudono lo scenario: da lì si sceglie
    if(!G.endless&&G.wave>=20)compiuto();
    else salvaPartita();   // fra un'ondata e l'altra il punto è fermo: si segna
    syncUI();
  }
}

function moveEnemy(e,dt){
  let dist=e.speed*(1-e.slowAmt)*dt;
  let guard=0;
  while(dist>0&&guard++<10){
    const len=SEGLEN[e.seg];
    const rem=len-e.segD;
    if(dist<rem){e.segD+=dist;dist=0;}
    else{dist-=rem;e.seg++;e.segD=0;
      if(e.seg>=SEGLEN.length){e.escaped=true;return;}}
  }
  posizionaNemico(e);
}
/* dove cade una creatura, dato il tratto e quanto ne ha percorso */
function posizionaNemico(e){
  const a=PATHPX[e.seg],b=PATHPX[e.seg+1],t=e.segD/SEGLEN[e.seg];
  e.x=a.x+(b.x-a.x)*t;e.y=a.y+(b.y-a.y)*t;
  if(b.x!==a.x)e.dir=b.x>a.x?1:-1;
  e.prog=e.seg+t;
}
/* L'arpione ributta indietro lungo la via, non in linea d'aria: si scende di
   tratto in tratto, e all'imbocco ci si ferma. Ciò che è grosso si smuove
   poco, il Signore quasi per niente — se no lo si terrebbe fermo a metà
   percorso finché non muore, e non sarebbe più un boss. */
function arretra(e,px){
  const p=e.def.final?.15:((e.def.big||e.def.boss)?.4:1);
  let d=px*p;
  if(d<=0)return;
  while(d>0){
    if(e.segD>=d){e.segD-=d;break;}
    d-=e.segD;e.seg--;
    if(e.seg<0){e.seg=0;e.segD=0;break;}
    e.segD=SEGLEN[e.seg];
  }
  posizionaNemico(e);
  for(let i=0;i<4;i++)part(e.x,e.y-4,(Math.random()*30-15),-10-Math.random()*20,.35,'#8fa5b0',40);
}

/* Le salmodie non colpiscono: cambiano gli altri. Le statistiche di un
   edificio quindi non dipendono più solo da lui, e vanno rifatte ogni volta
   che il campo cambia — si erige, si potenzia, si demolisce, si ripristina.
   Non ogni fotogramma: sono gli stessi punti in cui si riordinano le torri. */
const SBUFF_MAX={dmg:.9,rate:.5};   // per quanti cori si accalchino, oltre non va
function ricalcolaTorri(){
  for(const t of G.towers)t.st=tstats(t);
  const cori=G.towers.filter(t=>TOWERS[t.type].sostegno);
  for(const t of G.towers){
    t.buff=0;
    if(TOWERS[t.type].sostegno)continue;   // una salmodia non sostiene un'altra salmodia
    let d=0,r=0;
    for(const c of cori){
      const dx=c.x-t.x,dy=c.y-t.y;
      if(dx*dx+dy*dy<=c.st.range*c.st.range){d+=c.st.sdmg;r+=c.st.srate;}
    }
    d=Math.min(d,SBUFF_MAX.dmg);r=Math.min(r,SBUFF_MAX.rate);
    if(d||r){
      t.st.dmg=Math.round(t.st.dmg*(1+d));
      t.st.burn=t.st.burn*(1+d);
      t.st.rate=t.st.rate/(1+r);
      t.buff=d;
    }
  }
}
function towerUpdate(t,dt){
  const st=t.st,cfg=TOWERS[t.type];
  if(cfg.sostegno)return;   // il suo effetto sta tutto in ricalcolaTorri
  t.cd-=dt;t.rec=Math.max(0,t.rec-dt*4);
  const r2=st.range*st.range;
  // lo scongiuro è un'aura che non colpisce: scrosta e basta
  if(cfg.cut){
    for(let i=0;i<G.enemies.length;i++){
      const e=G.enemies[i];if(!e.alive)continue;
      const dx=e.x-t.x,dy=e.y-t.y;
      if(dx*dx+dy*dy<r2)e.armorCut=Math.max(e.armorCut||0,st.cut);
    }
    return;
  }
  if(cfg.aura){
    // la campana rallenta e percuote, l'ossario rode soltanto: stesso giro,
    // due voci diverse
    const muta=!cfg.slow;
    let any=false;
    for(let i=0;i<G.enemies.length;i++){
      const e=G.enemies[i];if(!e.alive)continue;
      const dx=e.x-t.x,dy=e.y-t.y;
      if(dx*dx+dy*dy<r2){
        if(st.slow>0){const res=e.def.slowResist||0;
          e.slowAmt=Math.max(e.slowAmt,st.slow*(1-res));}
        any=true;}
    }
    if(t.cd<=0&&any){
      t.cd=st.rate;t.rec=1;
      if(muta)SFX.hit();else SFX.bell();
      G.rings.push({x:t.x,y:t.y,r:4,max:st.range,t:muta?.28:.5,
        col:muta?'rgba(207,196,168,.75)':'#9fb8c8'});
      for(let i=0;i<G.enemies.length;i++){const e=G.enemies[i];
        const dx=e.x-t.x,dy=e.y-t.y;
        if(e.alive&&dx*dx+dy*dy<r2)damage(e,st.dmg,cfg.ap);}
    }
    return;
  }
  if(t.cd>0)return;
  const target=findTarget(t,r2);
  if(!target)return;
  t.cd=st.rate;t.rec=1;
  t.aim=Math.atan2(target.y-4-t.y,target.x-t.x);
  if(cfg.beam){
    SFX.beam();
    G.beams.push({x1:t.x,y1:t.y-6,x2:target.x,y2:target.y-4,t:.16,
      col:t.type==='rotaia'?'#20d8ff':'#f5ecd0',halo:t.type==='rotaia'?'#ff3bd4':C.gold});
    damage(target,st.dmg,1);
    burst(target.x,target.y-4,7,'#f0e6d0',60,.35,20);
    G.shake=1.6;
  }else if(cfg.splash){
    SFX.fire();
    G.shots.push({x:t.x,y:t.y-6,target,lx:target.x,ly:target.y-4,speed:78,dmg:st.dmg,
      ap:st.ap,splash:st.splash,burn:st.burn,col:C.ember,life:3,type:'fire',trail:true,a:0});
  }else if(cfg.pozza){
    SFX.fire();
    G.shots.push({x:t.x,y:t.y-6,target,lx:target.x,ly:target.y-4,speed:64,dmg:st.dmg,
      ap:st.ap,pozR:st.pozR,pozT:st.pozT,col:'#3a2418',life:3,type:'fire',trail:true,a:0});
  }else if(cfg.pull){
    SFX.shoot();
    G.shots.push({x:t.x,y:t.y-8,target,lx:target.x,ly:target.y-4,speed:150,dmg:st.dmg,
      ap:st.ap,pull:st.pull,col:'#8fa5b0',life:2.5,type:'bolt',trail:true,a:0});
  }else{
    SFX.shoot();
    // il mangano è lento e pesante: si vede partire
    const grosso=st.rate>=2;
    G.shots.push({x:t.x,y:t.y-8,target,lx:target.x,ly:target.y-4,speed:grosso?120:165,
      dmg:st.dmg,ap:st.ap,col:grosso?'#9c8f78':'#cbbb98',life:2.5,type:'bolt',a:0});
    if(grosso){G.shake=Math.max(G.shake,1.2);}
  }
}
function findTarget(t,r2){
  let best=null,bp=-1;
  for(let i=0;i<G.enemies.length;i++){
    const e=G.enemies[i];
    if(!e.alive||e.prog<=bp)continue;
    const dx=e.x-t.x,dy=e.y-t.y;
    if(dx*dx+dy*dy<=r2){bp=e.prog;best=e;}
  }
  return best;
}

/* ─────────── RENDER ─────────── */
function render(){
  x.save();
  x.translate(OX,OY);
  if(G.shake>.1){x.translate((Math.random()-.5)*G.shake,(Math.random()-.5)*G.shake);}
  x.drawImage(bgc,-OX-MARG,-OY-MARG);
  drawNebbia();

  // celle costruibili in modalità edificazione
  if(G.build){
    x.globalAlpha=.10+Math.sin(G.t*5)*.05;
    x.fillStyle=C.gold;
    for(let i=0;i<freeCells.length;i+=2)x.fillRect(freeCells[i],freeCells[i+1],TILE-2,TILE-2);
    x.globalAlpha=1;
  }

  // pece: sta a terra, sotto tutto quello che ci cammina sopra
  for(let i=0;i<G.pozze.length;i++){
    const p=G.pozze[i],f=Math.min(1,p.t/Math.max(.001,p.max));
    x.globalAlpha=.30+.30*f;
    x.fillStyle='#2a1a10';
    x.beginPath();x.ellipse(p.x,p.y,p.r,p.r*.55,0,0,6.2832);x.fill();
    // le bolle che scoppiano: quello che si vede bruciare
    x.globalAlpha=.5*f;
    for(let b=0;b<5;b++){
      const a=b*1.7+G.t*1.3+p.x,rr=p.r*(.25+.55*((b+1)/5));
      x.fillStyle=b%2?C.ember:'#7a3a18';
      x.fillRect(Math.round(p.x+Math.cos(a)*rr),Math.round(p.y+Math.sin(a)*rr*.55),1,1);
    }
    x.globalAlpha=1;
  }

  // anelli
  for(const r of G.rings){
    x.strokeStyle=r.col;x.globalAlpha=Math.max(0,r.t*1.6);x.lineWidth=1;
    x.beginPath();x.arc(r.x,r.y,r.r,0,6.2832);x.stroke();x.globalAlpha=1;
  }

  /* Torri e creature condividono un solo ordinamento in profondità:
     chi ha i piedi più in alto sta dietro. Così un mob che passa dietro
     una torre le finisce dietro davvero. */
  ZLIST.length=0;
  for(let i=0;i<G.towers.length;i++)ZLIST.push(G.towers[i]);
  for(let i=0;i<G.enemies.length;i++)ZLIST.push(G.enemies[i]);
  ZLIST.sort(zcmp);
  for(let i=0;i<ZLIST.length;i++){
    const o=ZLIST[i];
    if(o.def)drawNemico(o); else drawTorre(o);
  }
  // barre vita sopra a tutto: devono restare leggibili
  for(let i=0;i<G.enemies.length;i++)drawBarra(G.enemies[i]);
  // cerchio di gittata della torre selezionata
  if(G.sel){
    const t=G.sel;
    x.strokeStyle='rgba(201,162,39,.55)';x.lineWidth=1;
    x.beginPath();x.arc(t.x,t.y,t.st.range,0,6.2832);x.stroke();
    x.strokeStyle=C.gold;x.strokeRect(t.x-TILE/2+.5,t.y-TILE/2+.5,TILE-1,TILE-1);
  }

  // proiettili
  for(const s of G.shots){
    if(s.type==='bolt'){
      x.save();x.translate(s.x,s.y);x.rotate(s.a);
      x.fillStyle='#0a070c';x.fillRect(-3,-1,6,3);
      x.fillStyle=s.col;x.fillRect(-2,0,5,1);
      x.restore();
    }else{
      const f=Math.random();
      x.fillStyle='#f2c14e';x.fillRect(s.x-1,s.y-1,2,2);
      x.fillStyle=f<.5?C.ember:'#c9451f';
      x.fillRect(s.x-2,s.y,1,1);x.fillRect(s.x+1,s.y-1,1,1);
    }
  }

  // raggi
  for(const b of G.beams){
    const a=b.t/.16;
    x.globalAlpha=a;x.strokeStyle=b.col||'#f5ecd0';x.lineWidth=1;
    x.beginPath();x.moveTo(b.x1,b.y1);x.lineTo(b.x2,b.y2);x.stroke();
    x.globalAlpha=a*.35;x.strokeStyle=b.halo||C.gold;x.lineWidth=3;
    x.beginPath();x.moveTo(b.x1,b.y1);x.lineTo(b.x2,b.y2);x.stroke();
    x.globalAlpha=1;
  }

  // particelle
  for(const p of G.parts){
    x.globalAlpha=Math.min(1,p.life/p.max*1.6);
    x.fillStyle=p.col;x.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s);
  }
  x.globalAlpha=1;

  // luci
  x.globalCompositeOperation='lighter';
  for(let i=0;i<LIGHTS.length;i++){
    const L=LIGHTS[i],fl=.55+Math.sin(G.t*7+L.x)*.12+Math.random()*.08;
    x.globalAlpha=.20*fl;
    if(CYBER)x.drawImage(CYFASE===1?GLOW_NEON_ACIDO:GLOW_NEON,L.x-28,L.y-28);
    else if(APO)x.drawImage(GLOW_SACRO,L.x-30,L.y-30);
    else if(INF)x.drawImage(GLOW_INFERNO,L.x-22,L.y-22);
    else x.drawImage(GLOW_CANDELA,L.x-20,L.y-20);
    x.globalAlpha=.5*fl;
    x.fillStyle=CYBER?(CYFASE===1?'#b7ff45':'#20d8ff'):'#f2c14e';
    x.fillRect(L.x,L.y-1-((Math.random()*2)|0),1,1);
  }
  {const pl=.72+Math.sin(atime*1.5)*.12,sx=5*TILE+8,sy=H+30;
   x.globalAlpha=.42*pl;x.drawImage(GLOW_SACRO,sx-30,sy-30);}
  for(let i=0;i<G.towers.length;i++){
    const t=G.towers[i];
    if(t.type!=='braciere')continue;
    const fl=.6+Math.sin(G.t*9+t.x)*.15+Math.random()*.1,rad=24+t.lv*5;
    const ly=t.y+TILE/2-t.sp.h+TFLAME[t.lv-1][0][1]-2;
    x.globalAlpha=.26*fl;
    x.drawImage(t.lv===MAXLV?GLOW_GELO:GLOW_FUOCO,t.x-rad,ly-rad,rad*2,rad*2);
  }
  x.globalAlpha=1;
  x.globalCompositeOperation='source-over';

  // vignettatura
  x.drawImage(fgc,-OX,-OY);
  // riserva di vita del signore: sempre visibile, sopra ogni cosa
  if(G.bossRef&&G.bossRef.alive){
    const b=G.bossRef,f=Math.max(0,b.hp/b.max),bw=W-24,bx0=12,by0=-15;
    x.fillStyle='rgba(6,3,8,.9)';x.fillRect(bx0-3,by0-3,bw+6,10);
    x.fillStyle=C.gold;x.fillRect(bx0-3,by0-3,bw+6,1);x.fillRect(bx0-3,by0+6,bw+6,1);
    x.fillStyle='#2a1218';x.fillRect(bx0,by0,bw,4);
    x.fillStyle=b.broken?'#e8703a':'#8e1b25';x.fillRect(bx0,by0,Math.ceil(bw*f),4);
    x.fillStyle='#f5ecd0';x.fillRect(bx0+Math.max(0,Math.ceil(bw*f)-1),by0,1,4);
    x.fillStyle='rgba(201,162,39,.6)';x.fillRect(bx0+((bw*b.def.breakAt)|0),by0-2,1,8);
  }
  drawCenere();
  x.drawImage(CYBER?VIG_CYBER:(APO?VIG_APO:(INF?VIG_INF:VIG)),-OX,-OY);

  // il velo della pausa non si disegna qui: lo mette l'overlay #pausa
  x.restore();
}
const ZLIST=[];
/* piedi della sagoma: per una torre il bordo basso della casella,
   per una creatura il punto in cui tocca terra */
const zy=o=>o.def?o.y+4:o.y+TILE/2;
const zcmp=(a,b)=>zy(a)-zy(b);

function drawTorre(t){
  const sp=t.sp;
  const py=t.y+TILE/2-sp.h+(t.rec>0?1:0);
  const max=t.lv===MAXLV,cyber=CY_TOWER_SET.has(t.type);
  // basamento ottico: ancora l'edificio al terreno anche sulle pietre chiare
  x.fillStyle='rgba(4,3,7,.42)';x.beginPath();
  x.ellipse(t.x,t.y+TILE/2-1,Math.min(9,sp.w*.42),2.25,0,0,6.2832);x.fill();
  if(max){
    // aureola: segna il grado massimo senza aggiungere mole
    const pu=.55+Math.sin(G.t*2.2+t.x)*.16;
    x.globalAlpha=pu*.5;
    x.strokeStyle=cyber?'#73f4ff':'#f7e08a';x.lineWidth=1;
    x.beginPath();x.arc(t.x,py+4,7,0,6.2832);x.stroke();
    x.globalAlpha=pu*.22;
    x.beginPath();x.arc(t.x,py+4,9,0,6.2832);x.stroke();
    x.globalAlpha=1;
    if(Math.random()<.16)part(t.x+(Math.random()*10-5),py+2,0,-9,.6,cyber?'#20d8ff':'#f7e08a',-16);
  }
  blit(x,sp,t.x-sp.w/2,py);
  /* Ogni edificio ha un dettaglio vivo, minuscolo ma riconoscibile: non è un
     effetto sopra lo sprite a caso, segue la sua funzione e ne rafforza la
     lettura anche quando il campo è affollato. */
  const puls=.45+.35*Math.sin(G.t*2.6+t.x*.17),cy=py+Math.round(sp.h*.34);
  if(t.type==='spine'){
    x.globalAlpha=.55+puls*.35;x.fillStyle='#e8703a';x.fillRect(t.x-1,cy,2,1);
  }else if(t.type==='campana'){
    x.globalAlpha=.35+puls*.5;x.fillStyle='#f7e08a';x.fillRect(t.x,cy-1,1,2);
  }else if(t.type==='ossario'){
    x.globalAlpha=.35+puls*.35;x.fillStyle='#f3ead8';x.fillRect(t.x-3,py+4,1,1);
    x.fillRect(t.x+2,py+6,1,1);
  }else if(t.type==='caldaia'){
    x.globalAlpha=.45+puls*.4;x.fillStyle=max?'#9fd8e8':'#d79a38';
    x.fillRect(t.x-2,py+3-(Math.floor(G.t*2+t.x)&1),1,1);
    x.fillRect(t.x+2,py+5-(Math.floor(G.t*1.4)&1),1,1);
  }else if(t.type==='mangano'||t.type==='arpione'){
    x.globalAlpha=.25+puls*.45;x.fillStyle=max?'#ffffff':'#cbbb98';
    x.fillRect(t.x+Math.round(Math.cos(G.t*.7+t.x)*2),py+3,1,1);
  }else if(t.type==='scongiuro'){
    x.globalAlpha=.55+puls*.4;x.fillStyle=max?'#9fd8e8':'#e8703a';
    x.fillRect(t.x-1,cy,3,1);x.fillStyle=max?'#ffffff':'#f7e08a';x.fillRect(t.x,cy,1,1);
  }else if(t.type==='impulso'){
    x.globalAlpha=.55+puls*.4;x.fillStyle=max?'#ffffff':'#20d8ff';
    x.fillRect(t.x-4,py+4,2,1);x.fillRect(t.x+3,py+4,2,1);
  }else if(t.type==='plasma'){
    x.globalAlpha=.5+puls*.45;x.fillStyle=max?'#ffffff':'#ff3bd4';
    x.fillRect(t.x-2,cy-1,4,3);x.fillStyle='#20d8ff';x.fillRect(t.x-1,cy,2,1);
  }else if(t.type==='stasi'){
    const a=G.t*1.8+t.x,rr=4;
    x.globalAlpha=.4+puls*.45;x.fillStyle=max?'#ffffff':'#20d8ff';
    x.fillRect(Math.round(t.x+Math.cos(a)*rr),Math.round(cy+Math.sin(a)*2),1,1);
    x.fillRect(Math.round(t.x-Math.cos(a)*rr),Math.round(cy-Math.sin(a)*2),1,1);
  }else if(t.type==='rotaia'){
    x.globalAlpha=.45+puls*.5;x.fillStyle=max?'#ffffff':'#73f4ff';
    x.fillRect(t.x,py+2,1,Math.max(2,Math.round(sp.h*.38)));
  }else if(t.type==='sciame'){
    const a=G.t*2.5+t.x;
    x.globalAlpha=.55+puls*.35;x.fillStyle=max?'#ffffff':'#ff3bd4';
    x.fillRect(Math.round(t.x+Math.cos(a)*6),Math.round(cy+Math.sin(a)*3),2,1);
    x.fillRect(Math.round(t.x-Math.cos(a)*6)-1,Math.round(cy-Math.sin(a)*3),2,1);
  }else if(t.type==='disturbo'){
    x.globalAlpha=.35+puls*.5;x.fillStyle=max?'#ffffff':'#ff3bd4';
    const sy=py+2+(Math.floor(G.t*7+t.x)%Math.max(2,sp.h-5));x.fillRect(t.x-5,sy,10,1);
  }
  x.globalAlpha=1;
  if(t.type==='braciere'){const set=TFLAME[t.lv-1];
    for(let i=0;i<set.length;i++)drawFlame(t.x+set[i][0],py+set[i][1],set[i][2],max);}
  if(t.type==='reliquiario'&&t.rec>0){
    x.fillStyle='#f5ecd0';x.fillRect(t.x-1,py+TTIP.reliquiario[t.lv-1],2,2);
  }
  // la salmodia respira: un alone lento, che è tutto quello che si vede di lei
  if(TOWERS[t.type].sostegno){
    x.globalAlpha=.10+Math.sin(G.t*1.6+t.x*.3)*.05;
    x.fillStyle='#e0d8c0';x.beginPath();
    x.arc(t.x,t.y+4,t.st.range,0,6.2832);x.fill();x.globalAlpha=1;
  }
  // chi la ode porta un segno, se no il sostegno è invisibile e non si capisce
  if(t.buff>0){
    x.globalAlpha=.5+Math.sin(G.t*3+t.x)*.2;
    x.fillStyle='#e0d8c0';x.fillRect(t.x-1,py-3,2,1);x.fillRect(t.x-2,py-2,4,1);
    x.globalAlpha=1;
  }
  if(max){ // sigillo pieno al posto delle tacche
    x.fillStyle='#f7e08a';x.fillRect(t.x-5,t.y+TILE/2-2,10,2);
    x.fillStyle='#ffffff';x.fillRect(t.x-1,t.y+TILE/2-2,2,2);
  }else for(let i=0;i<t.lv-1;i++){
    x.fillStyle=C.gold;x.fillRect(t.x-(t.lv-1)*2+i*4,t.y+TILE/2-2,2,2);
  }
}
function drawNemico(e){
  const sp=S[(e.broken?e.type+'_b':e.type)+(e.flash>0?'_f':'')];
  const off=e.def.float?Math.sin(e.bob*.6)*1.5:(Math.floor(e.bob)%2?0:-1);
  const px=e.x-sp.w/2,py=e.y-sp.h+4+off;
  e.py=py;
  // ogni creatura tocca davvero il terreno; gli spettri hanno invece un'ombra
  // più tenue e larga, come se galleggiassero sopra la via
  x.fillStyle=e.def.float?'rgba(8,12,18,.22)':'rgba(0,0,0,.38)';
  x.beginPath();x.ellipse(e.x,e.y+2,Math.max(3,sp.w*(e.def.big?.42:.34)),
    e.def.final?4:(e.def.big?3:1.6),0,0,6.2832);x.fill();
  blit(x,sp,px,py,e.dir<0,e.def.alpha);
  if(e.slowAmt>0){x.fillStyle='rgba(140,200,220,.18)';x.fillRect(px,py,sp.w,sp.h);}
  if(e.broken&&Math.random()<.25)
    part(e.x+(Math.random()*14-7),e.y-10-Math.random()*8,0,-6,.4,C.ember,-14);
}
function drawBarra(e){
  if(e.hp>=e.max||e.py===undefined)return;
  const w=e.def.final?28:(e.def.boss?16:(e.def.big?22:9)),f=Math.max(0,e.hp/e.max);
  const grosso=e.def.big||e.def.final;
  const bx0=Math.round(e.x-w/2),by0=Math.round(e.py-3);
  x.fillStyle='#120b10';x.fillRect(bx0-1,by0-1,w+2,grosso?4:3);
  x.fillStyle=e.def.final?'#8e1b25':(e.def.boss?'#c9a227':(e.def.big?(e.broken?'#e8703a':'#9c8f78')
    :(f>.5?'#7f9c4a':(f>.25?'#c98a27':'#a52a2a'))));
  x.fillRect(bx0,by0,Math.ceil(w*f),grosso?2:1);
  if(e.def.breakAt){x.fillStyle='rgba(201,162,39,.5)';x.fillRect(bx0+((w*e.def.breakAt)|0),by0-1,1,4);}
}
function drawFlame(px,py,sc,blu){
  const n=Math.floor(4*sc)+3;
  for(let i=0;i<n;i++){
    const t=G.t*8+i*1.7;
    const fx=px+Math.sin(t)*2.2*(i/n)-1;
    const fy=py-i*1.5-Math.abs(Math.sin(t*.7))*1.5;
    if(blu)x.fillStyle=i<n*.4?'#eaf6ff':(i<n*.75?'#7fd0f0':'#2f6fc0');
    else x.fillStyle=i<n*.4?'#f7e08a':(i<n*.75?C.flame:C.ember);
    x.fillRect(Math.round(fx),Math.round(fy),Math.max(1,3-((i/n*3)|0)),1);
  }
}

/* ─────────── LOOP ─────────── */
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000;last=now;
  dt=Math.min(dt,.05);
  atime+=dt;
  if(G.state==='play'&&!G.paused){
    const steps=G.speed;
    for(let i=0;i<steps;i++)update(dt);
    syncSoft();
  }
  render();
  // a schermata aperta il fondale in parallasse la copre: il campo continua
  // a disegnare dietro, ma non si vede
  if(G.state!=='play'){drawMenuBg(dt);
    if(smode==='mappa')drawTappe();else if(smode==='mondi')drawMondi();}
  requestAnimationFrame(frame);
}
