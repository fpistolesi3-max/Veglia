function fit(){
  const stage=document.getElementById('stage');
  const aw=stage.clientWidth-8,ah=stage.clientHeight-6;
  let s=Math.min(aw/CW,ah/CH);
  s=Math.max(.75,Math.floor(s*4)/4);
  cv.style.width=(CW*s)+'px';cv.style.height=(CH*s)+'px';
  // ruotando il telefono cambia la larghezza: gli strati vanno rigenerati
  if(G.state!=='play')menuBgSync();
}
window.addEventListener('resize',fit);
window.addEventListener('orientationchange',()=>setTimeout(fit,180));

cv.addEventListener('pointerdown',ev=>{
  ev.preventDefault();
  audio();
  if(G.state!=='play'||G.paused)return;
  const r=cv.getBoundingClientRect();
  const px=(ev.clientX-r.left)/r.width*CW-OX, py=(ev.clientY-r.top)/r.height*CH-OY;
  const c=Math.floor(px/TILE),rw=Math.floor(py/TILE);
  if(c<0||c>=COLS||rw<0||rw>=ROWS)return;
  const cell=grid[rw][c];
  if(cell===3){
    const t=G.towers.find(t=>t.c===c&&t.r===rw);
    G.sel=t;G.build=null;openPanel();syncUI();return;
  }
  if(G.build){
    if(cell!==0){deny(c,rw);return;}
    const cost=TOWERS[G.build].cost;
    if(G.lacrime<cost){deny(c,rw);return;}
    place(G.build,c,rw);
  }else{
    G.sel=null;closePanel();
  }
},{passive:false});

function deny(c,r){
  SFX.err();G.shake=2;
  for(let i=0;i<6;i++)part(c*TILE+8,r*TILE+8,(Math.random()*40-20),(Math.random()*40-20),.3,C.blood,0);
}
function place(type,c,r){
  const cost=TOWERS[type].cost;
  G.lacrime-=cost;
  const t={type,c,r,x:c*TILE+TILE/2,y:r*TILE+TILE/2,lv:1,cd:0,rec:1,spent:cost,aim:0,buff:0};
  t.st=tstats(t);t.sp=S[type+'1'];
  G.towers.push(t);G.towers.sort((a,b)=>a.y-b.y);grid[r][c]=3;rebuildFree();
  ricalcolaTorri();
  SFX.build();
  burst(t.x,t.y+6,10,'#6b6252',45,.4,80);
  G.rings.push({x:t.x,y:t.y,r:4,max:t.st.range,t:.4,col:'rgba(201,162,39,.9)'});
  G.sel=t;G.build=null;openPanel();syncUI();
}
function upgrade(){
  const t=G.sel;if(!t||t.lv>=MAXLV)return;
  const c=upCost(t);if(G.lacrime<c){SFX.err();return;}
  G.lacrime-=c;t.spent+=c;t.lv++;t.sp=S[t.type+t.lv];
  ricalcolaTorri();   // se è una salmodia, cambia anche per i vicini
  SFX.up();
  G.rings.push({x:t.x,y:t.y,r:4,max:t.st.range,t:.45,col:C.gold});
  burst(t.x,t.y,10,C.gold,50,.5,40);
  openPanel();syncUI();
}
function sell(){
  const t=G.sel;if(!t)return;
  G.lacrime+=sellVal(t);
  grid[t.r][t.c]=0;
  G.towers.splice(G.towers.indexOf(t),1);rebuildFree();ricalcolaTorri();
  burst(t.x,t.y,12,'#6b6252',50,.45,90);coins(t.x,t.y,3);
  SFX.build();
  G.sel=null;closePanel();syncUI();
}

const el=id=>document.getElementById(id);
const bar=el('bar');
/* La barra non è più fissa: mostra la quaterna scelta per questa veglia, e si
   rifà quando la quaterna cambia — cioè una volta sola, prima di scendere. */
function buildBar(){
  bar.innerHTML='';
  for(const k of G.loadout){
    const cfg=TOWERS[k];if(!cfg)continue;
    const d=document.createElement('button');
    d.className='tcard';d.dataset.k=k;
    const ic=document.createElement('canvas');ic.width=14;ic.height=18;
    const ix=ic.getContext('2d');ix.imageSmoothingEnabled=false;
    ix.drawImage(S[k+'1'].cv,-1,-1);
    d.appendChild(ic);
    const n=document.createElement('div');n.className='tn';n.textContent=cfg.short;d.appendChild(n);
    const c=document.createElement('div');c.className='tc';c.textContent='◈'+cfg.cost;d.appendChild(c);
    d.addEventListener('click',()=>{
      audio();
      if(G.state!=='play')return;
      G.build=(G.build===k)?null:k;
      G.sel=null;closePanel();syncUI();
    });
    bar.appendChild(d);
  }
}

function openPanel(){
  const t=G.sel;if(!t)return;
  const p=el('panel');p.classList.add('on');
  const cfg=TOWERS[t.type],st=t.st;
  el('pName').textContent=cfg.name;
  el('pLev').textContent='LIV '+t.lv+(t.lv>=MAXLV?' · MASSIMO':'');
  let s='';
  if(cfg.sostegno){
    s+='DANNO AI VICINI <span>+'+Math.round(st.sdmg*100)+'%</span> · CADENZA <span>+'+
       Math.round(st.srate*100)+'%</span><br>';
    s+='VOCE <span>'+Math.round(st.range)+'</span> · ODONO <span>'+
       G.towers.filter(o=>o!==t&&o.buff>0).length+'</span> edifici<br>';
  }else if(cfg.cut){
    s+='CORAZZA SCROSTATA <span>'+Math.round(st.cut*100)+'%</span><br>';
    s+='AURA <span>'+Math.round(st.range)+'</span> · <span>non colpisce nessuno</span><br>';
  }else if(cfg.pozza){
    s+='PECE <span>'+st.dmg+'/s</span> per <span>'+st.pozT.toFixed(1)+'s</span><br>';
    s+='GITTATA <span>'+Math.round(st.range)+'</span> · POZZA <span>'+Math.round(st.pozR)+
       '</span> · OGNI <span>'+st.rate.toFixed(1)+'s</span><br>';
  }else if(cfg.aura){
    if(st.slow>0)
      s+='RALLENTAMENTO <span>'+Math.round(st.slow*100)+'%</span> · RINTOCCO <span>'+st.dmg+'</span><br>';
    else s+='MORSO <span>'+st.dmg+'</span> · DPS <span>'+(st.dmg/st.rate).toFixed(1)+'</span><br>';
    s+='AURA <span>'+Math.round(st.range)+'</span> · OGNI <span>'+st.rate.toFixed(1)+'s</span><br>';
  }else{
    s+='DANNO <span>'+st.dmg+'</span> · CADENZA <span>'+st.rate.toFixed(2)+'s</span><br>';
    s+='GITTATA <span>'+Math.round(st.range)+'</span> · DPS <span>'+(st.dmg/st.rate).toFixed(1)+'</span><br>';
  }
  if(st.splash)s+='AREA <span>'+Math.round(st.splash)+'</span> · USTIONE <span>'+st.burn.toFixed(0)+'/s</span><br>';
  if(st.pull)s+='ARRETRA <span>'+Math.round(st.pull)+'</span> px<br>';
  if(st.ap===1)s+='<span>TRAPASSA OGNI CORAZZA</span><br>';
  else if(st.ap>=.5)s+='<span>IGNORA METÀ CORAZZA</span><br>';
  else if(st.ap>0)s+='<span>INTACCA LA CORAZZA</span><br>';
  if(t.buff>0)s+='<span>SOSTENUTO DALLA SALMODIA · +'+Math.round(t.buff*100)+'%</span><br>';
  el('pStats').innerHTML=s;
  const up=el('pUp');
  if(t.lv>=MAXLV){up.disabled=true;up.textContent=lex('ritoFatto');}
  else{up.disabled=G.lacrime<upCost(t);up.textContent='POTENZIA ◈'+upCost(t);}
  el('pSell').textContent='DEMOLISCI +◈'+sellVal(t);
}
function closePanel(){el('panel').classList.remove('on');}
el('pClose').addEventListener('click',()=>{G.sel=null;closePanel();});
el('pUp').addEventListener('click',()=>{audio();upgrade();});
el('pSell').addEventListener('click',()=>{audio();sell();});

const UIC={sig:-1,lac:-1,build:'',waveOn:null,wave:-1,up:null,act:0};
const elSig=el('hSig'),elLac=el('hLac'),elBW=el('bWave'),elUp=el('pUp');
function syncSoft(){
  if(UIC.sig!==G.sigilli){UIC.sig=G.sigilli;elSig.textContent=G.sigilli;}
  if(UIC.lac!==G.lacrime||UIC.build!==G.build){
    const lacChanged=UIC.lac!==G.lacrime;
    UIC.lac=G.lacrime;UIC.build=G.build;
    elLac.textContent=G.lacrime;
    for(let i=0;i<bar.children.length;i++){
      const d=bar.children[i];
      d.classList.toggle('poor',G.lacrime<TOWERS[d.dataset.k].cost);
      d.classList.toggle('sel',G.build===d.dataset.k);
    }
    if(lacChanged&&G.sel&&G.sel.lv<MAXLV){
      const dis=G.lacrime<upCost(G.sel);
      if(UIC.up!==dis){UIC.up=dis;elUp.disabled=dis;}
    }
  }
  if(UIC.waveOn!==G.waveOn||UIC.wave!==G.wave||UIC.act!==G.act){
    UIC.waveOn=G.waveOn;UIC.wave=G.wave;UIC.act=G.act;
    if(G.waveOn){elBW.className='big ghost';elBW.textContent='ANTICIPA · +◈'+(10+wAbs(G.wave)*2);}
    else{elBW.className='big';
    elBW.textContent=ATTO[G.act].btn+ROMAN(G.wave+1);}
  }
}
function uiDirty(){UIC.lac=-1;UIC.sig=-1;UIC.wave=-2;UIC.up=null;}
function syncUI(){
  uiDirty();syncSoft();
  el('hWave').textContent=ATTO[G.act].hud+ROMAN(Math.max(1,G.wave))+(G.endless?'':' / XX');
}

/* ─────────── PAUSA ─────────── */
/* Non è una schermata: il campo resta lì sotto, fermo, che si vede. Due stati
   nello stesso blocco — il menu e la conferma dell'abbandono — perché una
   veglia lunga non la si deve poter buttare via con un tocco storto. */
let paConferma=false;
function pausaAggiorna(){
  el('paTitle').innerHTML=paConferma?'ABBANDONARE<br>LA VEGLIA?':'VEGLIA<br>SOSPESA';
  el('paStato').textContent=paConferma?'NON SI TORNA INDIETRO':
    ATTO[G.act].nome+' · ONDATA '+ROMAN(Math.max(1,G.wave));
  el('paLore').innerHTML=paConferma
    ? 'Quello che hai eretto resta qui, e la partita sospesa viene cancellata. '+
      'Quanto hai retto finisce comunque nell\'<b>albo d\'oro</b>.'
    : 'Sigilli <b>'+G.sigilli+'</b> · lacrime <b>'+G.lacrime+'</b> · torri <b>'+
      G.towers.length+'</b><br><br>Puoi riprendere adesso, oppure sospenderla e '+
      'ritrovarla dov\'era quando vorrai.';
  el('paMain').textContent=paConferma?'NO, RIPRENDI':'RIPRENDI';
  el('paSalva').textContent=paConferma?'SÌ, ABBANDONA':'SALVA ED ESCI';
  el('paSalva').className=paConferma?'big lascia':'big ghost';
  el('paLascia').classList.toggle('hidden',paConferma);
}
function apriPausa(){
  if(G.state!=='play')return;
  G.paused=true;paConferma=false;
  el('bPause').classList.add('on');
  el('pausa').classList.remove('off');
  pausaAggiorna();
}
function chiudiPausa(){
  paConferma=false;
  el('pausa').classList.add('off');
}
function riprendiPausa(){
  chiudiPausa();
  if(G.state!=='play')return;
  G.paused=false;el('bPause').classList.remove('on');
}
el('bPause').addEventListener('click',()=>{
  if(G.state!=='play')return;
  if(G.paused)riprendiPausa();else{apriPausa();salvaPartita();}
});
el('paMain').addEventListener('click',()=>{audio();riprendiPausa();});
el('paSalva').addEventListener('click',()=>{
  audio();
  if(!paConferma){salvaPartita();chiudiPausa();G.state='menu';mappa();return;}
  // abbandono: il risultato entra nell'albo, la partita sospesa no
  segna();scartaSalvataggio(G.act);
  chiudiPausa();G.state='menu';mappa();
});
el('paLascia').addEventListener('click',()=>{audio();paConferma=true;pausaAggiorna();});
/* finire in secondo piano è un modo come un altro di sospendere: si mette in
   pausa e si salva, ma senza aprire la conferma addosso a nessuno */
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&G.state==='play'){apriPausa();salvaPartita();}
});

/* le figure del compendio sono le stesse sprite che vedi in campo */
function spr(k,z){
  const c=S[k].cv;
  return '<img src="'+c.toDataURL()+'" width="'+(c.width*z)+'" height="'+(c.height*z)+'" alt="">';
}
function cmpR(imgs,titolo,testo){
  return '<div class="cmpR"><div class="cmpP">'+imgs+'</div>'+
         '<div class="cmpT"><b>'+titolo+'</b><br>'+testo+'</div></div>';
}
const RUOLI=[
 ['base','Fanteria. Lenta e senza corazza, ma non finisce mai.'],
 ['fast','Corre il doppio. Poca vita: il problema è che arriva prima che tu reagisca.'],
 ['tank','Corazzato. Le armi fisiche lo scalfiscono appena: servono braciere e reliquiario.'],
 ['ghost','Svelto e ostinato: resiste per più di metà al rallentamento della campana.']];
const LEGG=[
 ['big','Dall\'ondata VI, poi ogni cinque. La corazza respinge quasi tutto finché non gli '+

 ['boss','Chiude ogni decina. Mentre avanza genera fanteria dal proprio corpo.'],

/* Il compendio parla delle creature, e le creature sono roba di un mondo: le
   colonne sono le veglie di MONDO[msel], non tutti gli scenari che esistono.
   Gli edifici stanno in armeria, che è della campagna e non di un mondo.
   Per questo l'HTML si rifà a ogni apertura invece di restare in cache. */
function buildHelp(){
  const scen=MONDO[msel].scen.length?MONDO[msel].scen:[1];
  const nomi=scen.map(a=>ATTO[a].nome.replace(/^(LA|IL) /,'').toLowerCase());
  let h='<div class="cmpT cmpI">Tocca un edificio nella barra, poi una lastra libera del sagrato '+
    'per consacrarlo. Tocca un edificio già eretto per vederne la gittata, potenziarlo o '+
    'demolirlo (rimborso 60%). Suonare la campana durante un\'ondata anticipa la successiva e '+
    'frutta lacrime in più.<br><br><b>I sigilli.</b> Ogni ondata te ne dà uno, ogni fuga te ne '+
    'toglie. Alla Veglia parti da zero e non puoi sbagliare niente; le veglie più profonde te ne '+
    'concedono qualcuno in mano, perché aprono già dure.<br><br>'+
    '<b>La campagna</b> è fatta di mondi, e ogni mondo di veglie da venti ondate l\'una. Ognuna è '+
    'a sé — compiute le venti puoi restare a vegliare senza fine oppure scendere alla successiva, '+
    'ma <b>le torri non ti seguono</b>: di là si ricomincia da pietra nuda, con più lacrime in '+
    'mano e creature già più dure. Una veglia aperta resta aperta: la si rigioca dalla mappa '+
    'quando si vuole, e la si può <b>sospendere</b> dalla pausa per riprenderla dopo.<br><br>'+
    '<b>La via</b> non è la stessa dappertutto: nel sagrato serpeggia e ti concede tempo, più a '+
    'fondo si distende. Meno curve vuol dire meno tiri prima della soglia.<br><br>'+
    'Quel che puoi erigere sta nell\'<b>armeria</b>: '+conta(TORDER.length)+' edifici, '+
    conta(NSLOT)+' per veglia.</div>';
  h+='<div class="cmpH">LE SCHIERE · '+nomi.join(' · ')+'</div>';
  for(const r of RUOLI){
    const t=scen.map(a=>ROSTER[a][r[0]]);
    h+=cmpR(t.map(k=>spr(k,3)).join(''),
      t.map((k,i)=>i?'<i>'+ENEMIES[k].name+'</i>':ENEMIES[k].name).join(' · '),r[1]);
  }
  h+='<div class="cmpH">I LEGGENDARI</div>';
  for(const r of LEGG){
    const t=scen.map(a=>ROSTER[a][r[0]]);
    h+=cmpR(t.map(k=>spr(k,2)).join(''),
      t.map((k,i)=>i?'<i>'+ENEMIES[k].name+'</i>':ENEMIES[k].name).join(' · '),r[1]);
  }
  return h;
}

/* ═══ I MONDI ═══
   Il piano più alto della campagna. Un mondo si apre quando si è arrivati alla
   sua prima veglia; quello che non c'è ancora lo dice e basta. */
function elencoMondi(){
  let h='';
  for(let m=1;m<=NMONDI;m++){
    const M=MONDO[m],aperto=mondoAperto(m),fatto=mondoCompiuto(m);
    const k=M.scen.filter(a=>PROG.fin[a]).length;
    // ROMAN(0) è la stringa vuota: a zero veglie si scrive, non si numera
    const s=fatto?'COMPIUTO · '+ROMAN(k)+' VEGLIE'
      :(k?'VEGLIE COMPIUTE: '+ROMAN(k)+' / '+ROMAN(M.scen.length)
         :'NESSUNA VEGLIA COMPIUTA · '+ROMAN(M.scen.length)+' DA TENERE');
    h+='<div class="mdR'+(aperto?'':' mut')+(m===msel?' on':'')+'">'+
       '<span class="t">'+M.nome+'</span>'+
       '<span class="s">'+(aperto?s:M.sotto)+'</span>'+
       (m===msel?'<div class="d">'+M.lore+'</div>':'')+'</div>';
  }
  return h;
}
function mondiAggiorna(){

/* ═══ LA MAPPA ═══
   Le tappe sbloccate del mondo scelto, a tocco sul canvas; sotto, la
   classifica delle serie più lunghe, una riga per veglia. */
function classifica(){
  const righe=scenDelMondo().map(a=>({a,r:albo(a)[0]||null}));
  righe.sort((x,y)=>(y.r?y.r.w:-1)-(x.r?x.r.w:-1)||x.a-y.a);
  let h='<div class="clsH">LE PIÙ LUNGHE</div>';
  for(const{a,r}of righe){
    const chiusa=a>PROG.unl;
    let v;
    if(r)v='ONDATA <b>'+ROMAN(r.w)+'</b> · '+r.k+' caduti';
    else v=chiusa?'— sigillata —':'— mai tentata —';
    h+='<div class="clsR'+(chiusa||!r?' mut':'')+(a===tsel?' on':'')+'">'+
       '<span class="n">'+ROMAN(a)+'</span>'+
       '<span class="t">'+ATTO[a].nome+'</span>'+
       '<span class="v">'+v+'</span></div>';
  }
  return h;
}
function mappaAggiorna(){
  buildTappe();
  el('scLore').innerHTML=classifica();
  const r=albo(tsel)[0],sosp=haSalvataggio(tsel);
  const parti=[sosp?'VEGLIA SOSPESA':ATTO[tsel].sotto];
  if(r)parti.push('MIGLIORE: <b>'+ROMAN(r.w)+'</b>');
  el('scScore').classList.remove('hidden');
  el('scScore').innerHTML=parti.join(' · ');
  el('scMain').textContent=(sosp?'RIPRENDI · ':'PREPARATI · ')+ATTO[tsel].nome;
  const b=el('scAlt2');
  if(sosp){b.classList.remove('hidden');b.textContent='RICOMINCIA DA CAPO';}
  else b.classList.add('hidden');
}
function mappa(){

/* ═══ L'ALBO D'ORO ═══
   Le cinque serie più lunghe di ogni veglia. Non si distingue fra chi si è
   fermato alle venti e chi ha tirato avanti nell'infinito: conta l'ondata. */
function albo(a){const r=PROG.rec[a];return Array.isArray(r)?r:[];}
function buildAlbo(){
  let h='';
  for(let a=1;a<=NSCEN;a++){
    h+='<div class="cmpH">'+ATTO[a].nome+' · '+ATTO[a].sotto+'</div>';
    const l=albo(a);
    if(!l.length){
      h+='<div class="clsR mut"><span class="t">'+
         (a>PROG.unl?'— sigillata —':'— mai tentata —')+'</span></div>';
      continue;
    }
    l.forEach((r,i)=>{
      h+='<div class="clsR'+(i?'':' on')+'">'+
         '<span class="n">'+ROMAN(i+1)+'</span>'+
         '<span class="t">ONDATA <b>'+ROMAN(r.w)+'</b></span>'+
         '<span class="v">'+r.k+' caduti</span></div>';
    });
  }
  return h;
}
function alboScreen(){
  smode='albo';
  showScreen("L'ALBO<br>D'ORO",'LE CINQUE SERIE PIÙ LUNGHE DI OGNI VEGLIA',
    buildAlbo(),'TORNA INDIETRO',null,null,null,null);
  el('screen').classList.add('wide');
}
/* ═══ L'ARMERIA ═══
   La legenda degli edifici — che è roba della campagna, non di un mondo: le
   pietre sono le stesse dappertutto, sono le creature a cambiare — e il posto
   in cui si compone la quaterna da portare in veglia.
   Due modi, stessa schermata: si sfoglia (dai mondi) oppure si sceglie
   (dalla mappa, prima di scendere). */
let armSel=[],armScegli=false,armAvviso='',armSlot=0,armInfo=null;
const armPiene=()=>armSel.filter(k=>TOWERS[k]).length;
const armPronta=()=>armPiene()===NSLOT&&new Set(armSel).size===NSLOT;
function armSlotHtml(){
  let h='<div class="armSlotsW"><div class="armSlotsH">'+(armScegli?
    'LA QUATERNA · TOCCA LO SLOT DA CAMBIARE':'LA QUATERNA DI RIFERIMENTO')+'</div><div class="armSlots">';
  for(let i=0;i<NSLOT;i++){
    const k=armSel[i],cfg=TOWERS[k];
    h+='<button type="button" class="armSlot'+(i===armSlot&&armScegli?' pick':'')+
      (cfg?'':' vuoto')+'" data-arm-slot="'+i+'">'+
      '<span class="asN">'+ROMAN(i+1)+'</span><span class="asI">'+(cfg?spr(k+'1',1):'')+'</span>'+ 
      '<span class="asT">'+(cfg?cfg.short:'VUOTO')+'</span></button>';
  }
  return h+'</div></div>';
}
function armRiga(k){
  const cfg=TOWERS[k],slot=armSel.indexOf(k),dentro=slot>=0;
  const st=tstats({type:k,lv:1});
  let numeri;
  if(cfg.sostegno)numeri='sostegno · voce '+Math.round(st.range);
  else if(cfg.cut)numeri='scrosta '+Math.round(st.cut*100)+'% · aura '+Math.round(st.range);
  else if(cfg.pozza)numeri='gittata '+Math.round(st.range)+' · pece '+st.dmg+'/s per '+
    st.pozT.toFixed(1)+'s';
  else if(cfg.aura)numeri=(st.slow>0?'rallenta '+Math.round(st.slow*100)+'% · ':'')+
    'aura '+Math.round(st.range)+' · '+(st.dmg/st.rate).toFixed(1)+' dps';
  else numeri='gittata '+Math.round(st.range)+' · '+(st.dmg/st.rate).toFixed(1)+' dps';
  let scegli='';
  if(armScegli){
    const et=slot===armSlot?'SCELTA':(dentro?'SPOSTA QUI':'SCEGLI');
    scegli='<button type="button" class="armPick'+(slot===armSlot?' on':'')+
      '" data-arm-choose="'+k+'">'+et+'</button>';
  }
  return '<div class="armR'+(dentro?' on':'')+'" data-t="'+k+'">'+
    '<span class="ap">'+spr(k+'1',2)+'</span>'+ 
    '<span class="at"><span class="an">'+cfg.short+
      '<span class="ar">'+(cfg.ruolo||'')+'</span></span>'+ 
      '<span class="ad">'+cfg.desc+'<br><i>'+numeri+'</i></span></span>'+ 
    '<span class="armActions">'+scegli+
      '<button type="button" class="armMore" data-arm-info="'+k+'">INFO</button></span></div>';
}
function armCosto(k,lv){
  const cfg=TOWERS[k];
  if(lv===1)return {passo:cfg.cost,tot:cfg.cost};
  let tot=cfg.cost;for(let g=1;g<lv;g++)tot+=Math.round(cfg.cost*UPMUL[g-1]);
  return {passo:Math.round(cfg.cost*UPMUL[lv-2]),tot};
}
function armStatistiche(k,lv){
  const cfg=TOWERS[k],st=tstats({type:k,lv}),v=[];
  if(cfg.sostegno){
    v.push('VOCE <b>'+Math.round(st.range)+'</b>');
    v.push('DANNO AI VICINI <b>+'+Math.round(st.sdmg*100)+'%</b>');
    v.push('CADENZA AI VICINI <b>+'+Math.round(st.srate*100)+'%</b>');
  }else if(cfg.cut){
    v.push('AURA <b>'+Math.round(st.range)+'</b>');
    v.push('CORAZZA SCROSTATA <b>'+Math.round(st.cut*100)+'%</b>');
    v.push('<i>Non infligge danno diretto</i>');
  }else if(cfg.pozza){
    v.push('PECE <b>'+st.dmg+'/s</b> PER <b>'+st.pozT.toFixed(1)+'s</b>');
    v.push('POZZA <b>'+Math.round(st.pozR)+'</b> · GITTATA <b>'+Math.round(st.range)+'</b>');
    v.push('VERSA OGNI <b>'+st.rate.toFixed(2)+'s</b>');
  }else if(cfg.aura){
    v.push((st.slow>0?'RINTOCCO':'MORSO')+' <b>'+st.dmg+'</b> · DPS <b>'+
      (st.dmg/st.rate).toFixed(1)+'</b>');
    v.push('AURA <b>'+Math.round(st.range)+'</b> · OGNI <b>'+st.rate.toFixed(2)+'s</b>');
    if(st.slow>0)v.push('RALLENTA <b>'+Math.round(st.slow*100)+'%</b>');
  }else{
    v.push('DANNO <b>'+st.dmg+'</b> · DPS <b>'+(st.dmg/st.rate).toFixed(1)+'</b>');
    v.push('GITTATA <b>'+Math.round(st.range)+'</b> · CADENZA <b>'+st.rate.toFixed(2)+'s</b>');
  }
  if(st.splash)v.push('AREA <b>'+Math.round(st.splash)+'</b> · USTIONE <b>'+st.burn.toFixed(0)+'/s</b>');
  if(st.pull)v.push('ARRETRA <b>'+Math.round(st.pull)+' px</b>');
  if(st.ap===1)v.push('<i>Trapassa ogni corazza</i>');
  else if(st.ap>0)v.push('<i>Ignora il '+Math.round(st.ap*100)+'% della corazza</i>');
  return v.join('<br>');
}
function armDettaglio(k){
  const cfg=TOWERS[k];
  let h=armSlotHtml()+'<button type="button" class="armBack" data-arm-back="1">← TUTTI GLI EDIFICI</button>'+ 
    '<div class="armInfoHead"><div class="nome">'+cfg.name+'</div><div class="ruolo">'+cfg.ruolo+'</div>'+ 
    '<div class="desc">'+cfg.desc+'</div></div>';
  if(armScegli)h+='<button type="button" class="armInfoPick" data-arm-choose="'+k+'">ASSEGNA ALLO SLOT '+
    ROMAN(armSlot+1)+'</button>';
  h+='<div class="cmpH">I CINQUE GRADI</div>';
  for(let lv=1;lv<=MAXLV;lv++){
    const c=armCosto(k,lv),prezzo=lv===1?'ERIGI <b>◈'+c.passo+'</b>':
      lex('rito',msel)+' <b>◈'+c.passo+'</b> · INVESTITO <b>◈'+c.tot+'</b>';
    h+='<div class="armLv'+(lv===MAXLV?' max':'')+'"><div class="lvPic">'+spr(k+lv,2)+
      '<span class="lvN">GRADO '+ROMAN(lv)+'</span></div><div class="lvStat">'+prezzo+'<br>'+ 
      armStatistiche(k,lv)+(lv===MAXLV?'<br><i>MARMO · ORO · RITO COMPIUTO</i>':'')+'</div></div>';
  }
  return h;
}
/* i numeri a lettere: si ricavano dal catalogo, se no invecchiano al primo
   edificio aggiunto — è già successo */
const LETT=['nessuno','uno','due','tre','quattro','cinque','sei','sette','otto',
  'nove','dieci','undici','dodici'];
const conta=n=>LETT[n]||String(n);
function buildArmeria(){
  if(armInfo&&TOWERS[armInfo])return armDettaglio(armInfo);
  let h=armSlotHtml()+'<div class="cmpT cmpI">'+conta(TORDER.length).replace(/^./,c=>c.toUpperCase())+
    ' edifici, <b>'+conta(NSLOT)+'</b> in campo. La quaterna si sceglie prima di scendere e non '+
    'si cambia più: sceglila guardando la veglia che ti aspetta, non l\'ultima che hai vinto.'+
    '<br><br>Ogni edificio ha <b>cinque gradi</b>: i primi quattro crescono di sagoma, il quinto '+
    'cambia materia — marmo e oro, fiamma fredda — e non si ingrandisce più.</div>';
  h+='<div class="cmpH">LE CONSACRAZIONI</div>';
  for(const k of TORDER)h+=armRiga(k);
  return h;
}
function armeriaAggiorna(){
  el('scLore').innerHTML=buildArmeria();
  const sc=el('scScore');
  sc.classList.remove('hidden');
  if(armScegli){
    const n=armPiene();
    sc.innerHTML=armAvviso||('SLOT <b>'+ROMAN(armSlot+1)+'</b> ATTIVO · '+
      (n<NSLOT?'DA RIEMPIRE: <b>'+(NSLOT-n)+'</b>':'QUATERNA PRONTA'));
    el('scMain').textContent='SCENDI · '+ATTO[tsel].nome;
    el('scMain').disabled=!armPronta();
  }else{
    sc.innerHTML=conta(TORDER.length).toUpperCase()+' EDIFICI · '+conta(NSLOT).toUpperCase()+' IN CAMPO';
  }
}
function armeria(scegli){
  smode='armeria';armScegli=!!scegli;armAvviso='';armSlot=0;armInfo=null;
  const q=quaterneValida(PROG.arm[tsel]||QUATERNA_BASE);
  armSel=Array.from({length:NSLOT},(_,i)=>q[i]||null);
  showScreen("L'ARMERIA",scegli?'SCEGLI CON CHE COSA SCENDERE':'LE PIETRE CHE PUOI CONSACRARE',
    '','SCENDI','TORNA INDIETRO',null,null,null);
  el('screen').classList.add('wide');
  if(!scegli)el('scMain').classList.add('hidden');
  else el('scMain').classList.remove('hidden');
  armeriaAggiorna();
}
el('scLore').addEventListener('click',ev=>{
  if(smode!=='armeria')return;
  const hit=s=>ev.target.closest?ev.target.closest(s):null;
  const slot=hit('[data-arm-slot]');
  if(slot&&armScegli){
    audio();armSlot=Math.max(0,Math.min(NSLOT-1,Number(slot.dataset.armSlot)||0));
    armAvviso='SLOT <b>'+ROMAN(armSlot+1)+'</b> · scegli un edificio dal catalogo';
    armeriaAggiorna();return;
  }
  const info=hit('[data-arm-info]');
  if(info){audio();armInfo=info.dataset.armInfo;armAvviso='';armeriaAggiorna();
    el('scLore').scrollTop=0;return;}
  if(hit('[data-arm-back]')){audio();armInfo=null;armeriaAggiorna();el('scLore').scrollTop=0;return;}
  const scegli=hit('[data-arm-choose]');
  if(!scegli||!armScegli)return;
  audio();
  const k=scegli.dataset.armChoose,altro=armSel.indexOf(k),vecchio=armSel[armSlot];
  if(altro!==armSlot){
    armSel[armSlot]=k;
    if(altro>=0)armSel[altro]=vecchio||null;
  }
  armAvviso='<b>'+TOWERS[k].short+'</b> assegnata allo slot '+ROMAN(armSlot+1);
  if(!vecchio){const vuota=armSel.findIndex(x=>!x);if(vuota>=0)armSlot=vuota;}
  const uscivaInfo=!!armInfo;if(armInfo)armInfo=null;
  armeriaAggiorna();
  if(uscivaInfo)el('scLore').scrollTop=0;
});
el('scMain').addEventListener('click',()=>{
  audio();
  if(smode==='help')mappa();          // il compendio è roba del mondo
  else if(smode==='albo')mondi();
  else if(smode==='armeria'){if(armScegli)startScen(tsel,armSel);else mondi();}
  else if(smode==='mondi')mappa();
  // dalla mappa si passa sempre dall'armeria, salvo riprendere un sospeso
  else if(smode==='mappa'){if(haSalvataggio(tsel))riprendi(tsel);else armeria(true);}
  else if(smode==='avanti'){scartaSalvataggio(G.act);tsel=G.act+1;armeria(true);}
  else if(smode==='fine')restaAVegliare();
  else if(smode==='over')armeria(true);
  else mondi();
});
el('scAlt').addEventListener('click',()=>{
  audio();
  if(smode==='avanti')restaAVegliare();
  else if(smode==='mondi')menu();
  else if(smode==='armeria')armScegli?mappa():mondi();
  else if(smode==='mappa'||smode==='fine')mondi();
  else mappa();   // la sconfitta torna alla mappa del proprio mondo
});
el('scAlt2').addEventListener('click',()=>{
  audio();
  if(smode==='menu'){const s=scenariSospesi();if(s.length)riprendi(s[s.length-1]);}
  else if(smode==='mondi')armeria(false);
  else if(smode==='mappa')armeria(true);   // ricomincia da capo: si riparte dalla scelta
});
el('scAlt3').addEventListener('click',()=>{
  audio();
  if(smode==='menu')cambiaProfilo();
  else if(smode==='mondi')alboScreen();
  else if(smode==='mappa')help();
});
function endless(){
  G.endless=true;G.state='play';smode='play';
  hideScreen();
  uiDirty();syncUI();banner('OLTRE IL NUMERO','Nessuno verrà a darti il cambio');
}

/* Il campo sgombro dell'atto `a`: nessuna torre, niente in volo, ondata a
   zero. La usano sia chi comincia una veglia sia chi ne riprende una
   sospesa — quest'ultimo ci rimette sopra l'istantanea. */
function azzeraCampo(a){
  if(G.act!==a)applyAct(a);else G.act=a;
  G.state='play';smode='play';G.wave=0;G.lacrime=0;G.sigilli=0;
  G.paused=false;G.endless=false;
  G.bossRef=null;G.bossIn=false;G.bossHp=0;
  G.enemies.length=0;G.towers.length=0;G.shots.length=0;G.beams.length=0;
  G.parts.length=0;G.rings.length=0;G.queue.length=0;G.pozze.length=0;
  G.sel=null;G.build=null;G.waveOn=false;G.t=0;G.killed=0;G.shake=0;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(grid[r][c]===3)grid[r][c]=0;
  rebuildFree();
  hideScreen();chiudiPausa();
  el('bPause').classList.remove('on');
  closePanel();
}
/* Ogni scenario comincia nudo: nessuna torre, nessun sigillo, l'ondata a
   zero. L'unica cosa che si porta dietro dalla campagna sono le lacrime
   concesse in partenza, ed è lì che sta il compenso per la difficoltà. */
function startScen(a,quaterna){
  a=Math.max(1,Math.min(NSCEN,a|0));
  scartaSalvataggio(a);   // ricominciare da capo scarta la veglia sospesa
  G.loadout=quaterneValida(quaterna||PROG.arm[a]||QUATERNA_BASE);
  PROG.arm[a]=G.loadout.slice();progSalva();   // la prossima volta la ritrova
  azzeraCampo(a);
  G.lacrime=ATTO[a].lac;G.sigilli=ATTO[a].sig||0;
  buildBar();syncUI();fit();
  if(a===2){G.shake=7;SFX.over();
    for(let i=0;i<40;i++)part(Math.random()*W,H*Math.random(),Math.random()*30-15,
      -20-Math.random()*40,1.2,Math.random()<.5?C.ember:C.blood,-14);}
  else if(a===3){G.shake=8;SFX.roar();
    for(let i=0;i<50;i++)part(Math.random()*W,H,Math.random()*30-15,
      -30-Math.random()*50,1.4,Math.random()<.5?'#f7e08a':'#ffffff',22);}
  else if(a>=4){G.shake=5+CYFASE;SFX.beam();
    const ca=CYFASE===1?'#b7ff45':'#20d8ff',cb=CYFASE===2?'#ffffff':'#ff3bd4';
    for(let i=0;i<64;i++)part(Math.random()*W,-8-Math.random()*H*.25,
      5+Math.random()*18,35+Math.random()*75,.8,Math.random()<.7?ca:cb,14);}
  banner(ROMAN(a)+' · '+ATTO[a].nome,
    a===MONDO[mondoDi(a)].scen[0]?lex('erigi',mondoDi(a)):lex('daCapo',mondoDi(a)));
}
const startGame=()=>startScen(1);   // usato dal banco di prova

/* Venti ondate compiute. Se la veglia non era l'ultima del mondo si sceglie
   fra restare e scendere; se lo era, il mondo è chiuso e quello dopo — quando
   ci sarà — è ancora sotto ceralacca. In tutti i casi restare a vegliare
   significa che la partita continua: è l'unico ramo che non scarta il sospeso. */
function compiuto(){
  const a=G.act,fineMondo=ultimoDelMondo(a),ultimo=a>=NSCEN;
  G.state='won';PROG.fin[a]=true;segna();
  chiudiPausa();msel=mondoDi(a);tsel=a;
  if(!ultimo)sblocca(a+1);
  progSalva();
  const c=CHIUSURA[a]||CHIUSURA[NSCEN];
  let coda;
  if(fineMondo){
    const m=mondoDi(a)+1,pross=MONDO[m];
    coda='<br><br>Le veglie di questo mondo sono compiute. '+
      (pross&&pross.scen.length?'La soglia successiva è aperta: <b>'+pross.nome+'</b>.'
        :(pross?'Oltre c\'è dell\'altro, ma la ceralacca è ancora intera: <b>prossimamente</b>.'
              :'Oltre non c\'è ancora nulla.'))+
      '<br><br>Puoi restare qui a vegliare finché reggerai: da qui in poi le ondate non hanno '+
      'più numero, e la serie finisce solo quando finisci tu — o quando la sospendi.';
  }else{
    coda='<br><br>'+lex('tuoRito',mondoDi(a))+' però resta quassù: <b>le torri non ti '+
      'seguono</b>. Di là si ricomincia '+lex('pietraNuda',mondoDi(a+1))+', con <b>'+
      ATTO[a+1].lac+' lacrime</b> e nient\'altro. Oppure resti, e vegli finché reggi.';
  }
  smode=fineMondo?'fine':'avanti';
  showScreen(c.tit,c.sub,c.testo+coda,
    fineMondo?'RESTA A VEGLIARE':'SCENDI · '+ATTO[a+1].nome,
    fineMondo?'TORNA AI MONDI':'RESTA A VEGLIARE',
    'ONDATE: <b>'+ROMAN(G.wave)+'</b> · CADUTI: <b>'+G.killed+'</b> · TORRI: <b>'+G.towers.length+'</b>',
    null);
}
/* restare a vegliare: la partita prosegue, quindi il sospeso si riscrive */
function restaAVegliare(){endless();salvaPartita();}

/* ═══ MEMORIA ═══
   Niente localStorage (vincolo del progetto): tutto passa da window.storage,
   e se non c'è la campagna vive quanto la sessione. Due chiavi distinte:
   `veglia:prog` sono i progressi — piccoli, preziosi, scritti spesso — e
   `veglia:save` le partite sospese, che sono grosse. Tenerle separate vuol
   dire che un salvataggio malandato non si porta dietro l'albo d'oro. */
function progSalva(){
  try{if(window.storage&&window.storage.set)
    window.storage.set(COLLAUDO?'veglia:prog:test':'veglia:prog',JSON.stringify(PROG));}catch(e){}
}
function sblocca(a){
  if(a>PROG.unl&&a<=NSCEN){PROG.unl=a;progSalva();}
}
/* L'albo: si infila la serie, si riordina per ondata (a parità, per caduti)
   e si tiene solo la cima. Ci passa ogni fine partita, anche l'abbandono. */
function segna(){
  if(G.wave<1)return;
  const l=albo(G.act).slice();
  l.push({w:G.wave,k:G.killed});
  l.sort((x,y)=>y.w-x.w||y.k-x.k);
  PROG.rec[G.act]=l.slice(0,NALBO);
  progSalva();
}

/* ═══ PARTITE SOSPESE ═══
   Uno slot per veglia. Dell'istantanea fa parte tutto quel che non si può
   ricavare da capo: le sagome (`sp`), le statistiche (`st`) e la scheda della
   creatura (`def`) si rimettono a mano al ritorno, e gli effetti che durano
   meno di un secondo — proiettili, raggi, anelli, faville — non si salvano
   affatto: nessuno si accorgerà che sono spariti. */
const SAVE={};
const copiaMemoria=o=>JSON.parse(JSON.stringify(o));
function sostituisciMemoria(dst,src){
  for(const k in dst)delete dst[k];
  if(src&&typeof src==='object')for(const k in src)dst[k]=src[k];
}
async function leggiMemoria(k){
  try{
    if(!(window.storage&&window.storage.get))return null;
    const r=await window.storage.get(k);
    return r&&r.value?JSON.parse(r.value):null;
  }catch(e){return null;}
}
/* Il collaudo è un profilo vero e separato: record, armerie e sospesi non
   finiscono mai nella campagna normale. Aprirlo porta direttamente al Mondo II
   e rende selezionabili tutte le sei veglie già realizzate. */
async function cambiaProfilo(){
  if(CAMBIO_PROFILO)return;CAMBIO_PROFILO=true;
  try{
    if(!COLLAUDO){
      PROFILO_NORMALE={prog:copiaMemoria(PROG),save:copiaMemoria(SAVE)};
      COLLAUDO=true;
      const p=await leggiMemoria('veglia:prog:test'),s=await leggiMemoria('veglia:save:test');
      sostituisciMemoria(PROG,p||{unl:NSCEN,fin:{},rec:{},arm:{}});
      PROG.fin=PROG.fin&&typeof PROG.fin==='object'?PROG.fin:{};
      PROG.rec=PROG.rec&&typeof PROG.rec==='object'?PROG.rec:{};
      PROG.arm=PROG.arm&&typeof PROG.arm==='object'?PROG.arm:{};
      PROG.unl=NSCEN;sostituisciMemoria(SAVE,s||{});migraProg();progSalva();
      tsel=MONDO[2].scen[0];msel=2;applyAct(tsel);
    }else{
      progSalva();saveSalva();COLLAUDO=false;
      if(PROFILO_NORMALE){
        sostituisciMemoria(PROG,PROFILO_NORMALE.prog);
        sostituisciMemoria(SAVE,PROFILO_NORMALE.save);
      }
      PROG.unl=Math.min(NSCEN,Math.max(1,PROG.unl|0)||1);
      tsel=PROG.unl;msel=mondoDi(tsel);applyAct(tsel);
    }
    menu();
  }finally{CAMBIO_PROFILO=false;}
}
const CAMPI_NEMICO=['type','hp','max','speed','armor','bounty','seg','segD','x','y',
  'dir','prog','slowAmt','burn','burnT','flash','bob','spawnT','stepT','broken'];
/* Un proiettile insegue un oggetto, e un oggetto non si scrive su disco: il
   bersaglio si salva come posto nella lista delle creature, e al ritorno si
   riaggancia. Sono pochi e vivono un attimo, ma bastano a far divergere due
   partite altrimenti identiche — una caldaia ne ha quasi sempre uno per aria. */
const CAMPI_COLPO=['x','y','lx','ly','speed','dmg','ap','splash','burn','pull',
  'pozR','pozT','col','life','type','trail','a'];
function istantanea(){
  const e2=[],indice=new Map();
  for(const e of G.enemies){
    if(!e.alive)continue;
    indice.set(e,e2.length);
    const o={};for(const k of CAMPI_NEMICO)o[k]=e[k];
    e2.push(o);
  }
  const s2=G.shots.map(s=>{
    const o={};for(const k of CAMPI_COLPO)if(s[k]!==undefined)o[k]=s[k];
    o.ti=indice.has(s.target)?indice.get(s.target):-1;
    return o;
  });
  return {v:1,act:G.act,wave:G.wave,lacrime:G.lacrime,sigilli:G.sigilli,
    killed:G.killed,endless:!!G.endless,waveOn:!!G.waveOn,t:G.t,speed:G.speed,
    loadout:G.loadout.slice(),   // una veglia ripresa ritrova i suoi edifici
    towers:G.towers.map(t=>({type:t.type,c:t.c,r:t.r,lv:t.lv,cd:t.cd,rec:t.rec,
      spent:t.spent,aim:t.aim})),
    enemies:e2,shots:s2,
    queue:G.queue.map(q=>({t:q.t,at:q.at,wave:q.wave})),
    // la pece dura qualche secondo: troppo per buttarla via come una favilla
    pozze:G.pozze.map(p=>({x:p.x,y:p.y,r:p.r,t:p.t,max:p.max,dps:p.dps,ap:p.ap}))};
}
function ripristina(s){
  if(!s||!s.act)return false;
  azzeraCampo(Math.max(1,Math.min(NSCEN,s.act|0)));   // rifà percorso e griglia
  G.loadout=quaterneValida(s.loadout);buildBar();
  G.wave=s.wave|0;G.lacrime=s.lacrime|0;G.sigilli=s.sigilli|0;
  G.killed=s.killed|0;G.endless=!!s.endless;G.waveOn=!!s.waveOn;
  G.t=+s.t||0;G.speed=s.speed>=1&&s.speed<=3?s.speed:1;
  for(const d of s.towers||[]){
    if(!TOWERS[d.type])continue;
    const t={type:d.type,c:d.c,r:d.r,x:d.c*TILE+TILE/2,y:d.r*TILE+TILE/2,
      lv:Math.max(1,Math.min(MAXLV,d.lv|0)),cd:+d.cd||0,rec:+d.rec||0,
      spent:d.spent|0,aim:+d.aim||0};
    t.st=tstats(t);t.sp=S[t.type+t.lv];
    G.towers.push(t);grid[t.r][t.c]=3;
  }
  G.towers.sort((a,b)=>a.y-b.y);rebuildFree();ricalcolaTorri();
  for(const d of s.enemies||[]){
    const def=ENEMIES[d.type];if(!def)continue;
    const e={def,alive:true,escaped:false};
    for(const k of CAMPI_NEMICO)e[k]=d[k];
    G.enemies.push(e);
    if(def.final){G.bossRef=e;G.bossHp=Math.max(0,e.hp/e.max);}
  }
  for(const d of s.shots||[]){
    const o={};for(const k of CAMPI_COLPO)if(d[k]!==undefined)o[k]=d[k];
    o.target=(d.ti>=0&&d.ti<G.enemies.length)?G.enemies[d.ti]:null;
    G.shots.push(o);
  }
  for(const q of s.queue||[])if(ENEMIES[q.t])G.queue.push({t:q.t,at:+q.at||0,wave:q.wave|0});
  for(const p of s.pozze||[])G.pozze.push({x:+p.x||0,y:+p.y||0,r:+p.r||0,t:+p.t||0,
    max:+p.max||1,dps:+p.dps||0,ap:+p.ap||0});
  el('bSpeed').textContent='×'+G.speed;
  el('bSpeed').classList.toggle('on',G.speed>1);
  uiDirty();syncUI();fit();
  return true;
}
const haSalvataggio=a=>!!SAVE[a];
const scenariSospesi=()=>{const l=[];for(let a=1;a<=NSCEN;a++)if(SAVE[a])l.push(a);return l;};
function saveSalva(){
  try{if(window.storage&&window.storage.set)
    window.storage.set(COLLAUDO?'veglia:save:test':'veglia:save',JSON.stringify(SAVE));}catch(e){}
}
function salvaPartita(){
  if(G.state!=='play')return false;
  SAVE[G.act]=istantanea();saveSalva();return true;
}
function scartaSalvataggio(a){
  if(!SAVE[a])return;
  delete SAVE[a];saveSalva();
}
function riprendi(a){
  if(!SAVE[a])return false;
  const ok=ripristina(SAVE[a]);
  // si può riprendere anche dal menu principale, saltando la mappa: chi poi
  // esce dev'essere riportato al proprio mondo, non a quello di prima
  if(ok){msel=mondoDi(a);tsel=a;
    banner(ROMAN(a)+' · '+ATTO[a].nome,'La veglia riprende dove l\'avevi lasciata');}
  return ok;
}
/* dalla mappa: se c'è un sospeso lo si riprende, se no si comincia */
function riprendiOScendi(a){if(!riprendi(a))startScen(a);}

(async()=>{try{
  if(!(window.storage&&window.storage.get))return;
  const r=await window.storage.get('veglia:prog');
  if(r&&r.value){
    const p=JSON.parse(r.value);
    if(p&&typeof p==='object'){
      PROG.unl=Math.min(NSCEN,Math.max(1,p.unl|0)||1);
      if(p.fin&&typeof p.fin==='object')PROG.fin=p.fin;
      if(p.rec&&typeof p.rec==='object')PROG.rec=p.rec;
      if(p.arm&&typeof p.arm==='object')PROG.arm=p.arm;
    }
  }else{
    // dalla vecchia campagna unica da sessanta ondate al conto per veglia
    const v=await window.storage.get('veglia:best');
    const b=v&&v.value?parseInt(v.value,10)||0:0;
    if(b>0){
      PROG.unl=Math.min(NSCEN,Math.floor((b-1)/20)+1);
      for(let a=1;a<=PROG.unl;a++){
        const w=Math.min(20,b-(a-1)*20);
        if(w>0)PROG.rec[a]=[{w,k:0}];
      }
    }
  }
  migraProg();
  const sv=await window.storage.get('veglia:save');
  if(sv&&sv.value){
    const p=JSON.parse(sv.value);
    if(p&&typeof p==='object')
      for(let a=1;a<=NSCEN;a++)if(p[a]&&p[a].act)SAVE[a]=p[a];
  }
  tsel=PROG.unl;msel=mondoDi(PROG.unl);
  if(G.state==='menu'&&smode==='menu')menu();
}catch(e){}})();
/* Le memorie vecchie hanno un record solo per veglia, e non sanno di `fin`:
   un record da venti ondate è una veglia compiuta, e lo è anche ogni veglia
   che ne ha una più profonda aperta dopo di sé. */
function migraProg(){
  let tocco=false;
  for(let a=1;a<=NSCEN;a++){
    const r=PROG.rec[a];
    if(r&&!Array.isArray(r)){PROG.rec[a]=[{w:r.w|0,k:r.k|0}];tocco=true;}
    const l=albo(a);
    if(!PROG.fin[a]&&(a<PROG.unl||(l[0]&&l[0].w>=20))){PROG.fin[a]=true;tocco=true;}
  }
  if(tocco)progSalva();
}

if('serviceWorker' in navigator&&location.protocol.startsWith('http'))
  navigator.serviceWorker.register('sw.js').catch(()=>{});

/* ─────────── AVVIO ─────────── */
buildBar();
menu();
fit();
setTimeout(fit,120);
requestAnimationFrame(frame);
