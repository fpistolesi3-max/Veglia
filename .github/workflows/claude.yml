# Tagga @claude in una issue o in un commento di pull request e lui lavora
# direttamente su questo repository: legge CLAUDE.md, modifica i file e
# spinge i commit su un ramo.
#
# Prima che funzioni servono due cose, una sola volta:
#   1. installare la Claude GitHub App su questo repository
#      -> https://github.com/apps/claude
#   2. aggiungere il segreto di autenticazione in
#      Settings -> Secrets and variables -> Actions
#      - CLAUDE_CODE_OAUTH_TOKEN  se usi un abbonamento Pro/Max
#        (si genera da computer con:  claude setup-token)
#      - oppure ANTHROPIC_API_KEY se usi una chiave della Console
#        (in quel caso sostituisci la riga finale con:
#         anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }} )
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  claude:
    if: |
      contains(github.event.comment.body, '@claude') ||
      contains(github.event.issue.body, '@claude') ||
      contains(github.event.issue.title, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
