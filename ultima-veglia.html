<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#07060a">
<title>L'Ultima Veglia</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;background:#07060a;overflow:hidden;touch-action:manipulation;
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:#d8cbb0}
#app{height:100dvh;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) 6px calc(env(safe-area-inset-bottom) + 2px)}

/* ---------- HUD ---------- */
#hud{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:6px 4px 5px;
  border-bottom:1px solid #251f2d}
.stat{display:flex;align-items:center;gap:4px;font-size:12px;letter-spacing:.06em}
.stat b{font-weight:600}
.sig{color:#c14a4a}.lac{color:#c9a227}.wav{color:#8fa5b0;margin-left:auto;font-size:10.5px;letter-spacing:.14em}
.ibtn{width:30px;height:26px;border:1px solid #332b3d;background:#120e18;color:#9c8f78;
  font:600 11px/1 ui-monospace,monospace;border-radius:2px}
.ibtn:active{background:#1e1826}
.ibtn.on{color:#c9a227;border-color:#5a4a22}

/* ---------- CAMPO ---------- */
#stage{flex:1 1 auto;display:flex;align-items:center;justify-content:center;position:relative;min-height:0}
#wrap{position:relative;filter:drop-shadow(0 0 18px rgba(0,0,0,.9))}
canvas#game{display:block;image-rendering:pixelated;image-rendering:crisp-edges;
  border:1px solid #2b2434;background:#07060a}
#banner{position:absolute;left:0;right:0;top:26%;text-align:center;pointer-events:none;opacity:0}
#banner.go{animation:ban 2.6s ease-out}
#banner .b1{font-size:9px;letter-spacing:.5em;color:#7d6a4a}
#banner .b2{font-size:15px;letter-spacing:.18em;color:#d8cbb0;margin-top:3px;
  text-shadow:0 0 12px #8e1b25}
@keyframes ban{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}

/* ---------- BARRA TORRI ---------- */
#bar{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:6px 2px 4px}
.tcard{border:1px solid #2b2434;background:linear-gradient(#14101b,#0c0912);border-radius:3px;
  padding:4px 2px 3px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.tcard canvas{image-rendering:pixelated;width:28px;height:36px;margin-top:-4px}
.tcard .tn{font-size:7.5px;letter-spacing:.05em;color:#9c8f78;text-align:center;line-height:1.15}
.tcard .tc{font-size:10px;color:#c9a227;letter-spacing:.04em}
.tcard.sel{border-color:#c9a227;background:linear-gradient(#221a12,#140e10);box-shadow:0 0 10px rgba(201,162,39,.18)}
.tcard.poor{opacity:.38}
.tcard.poor .tc{color:#8e1b25}

/* ---------- AZIONE ---------- */
#act{flex:0 0 auto;padding:2px 2px 4px}
.big{width:100%;padding:11px;border:1px solid #5a4a22;border-radius:3px;
  background:linear-gradient(#1d1710,#120d13);color:#c9a227;
  font:600 12px/1 ui-monospace,monospace;letter-spacing:.22em}
.big:active{background:#2a2016}
.big.ghost{border-color:#332b3d;color:#8b7f6c;letter-spacing:.16em}

/* ---------- PANNELLO TORRE ---------- */
#panel{position:absolute;left:6px;right:6px;bottom:6px;z-index:5;
  border:1px solid #4a3f22;border-radius:3px;background:rgba(10,8,14,.97);
  padding:8px 9px;display:none}
#panel.on{display:block}
#panel .ph{display:flex;align-items:baseline;gap:6px;margin-bottom:5px}
#panel .pn{font-size:11px;letter-spacing:.1em;color:#d8cbb0}
#panel .pl{font-size:9px;color:#c9a227;letter-spacing:.1em}
#panel .px{margin-left:auto;color:#6b6070;font-size:14px;padding:0 4px}
#panel .pstats{font-size:9px;color:#8b7f6c;line-height:1.6;letter-spacing:.03em;margin-bottom:7px}
#panel .pstats span{color:#b9ac93}
#panel .prow{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#panel button{padding:9px 4px;border-radius:2px;font:600 10px/1.3 ui-monospace,monospace;letter-spacing:.08em}

/* schermi bassi (SE, mini): interfaccia compatta per lasciare spazio alla scena */
@media (max-height:720px){
  #hud{padding:3px 4px}
  #bar{padding:3px 2px 2px;gap:4px}
  .tcard canvas{width:22px;height:28px}
  .tcard{padding:3px 2px 2px}
  .tcard .tn{font-size:7px}
  .tcard .tc{font-size:9px}
  .big{padding:8px;font-size:11px;letter-spacing:.16em}
  #act{padding:1px 2px 2px}
}
.bup{border:1px solid #5a4a22;background:#1b1510;color:#c9a227}
.bup:disabled{opacity:.35}
.bsell{border:1px solid #4a2028;background:#170f13;color:#b4636b}

/* ---------- SCHERMATE ---------- */
#screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:26px 22px;text-align:center;
  background:radial-gradient(ellipse at 50% 38%,#170f18 0%,#07060a 72%)}
#screen.off{display:none}
#screen h1{font-size:26px;letter-spacing:.3em;color:#d8cbb0;font-weight:600;
  text-shadow:0 0 22px rgba(142,27,37,.75);margin-left:.3em}
#screen .rule{width:120px;height:1px;background:linear-gradient(90deg,transparent,#c9a227,transparent);margin:14px 0}
#screen .sub{font-size:9.5px;line-height:2;letter-spacing:.16em;color:#8b7f6c;max-width:300px}
#screen .lore{font-size:9.5px;line-height:1.95;color:#7a6f60;max-width:310px;text-align:left;letter-spacing:.02em}
#screen .lore b{color:#c9a227;font-weight:600}
/* compendio illustrato */
#screen.wide{justify-content:flex-start;padding:14px 16px}
#screen.wide h1{font-size:17px;letter-spacing:.26em}
#screen.wide .rule{margin:9px 0}
#screen.wide .lore{max-width:340px;width:100%;flex:1 1 auto;min-height:0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;padding-right:5px}
#screen.wide .btns{margin-top:12px}
.cmpH{font-size:8px;letter-spacing:.3em;color:#7d6a4a;margin:14px 0 2px;
  border-bottom:1px solid #2b2434;padding-bottom:5px}
.cmpR{display:flex;gap:10px;align-items:flex-end;padding:7px 0 8px;
  border-bottom:1px solid #17131f}
.cmpP{display:flex;gap:6px;align-items:flex-end;justify-content:center;flex:0 0 auto}
.cmpP img{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.cmpT{font-size:9px;line-height:1.6;color:#7a6f60;padding-bottom:1px}
.cmpT b{color:#c9a227;font-weight:600;letter-spacing:.05em}
.cmpT i{color:#8fa5b0;font-style:normal}
.cmpT u{color:#c14a4a;text-decoration:none}
.cmpI{padding:2px 0 4px}
#screen .btns{margin-top:22px;width:100%;max-width:300px;display:flex;flex-direction:column;gap:8px}
#screen .scoreline{font-size:10px;letter-spacing:.14em;color:#8b7f6c;margin-top:10px}
#screen .scoreline b{color:#c9a227}
.hidden{display:none!important}
</style>
</head>

<div id="app">

  <div id="hud">
    <div class="stat sig">✦ <b id="hSig">20</b></div>
    <div class="stat lac">◈ <b id="hLac">130</b></div>
    <div class="stat wav" id="hWave">VEGLIA I</div>
    <button class="ibtn" id="bSpeed">×1</button>
    <button class="ibtn" id="bSound">♪</button>
    <button class="ibtn" id="bPause">‖</button>
  </div>

  <div id="stage">
    <div id="wrap">
      <canvas id="game"></canvas>
      <div id="banner"><div class="b1" id="banA">ONDATA I</div><div class="b2" id="banB">I Penitenti</div></div>
    </div>
    <div id="panel">
      <div class="ph"><span class="pn" id="pName">—</span><span class="pl" id="pLev">Liv 1</span>
        <span class="px" id="pClose">✕</span></div>
      <div class="pstats" id="pStats"></div>
      <div class="prow">
        <button class="bup" id="pUp">POTENZIA</button>
        <button class="bsell" id="pSell">DEMOLISCI</button>
      </div>
    </div>
  </div>

  <div id="bar"></div>
  <div id="act"><button class="big" id="bWave">SUONA LA CAMPANA</button></div>

  <div id="screen">
    <h1 id="scTitle">L'ULTIMA<br>VEGLIA</h1>
    <div class="rule"></div>
    <div class="sub" id="scSub">TOWER DEFENSE · SAGRATO DI CENERE</div>
    <div class="lore" id="scLore"></div>
    <div class="scoreline hidden" id="scScore"></div>
    <div class="btns">
      <button class="big" id="scMain">INIZIA LA VEGLIA</button>
      <button class="big ghost" id="scAlt">IL RITO — COME SI GIOCA</button>
    </div>
  </div>

</div>

/* ─────────── SPRITE CACHE (con outline automatico) ─────────── */
function makeSprite(art,pal,outline){
  const h=art.length,w=art[0].length;
  const cv=document.createElement('canvas'); cv.width=w+2; cv.height=h+2;
  const x=cv.getContext('2d');
  const filled=(r,c)=>r>=0&&c>=0&&r<h&&c<w&&art[r][c]!=='.';
  if(outline!==null){
    x.fillStyle=outline||C.out;
    for(let r=-1;r<=h;r++)for(let c=-1;c<=w;c++){
      if(filled(r,c))continue;
      if(filled(r-1,c)||filled(r+1,c)||filled(r,c-1)||filled(r,c+1))x.fillRect(c+1,r+1,1,1);
    }
  }
  for(let r=0;r<h;r++)for(let c=0;c<w;c++){
    const ch=art[r][c]; if(ch==='.')continue;
    const col=pal[ch]; if(!col)continue;
    x.fillStyle=col; x.fillRect(c+1,r+1,1,1);
  }
  return {cv,w,h};
}
function flashPal(pal,col){const p={};for(const k in pal)p[k]=col;return p;}
const S={};
function reg(name,art,pal,fl){
  S[name]=makeSprite(art,pal,C.out);
  if(fl)S[name+'_f']=makeSprite(art,flashPal(pal,fl),'#ffffff');
}

function blit(x,sp,px,py,flip,alpha){
  if(alpha!==undefined)x.globalAlpha=alpha;
  if(flip){x.save();x.translate(Math.round(px)+sp.w/2,0);x.scale(-1,1);
    x.drawImage(sp.cv,-sp.w/2-1,Math.round(py)-1);x.restore();}
  else x.drawImage(sp.cv,Math.round(px)-1,Math.round(py)-1);
  if(alpha!==undefined)x.globalAlpha=1;
}

let AC=null,noiseBuf=null;
function audio(){
  if(AC)return AC;
  try{AC=new (window.AudioContext||window.webkitAudioContext)();
    noiseBuf=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  }catch(e){}
  return AC;
}
function tone(f,dur,type,vol,slide){
  if(!G.sound||!AC)return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,AC.currentTime);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),AC.currentTime+dur);
  g.gain.setValueAtTime(0,AC.currentTime);
  g.gain.linearRampToValueAtTime(vol||.06,AC.currentTime+.008);
  g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+dur);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+dur+.02);
}
function noise(dur,vol,freq){
  if(!G.sound||!AC||!noiseBuf)return;
  const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();
  s.buffer=noiseBuf;f.type='bandpass';f.frequency.value=freq||900;f.Q.value=1.2;
  g.gain.setValueAtTime(vol||.05,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+dur);
  s.connect(f);f.connect(g);g.connect(AC.destination);s.start();s.stop(AC.currentTime+dur);
}

function rect(g,col,X,Y,Wd,Ht){g.fillStyle=col;g.fillRect(X|0,Y|0,Wd===undefined?1:Wd,Ht===undefined?1:Ht);}

/* creste montuose: picchi triangolari interpolati fra vertici casuali */
function ridgePts(x0,x1,base,minH,maxH,step){
  const p=[[x0,base-minH]];
  let X=x0+step*(.4+rnd()*.6);
  while(X<x1){p.push([X|0,(base-(minH+rnd()*(maxH-minH)))|0]);X+=step*(.5+rnd()*.9);}
  p.push([x1,base-minH]);return p;
}
function fillRidge(g,p,bottom,col,topCol,snowY){
  for(let i=0;i<p.length-1;i++){
    const ax=p[i][0],ay=p[i][1],bx2=p[i+1][0],by=p[i+1][1],dx=(bx2-ax)||1;
    for(let X=ax;X<bx2;X++){
      const Y=Math.round(ay+(by-ay)*(X-ax)/dx);
      rect(g,col,X,Y,1,bottom-Y);
      rect(g,topCol,X,Y,1,1);
      if(snowY&&Y<snowY&&rnd()<.55)rect(g,topCol,X,Y+1,1,1+((rnd()*2)|0));
    }
  }
}
/* conifera */
function conifer(g,cx,by,h,col,hi){
  for(let i=0;i<h;i++){
    const w=Math.round((i/h)*h*.40);
    rect(g,col,cx-w,by-h+i,w*2+1,1);
    if(i>2&&i%3===0)rect(g,hi,cx-w,by-h+i,1,1);
    if(i>2&&i%4===0)rect(g,hi,cx+w,by-h+i,1,1);
  }
  rect(g,CF.trunk,cx,by-2,1,3);
}

              :(APO?'#6a7488':(INF?'#3d1408':'#251020')),mx+dx,my+dy);
  }
  for(let dy=-mr;dy<=mr;dy++)for(let dx=-mr;dx<=mr;dx++){
    const d=dx*dx+dy*dy;
    if(d>mr*mr)continue;
    if(APO)rect(g,d>mr*mr-10?'#e8e0c0':'#ffffff',mx+dx,my+dy);

function buildBG(){

  for(const d of DECOR)if(d[2]==='candela')LIGHTS.push({x:d[0]*TILE+8,y:d[1]*TILE+4});
  bx.setTransform(1,0,0,1,MARG,MARG);

      bx.fillStyle=rnd()<.5?C.pathA:C.pathB;bx.fillRect(px,py,TILE,TILE);
      for(let i=0;i<7;i++){const a=(rnd()*TILE)|0,b=(rnd()*TILE)|0;
        bx.fillStyle=rnd()<.55?C.pathC:C.pathEdge;bx.fillRect(px+a,py+b,1+((rnd()*2)|0),1);}
      // bordi del sentiero
      bx.fillStyle=C.pathEdge;
      if(!isPath(c,r-1))bx.fillRect(px,py,TILE,1);
      if(!isPath(c,r+1))bx.fillRect(px,py+TILE-1,TILE,1);
      if(!isPath(c-1,r))bx.fillRect(px,py,1,TILE);
      if(!isPath(c+1,r))bx.fillRect(px+TILE-1,py,1,TILE);
    }else{
      const v=rnd();
      bx.fillStyle=v<.34?C.stoneA:(v<.72?C.stoneB:C.stoneC);
      bx.fillRect(px,py,TILE,TILE);
      bx.fillStyle=C.crack;
      bx.fillRect(px,py+TILE-1,TILE,1);bx.fillRect(px+TILE-1,py,1,TILE);
      for(let i=0;i<3;i++){const a=(rnd()*14)|0,b=(rnd()*14)|0;
        bx.fillStyle=rnd()<.5?C.crack:'#3b3346';bx.fillRect(px+a,py+b,1,1);}
      if(rnd()<.09){const a=2+((rnd()*10)|0),b=2+((rnd()*10)|0);
        bx.fillStyle=C.crack;bx.fillRect(px+a,py+b,3,1);bx.fillRect(px+a+2,py+b+1,2,1);}
    }
  }
  // arco / cancello finale
  const gx=5*TILE,gy=17*TILE;

  bx.fillStyle='#3a3348';bx.fillRect(gx-3,gy,3,TILE);bx.fillRect(gx+TILE,gy,3,TILE);
  bx.fillStyle=C.blood;bx.fillRect(gx+2,gy+TILE-3,TILE-4,1);

  for(const[c,r,type]of DECOR){

    blit(bx,sp,c*TILE+(TILE-sp.w)/2,r*TILE+TILE-sp.h);

  bx.restore();
  drawBordo(bx);
}

/* ─────────── PARTICELLE ─────────── */
const MAXPART=190,pPool=[];
function part(px,py,vx,vy,life,col,grav,size){
  if(G.parts.length>=MAXPART)return;
  const p=pPool.pop();
  if(p){p.x=px;p.y=py;p.vx=vx;p.vy=vy;p.life=life;p.max=life;p.col=col;
    p.grav=grav||0;p.s=size||1;G.parts.push(p);}
  else G.parts.push({x:px,y:py,vx,vy,life,max:life,col,grav:grav||0,s:size||1});
}
function burst(px,py,n,col,spd,life,grav){
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=spd*(.35+Math.random()*.9);
    part(px,py,Math.cos(a)*s,Math.sin(a)*s-spd*.25,life*(.6+Math.random()*.7),col,grav);}
}
function coins(px,py,n){
  for(let i=0;i<n;i++)part(px+(Math.random()*6-3),py,(Math.random()*20-10),-24-Math.random()*22,
    .8,Math.random()<.5?C.gold:'#f0d97a',40);
}

/* ─────────── NEMICI ─────────── */
function spawn(type,wave,seg,segD){
  const d=ENEMIES[type];
  const boost=G.endless?Math.pow(1.1,Math.max(0,wave-60)):1;
  const hp=Math.round(d.hp*hpMul(wave)*boost);
  const e={type,def:d,hp,max:hp,speed:d.speed*spdMul(wave),
    armor:d.armor+Math.floor(wave/7),
    bounty:Math.round(d.bounty*(1+.055*(wave-1))),
    seg:seg||0,segD:segD||0,x:PATHPX[0].x,y:PATHPX[0].y,dir:1,prog:0,
    slowAmt:0,burn:0,burnT:0,flash:0,bob:Math.random()*6,alive:true,spawnT:0,
    stepT:.3,broken:false};
  if(d.final){G.bossRef=e;G.shake=8;SFX.roar();
    banner(d.name.toUpperCase(),'SE VARCA LA SOGLIA È FINITA');}
  G.enemies.push(e);
  return e;
}
function damage(e,amt,ap){
  const eff=Math.max(1,amt-e.armor*(1-(ap||0)));
  e.hp-=eff;e.flash=.09;
  checkBreak(e);
  if(e.hp<=0&&e.alive)kill(e);
}
function checkBreak(e){
  if(e.def.breakAt&&!e.broken&&e.hp>0&&e.hp<=e.max*e.def.breakAt)breakArmor(e);
}
function breakArmor(e){
  e.broken=true;
  e.armor=Math.round(e.armor*.4);
  e.speed*=1.15;
  G.shake=Math.max(G.shake,5);
  SFX.crack();
  G.rings.push({x:e.x,y:e.y-8,r:3,max:24,t:.45,col:'#e8a03a'});
  burst(e.x,e.y-8,16,'#6b6252',80,.6,110);
  burst(e.x,e.y-8,8,C.blood,60,.5,90);
}
function kill(e){
  e.alive=false;
  if(e.def.final){
    G.bossRef=null;G.shake=10;
    for(let k=0;k<70;k++)part(e.x,e.y-14,Math.random()*160-80,Math.random()*160-110,
      1.3,Math.random()<.5?C.gold:C.ember,60);
    G.rings.push({x:e.x,y:e.y-14,r:4,max:90,t:.9,col:'#f5ecd0'});
  }
  G.lacrime+=e.bounty;G.killed++;
  const heavy=e.def.boss||e.def.big;
  burst(e.x,e.y-(heavy?8:0),heavy?26:9,e.type==='ombra'?C.spirit:C.blood,heavy?90:55,.55,90);
  if(heavy)burst(e.x,e.y-6,14,'#6b6252',70,.7,120);
  coins(e.x,e.y,heavy?7:2);
  SFX.die();
  if(heavy)G.shake=6;
}

/* ─────────── ONDATE ─────────── */
function startWave(){
  if(G.state!=='play')return;
  if(G.waveOn){G.lacrime+=10+G.wave*2;coins(W/2,H/2,4);}
  G.wave++;
  G.sigilli++;
  const n=G.wave;
  const groups=waveDef(n);
  for(const g of groups){
    const tipo=mob(g.t);
    for(let i=0;i<g.n;i++)G.queue.push({t:tipo,at:G.t+g.delay+i*g.gap,wave:n});
  }
  G.waveOn=true;
  SFX.wave();
  const rel=n-(G.act-1)*20;
  let nm=NOMI[G.act][(rel-1)%20];
  if(rel>20)nm+=' · '+ROMAN(Math.floor((rel-1)/20)+1);
  if(groups.some(g=>g.t==='big'))nm=BIGCRY[G.act];
  banner('ONDATA '+ROMAN(rel),nm);
  syncUI();
}
function banner(a,b){
  const el=document.getElementById('banner');
  document.getElementById('banA').textContent=a;
  document.getElementById('banB').textContent=b;
  el.classList.remove('go');void el.offsetWidth;el.classList.add('go');
}

/* ─────────── UPDATE ─────────── */
function update(dt){
  G.t+=dt;
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*14);

  // coda spawn
  for(let i=G.queue.length-1;i>=0;i--){
    if(G.t>=G.queue[i].at){const q=G.queue[i];G.queue.splice(i,1);spawn(q.t,q.wave);}
  }

  // reset rallentamento
  for(const e of G.enemies)e.slowAmt=0;

  // torri
  for(const t of G.towers)towerUpdate(t,dt);

  // nemici
  for(let i=G.enemies.length-1;i>=0;i--){
    const e=G.enemies[i];
    if(!e.alive){G.enemies.splice(i,1);continue;}
    e.flash=Math.max(0,e.flash-dt);e.bob+=dt*6;
    if(e.burnT>0){e.burnT-=dt;e.hp-=e.burn*dt;checkBreak(e);
      if(Math.random()<dt*9)part(e.x+(Math.random()*6-3),e.y-4,0,-14,.4,C.ember,-10);
      if(e.hp<=0){kill(e);continue;}}
    // passi del colosso
    if(e.def.big){
      e.stepT-=dt*(1-e.slowAmt);
      if(e.stepT<=0){e.stepT=.62;G.shake=Math.max(G.shake,1.7);SFX.thud();
        for(let k=0;k<4;k++)part(e.x+(Math.random()*12-6),e.y+1,Math.random()*26-13,
          -8-Math.random()*12,.45,'#6b6252',60);}
    }
    // spawner boss
    if(e.def.spawner){e.spawnT-=dt;
      if(e.spawnT<=0){e.spawnT=e.def.spawner;
        for(let k=0;k<2;k++){const m=spawn(mob('base'),Math.max(1,G.wave-3),e.seg,e.segD);
          m.x=e.x;m.y=e.y;}
        burst(e.x,e.y,10,'#6a2a4a',40,.5,20);}}
    moveEnemy(e,dt);
    if(e.escaped&&e.def.final){
      G.sigilli=0;G.bossIn=true;G.bossHp=Math.max(0,e.hp/e.max);
      G.bossRef=null;G.shake=9;SFX.over();
      burst(5*TILE+8,17*TILE+8,40,C.blood,90,1,50);
      e.alive=false;G.enemies.splice(i,1);
      gameOver();syncUI();continue;
    }
    if(e.escaped){
      G.sigilli-=e.def.dmg;G.shake=4;SFX.leak();
      burst(5*TILE+8,17*TILE+8,12,C.blood,60,.6,60);
      e.alive=false;G.enemies.splice(i,1);
      if(G.sigilli<0){G.sigilli=0;gameOver();}
      syncUI();
    }
  }

  // proiettili
  for(let i=G.shots.length-1;i>=0;i--){
    const s=G.shots[i];
    let tx=s.lx,ty=s.ly;
    if(s.target&&s.target.alive){tx=s.target.x;ty=s.target.y-4;s.lx=tx;s.ly=ty;}
    const dx=tx-s.x,dy=ty-s.y,d=Math.sqrt(dx*dx+dy*dy);
    const step=s.speed*dt;
    if(s.trail&&Math.random()<dt*30)part(s.x,s.y,0,0,.25,s.col,0);
    if(d<=step+1.5){
      impact(s);G.shots.splice(i,1);continue;
    }
    s.x+=dx/d*step;s.y+=dy/d*step;s.a=Math.atan2(dy,dx);
    s.life-=dt;if(s.life<=0){impact(s);G.shots.splice(i,1);}
  }
  function impact(s){
    if(s.splash){
      SFX.fire();
      G.rings.push({x:s.x,y:s.y,r:2,max:s.splash,t:.32,col:C.ember});
      burst(s.x,s.y,10,C.ember,70,.4,30);
      const sr2=s.splash*s.splash;
      for(let i=0;i<G.enemies.length;i++){
        const e=G.enemies[i];if(!e.alive)continue;
        const dx=e.x-s.x,dy=e.y-s.y-4;
        if(dx*dx+dy*dy<sr2){
          damage(e,s.dmg,s.ap);
          if(s.burn){e.burn=Math.max(e.burn,s.burn);e.burnT=3;}
        }
      }
    }else if(s.target&&s.target.alive){
      damage(s.target,s.dmg,s.ap);SFX.hit();
      burst(s.x,s.y,3,'#c9b08a',34,.22,60);
    }
  }

  // raggi & anelli & particelle
  for(let i=G.beams.length-1;i>=0;i--){G.beams[i].t-=dt;if(G.beams[i].t<=0)G.beams.splice(i,1);}
  for(let i=G.rings.length-1;i>=0;i--){const r=G.rings[i];r.t-=dt;
    r.r+=(r.max-r.r)*Math.min(1,dt*12);if(r.t<=0)G.rings.splice(i,1);}
  for(let i=G.parts.length-1;i>=0;i--){const p=G.parts[i];
    p.life-=dt;
    if(p.life<=0){if(pPool.length<MAXPART)pPool.push(p);G.parts.splice(i,1);continue;}
    p.vy+=p.grav*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}

  // fine ondata
  if(G.waveOn&&G.state==='play'&&G.queue.length===0&&G.enemies.length===0){
    G.waveOn=false;
    G.lacrime+=25+G.wave*6;
    if(!G.endless&&G.wave>=G.act*20){
      if(G.act===1)victory();
      else if(G.act===2)victoryFinal();
      else victoryTrue();
    }
    syncUI();
  }
}

function moveEnemy(e,dt){
  let dist=e.speed*(1-e.slowAmt)*dt;
  let guard=0;
  while(dist>0&&guard++<10){
    const len=SEGLEN[e.seg];
    const rem=len-e.segD;
    if(dist<rem){e.segD+=dist;dist=0;}
    else{dist-=rem;e.seg++;e.segD=0;
      if(e.seg>=SEGLEN.length){e.escaped=true;return;}}
  }
  const a=PATHPX[e.seg],b=PATHPX[e.seg+1],t=e.segD/SEGLEN[e.seg];
  e.x=a.x+(b.x-a.x)*t;e.y=a.y+(b.y-a.y)*t;
  if(b.x!==a.x)e.dir=b.x>a.x?1:-1;
  e.prog=e.seg+t;
}

function towerUpdate(t,dt){
  const st=t.st,cfg=TOWERS[t.type];
  t.cd-=dt;t.rec=Math.max(0,t.rec-dt*4);
  const r2=st.range*st.range;
  if(cfg.aura){
    let any=false;
    for(let i=0;i<G.enemies.length;i++){
      const e=G.enemies[i];if(!e.alive)continue;
      const dx=e.x-t.x,dy=e.y-t.y;
      if(dx*dx+dy*dy<r2){
        const res=e.def.slowResist||0;
        e.slowAmt=Math.max(e.slowAmt,st.slow*(1-res));any=true;}
    }
    if(t.cd<=0&&any){
      t.cd=st.rate;t.rec=1;SFX.bell();
      G.rings.push({x:t.x,y:t.y,r:4,max:st.range,t:.5,col:'#9fb8c8'});
      for(let i=0;i<G.enemies.length;i++){const e=G.enemies[i];
        const dx=e.x-t.x,dy=e.y-t.y;
        if(e.alive&&dx*dx+dy*dy<r2)damage(e,st.dmg,1);}
    }
    return;
  }
  if(t.cd>0)return;
  const target=findTarget(t,r2);
  if(!target)return;
  t.cd=st.rate;t.rec=1;
  t.aim=Math.atan2(target.y-4-t.y,target.x-t.x);
  if(cfg.beam){
    SFX.beam();
    G.beams.push({x1:t.x,y1:t.y-6,x2:target.x,y2:target.y-4,t:.16});
    damage(target,st.dmg,1);
    burst(target.x,target.y-4,7,'#f0e6d0',60,.35,20);
    G.shake=1.6;
  }else if(cfg.splash){
    SFX.fire();
    G.shots.push({x:t.x,y:t.y-6,target,lx:target.x,ly:target.y-4,speed:78,dmg:st.dmg,
      ap:st.ap,splash:st.splash,burn:st.burn,col:C.ember,life:3,type:'fire',trail:true,a:0});
  }else{
    SFX.shoot();
    G.shots.push({x:t.x,y:t.y-8,target,lx:target.x,ly:target.y-4,speed:165,dmg:st.dmg,
      ap:st.ap,col:'#cbbb98',life:2.5,type:'bolt',a:0});
  }
}
function findTarget(t,r2){
  let best=null,bp=-1;
  for(let i=0;i<G.enemies.length;i++){
    const e=G.enemies[i];
    if(!e.alive||e.prog<=bp)continue;
    const dx=e.x-t.x,dy=e.y-t.y;
    if(dx*dx+dy*dy<=r2){bp=e.prog;best=e;}
  }
  return best;
}

/* ─────────── RENDER ─────────── */
function render(){
  x.save();
  x.translate(OX,OY);
  if(G.shake>.1){x.translate((Math.random()-.5)*G.shake,(Math.random()-.5)*G.shake);}
  x.drawImage(bgc,-OX-MARG,-OY-MARG);
  drawNebbia();

  // celle costruibili in modalità edificazione
  if(G.build){
    x.globalAlpha=.10+Math.sin(G.t*5)*.05;
    x.fillStyle=C.gold;
    for(let i=0;i<freeCells.length;i+=2)x.fillRect(freeCells[i],freeCells[i+1],TILE-2,TILE-2);
    x.globalAlpha=1;
  }

  // anelli
  for(const r of G.rings){
    x.strokeStyle=r.col;x.globalAlpha=Math.max(0,r.t*1.6);x.lineWidth=1;
    x.beginPath();x.arc(r.x,r.y,r.r,0,6.2832);x.stroke();x.globalAlpha=1;
  }

  /* Torri e creature condividono un solo ordinamento in profondità:
     chi ha i piedi più in alto sta dietro. Così un mob che passa dietro
     una torre le finisce dietro davvero. */
  ZLIST.length=0;
  for(let i=0;i<G.towers.length;i++)ZLIST.push(G.towers[i]);
  for(let i=0;i<G.enemies.length;i++)ZLIST.push(G.enemies[i]);
  ZLIST.sort(zcmp);
  for(let i=0;i<ZLIST.length;i++){
    const o=ZLIST[i];
    if(o.def)drawNemico(o); else drawTorre(o);
  }
  // barre vita sopra a tutto: devono restare leggibili
  for(let i=0;i<G.enemies.length;i++)drawBarra(G.enemies[i]);
  // cerchio di gittata della torre selezionata
  if(G.sel){
    const t=G.sel;
    x.strokeStyle='rgba(201,162,39,.55)';x.lineWidth=1;
    x.beginPath();x.arc(t.x,t.y,t.st.range,0,6.2832);x.stroke();
    x.strokeStyle=C.gold;x.strokeRect(t.x-TILE/2+.5,t.y-TILE/2+.5,TILE-1,TILE-1);
  }

  // proiettili
  for(const s of G.shots){
    if(s.type==='bolt'){
      x.save();x.translate(s.x,s.y);x.rotate(s.a);
      x.fillStyle='#0a070c';x.fillRect(-3,-1,6,3);
      x.fillStyle=s.col;x.fillRect(-2,0,5,1);
      x.restore();
    }else{
      const f=Math.random();
      x.fillStyle='#f2c14e';x.fillRect(s.x-1,s.y-1,2,2);
      x.fillStyle=f<.5?C.ember:'#c9451f';
      x.fillRect(s.x-2,s.y,1,1);x.fillRect(s.x+1,s.y-1,1,1);
    }
  }

  // raggi
  for(const b of G.beams){
    const a=b.t/.16;
    x.globalAlpha=a;x.strokeStyle='#f5ecd0';x.lineWidth=1;
    x.beginPath();x.moveTo(b.x1,b.y1);x.lineTo(b.x2,b.y2);x.stroke();
    x.globalAlpha=a*.35;x.strokeStyle=C.gold;x.lineWidth=3;
    x.beginPath();x.moveTo(b.x1,b.y1);x.lineTo(b.x2,b.y2);x.stroke();
    x.globalAlpha=1;
  }

  // particelle
  for(const p of G.parts){
    x.globalAlpha=Math.min(1,p.life/p.max*1.6);
    x.fillStyle=p.col;x.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s);
  }
  x.globalAlpha=1;

  // luci
  x.globalCompositeOperation='lighter';
  for(let i=0;i<LIGHTS.length;i++){
    const L=LIGHTS[i],fl=.55+Math.sin(G.t*7+L.x)*.12+Math.random()*.08;
    x.globalAlpha=.20*fl;
    if(APO)x.drawImage(GLOW_SACRO,L.x-30,L.y-30);
    else if(INF)x.drawImage(GLOW_INFERNO,L.x-22,L.y-22);
    else x.drawImage(GLOW_CANDELA,L.x-20,L.y-20);
    x.globalAlpha=.5*fl;
    x.fillStyle='#f2c14e';x.fillRect(L.x,L.y-1-((Math.random()*2)|0),1,1);
  }
  {const pl=.72+Math.sin(atime*1.5)*.12,sx=5*TILE+8,sy=H+30;
   x.globalAlpha=.42*pl;x.drawImage(GLOW_SACRO,sx-30,sy-30);}
  for(let i=0;i<G.towers.length;i++){
    const t=G.towers[i];
    if(t.type!=='braciere')continue;
    const fl=.6+Math.sin(G.t*9+t.x)*.15+Math.random()*.1,rad=24+t.lv*5;
    const ly=t.y+TILE/2-t.sp.h+TFLAME[t.lv-1][0][1]-2;
    x.globalAlpha=.26*fl;
    x.drawImage(t.lv===MAXLV?GLOW_GELO:GLOW_FUOCO,t.x-rad,ly-rad,rad*2,rad*2);
  }
  x.globalAlpha=1;
  x.globalCompositeOperation='source-over';

  // vignettatura
  x.drawImage(fgc,-OX,-OY);
  // riserva di vita del signore: sempre visibile, sopra ogni cosa
  if(G.bossRef&&G.bossRef.alive){
    const b=G.bossRef,f=Math.max(0,b.hp/b.max),bw=W-24,bx0=12,by0=-15;
    x.fillStyle='rgba(6,3,8,.9)';x.fillRect(bx0-3,by0-3,bw+6,10);
    x.fillStyle=C.gold;x.fillRect(bx0-3,by0-3,bw+6,1);x.fillRect(bx0-3,by0+6,bw+6,1);
    x.fillStyle='#2a1218';x.fillRect(bx0,by0,bw,4);
    x.fillStyle=b.broken?'#e8703a':'#8e1b25';x.fillRect(bx0,by0,Math.ceil(bw*f),4);
    x.fillStyle='#f5ecd0';x.fillRect(bx0+Math.max(0,Math.ceil(bw*f)-1),by0,1,4);
    x.fillStyle='rgba(201,162,39,.6)';x.fillRect(bx0+((bw*b.def.breakAt)|0),by0-2,1,8);
  }
  drawCenere();
  x.drawImage(APO?VIG_APO:(INF?VIG_INF:VIG),-OX,-OY);

  // pausa
  if(G.paused&&G.state==='play'){
    x.fillStyle='rgba(6,4,9,.72)';x.fillRect(-OX,-OY,CW,CH);
    x.fillStyle=C.gold;x.fillRect(W/2-9,H/2-8,5,16);x.fillRect(W/2+4,H/2-8,5,16);
  }
  x.restore();
}
const ZLIST=[];
/* piedi della sagoma: per una torre il bordo basso della casella,
   per una creatura il punto in cui tocca terra */
const zy=o=>o.def?o.y+4:o.y+TILE/2;
const zcmp=(a,b)=>zy(a)-zy(b);

function drawTorre(t){
  const sp=t.sp;
  const py=t.y+TILE/2-sp.h+(t.rec>0?1:0);
  const max=t.lv===MAXLV;
  if(max){
    // aureola: segna il grado massimo senza aggiungere mole
    const pu=.55+Math.sin(G.t*2.2+t.x)*.16;
    x.globalAlpha=pu*.5;
    x.strokeStyle='#f7e08a';x.lineWidth=1;
    x.beginPath();x.arc(t.x,py+4,7,0,6.2832);x.stroke();
    x.globalAlpha=pu*.22;
    x.beginPath();x.arc(t.x,py+4,9,0,6.2832);x.stroke();
    x.globalAlpha=1;
    if(Math.random()<.16)part(t.x+(Math.random()*10-5),py+2,0,-9,.6,'#f7e08a',-16);
  }
  blit(x,sp,t.x-sp.w/2,py);
  if(t.type==='braciere'){const set=TFLAME[t.lv-1];
    for(let i=0;i<set.length;i++)drawFlame(t.x+set[i][0],py+set[i][1],set[i][2],max);}
  if(t.type==='reliquiario'&&t.rec>0){
    x.fillStyle='#f5ecd0';x.fillRect(t.x-1,py+TTIP.reliquiario[t.lv-1],2,2);
  }
  if(max){ // sigillo pieno al posto delle tacche
    x.fillStyle='#f7e08a';x.fillRect(t.x-5,t.y+TILE/2-2,10,2);
    x.fillStyle='#ffffff';x.fillRect(t.x-1,t.y+TILE/2-2,2,2);
  }else for(let i=0;i<t.lv-1;i++){
    x.fillStyle=C.gold;x.fillRect(t.x-(t.lv-1)*2+i*4,t.y+TILE/2-2,2,2);
  }
}
function drawNemico(e){
  const sp=S[(e.broken?e.type+'_b':e.type)+(e.flash>0?'_f':'')];
  const off=e.def.float?Math.sin(e.bob*.6)*1.5:(Math.floor(e.bob)%2?0:-1);
  const px=e.x-sp.w/2,py=e.y-sp.h+4+off;
  e.py=py;
  if(e.def.big){
    x.fillStyle='rgba(0,0,0,.4)';
    x.beginPath();x.ellipse(e.x,e.y+2,sp.w*.42,e.def.final?4:3,0,0,6.2832);x.fill();
  }
  blit(x,sp,px,py,e.dir<0,e.def.alpha);
  if(e.slowAmt>0){x.fillStyle='rgba(140,200,220,.18)';x.fillRect(px,py,sp.w,sp.h);}
  if(e.broken&&Math.random()<.25)
    part(e.x+(Math.random()*14-7),e.y-10-Math.random()*8,0,-6,.4,C.ember,-14);
}
function drawBarra(e){
  if(e.hp>=e.max||e.py===undefined)return;
  const w=e.def.final?28:(e.def.boss?16:(e.def.big?22:9)),f=Math.max(0,e.hp/e.max);
  const grosso=e.def.big||e.def.final;
  const bx0=Math.round(e.x-w/2),by0=Math.round(e.py-3);
  x.fillStyle='#120b10';x.fillRect(bx0-1,by0-1,w+2,grosso?4:3);
  x.fillStyle=e.def.final?'#8e1b25':(e.def.boss?'#c9a227':(e.def.big?(e.broken?'#e8703a':'#9c8f78')
    :(f>.5?'#7f9c4a':(f>.25?'#c98a27':'#a52a2a'))));
  x.fillRect(bx0,by0,Math.ceil(w*f),grosso?2:1);
  if(e.def.breakAt){x.fillStyle='rgba(201,162,39,.5)';x.fillRect(bx0+((w*e.def.breakAt)|0),by0-1,1,4);}
}
function drawFlame(px,py,sc,blu){
  const n=Math.floor(4*sc)+3;
  for(let i=0;i<n;i++){
    const t=G.t*8+i*1.7;
    const fx=px+Math.sin(t)*2.2*(i/n)-1;
    const fy=py-i*1.5-Math.abs(Math.sin(t*.7))*1.5;
    if(blu)x.fillStyle=i<n*.4?'#eaf6ff':(i<n*.75?'#7fd0f0':'#2f6fc0');
    else x.fillStyle=i<n*.4?'#f7e08a':(i<n*.75?C.flame:C.ember);
    x.fillRect(Math.round(fx),Math.round(fy),Math.max(1,3-((i/n*3)|0)),1);
  }
}

/* ─────────── LOOP ─────────── */
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000;last=now;
  dt=Math.min(dt,.05);
  atime+=dt;
  if(G.state==='play'&&!G.paused){
    const steps=G.speed;
    for(let i=0;i<steps;i++)update(dt);
    syncSoft();
  }
  render();
  requestAnimationFrame(frame);
}

/* ─────────── INPUT ─────────── */
function fit(){
  const stage=document.getElementById('stage');
  const aw=stage.clientWidth-8,ah=stage.clientHeight-6;
  let s=Math.min(aw/CW,ah/CH);
  s=Math.max(.75,Math.floor(s*4)/4);
  cv.style.width=(CW*s)+'px';cv.style.height=(CH*s)+'px';
}
window.addEventListener('resize',fit);
window.addEventListener('orientationchange',()=>setTimeout(fit,180));

cv.addEventListener('pointerdown',ev=>{
  ev.preventDefault();
  audio();
  if(G.state!=='play'||G.paused)return;
  const r=cv.getBoundingClientRect();
  const px=(ev.clientX-r.left)/r.width*CW-OX, py=(ev.clientY-r.top)/r.height*CH-OY;
  const c=Math.floor(px/TILE),rw=Math.floor(py/TILE);
  if(c<0||c>=COLS||rw<0||rw>=ROWS)return;
  const cell=grid[rw][c];
  if(cell===3){
    const t=G.towers.find(t=>t.c===c&&t.r===rw);
    G.sel=t;G.build=null;openPanel();syncUI();return;
  }
  if(G.build){
    if(cell!==0){deny(c,rw);return;}
    const cost=TOWERS[G.build].cost;
    if(G.lacrime<cost){deny(c,rw);return;}
    place(G.build,c,rw);
  }else{
    G.sel=null;closePanel();
  }
},{passive:false});

function deny(c,r){
  SFX.err();G.shake=2;
  for(let i=0;i<6;i++)part(c*TILE+8,r*TILE+8,(Math.random()*40-20),(Math.random()*40-20),.3,C.blood,0);
}
function place(type,c,r){
  const cost=TOWERS[type].cost;
  G.lacrime-=cost;
  const t={type,c,r,x:c*TILE+TILE/2,y:r*TILE+TILE/2,lv:1,cd:0,rec:1,spent:cost,aim:0};
  t.st=tstats(t);t.sp=S[type+'1'];
  G.towers.push(t);G.towers.sort((a,b)=>a.y-b.y);grid[r][c]=3;rebuildFree();
  SFX.build();
  burst(t.x,t.y+6,10,'#6b6252',45,.4,80);
  G.rings.push({x:t.x,y:t.y,r:4,max:t.st.range,t:.4,col:'rgba(201,162,39,.9)'});
  G.sel=t;G.build=null;openPanel();syncUI();
}
function upgrade(){
  const t=G.sel;if(!t||t.lv>=MAXLV)return;
  const c=upCost(t);if(G.lacrime<c){SFX.err();return;}
  G.lacrime-=c;t.spent+=c;t.lv++;t.st=tstats(t);t.sp=S[t.type+t.lv];
  SFX.up();
  G.rings.push({x:t.x,y:t.y,r:4,max:t.st.range,t:.45,col:C.gold});
  burst(t.x,t.y,10,C.gold,50,.5,40);
  openPanel();syncUI();
}
function sell(){
  const t=G.sel;if(!t)return;
  G.lacrime+=sellVal(t);
  grid[t.r][t.c]=0;
  G.towers.splice(G.towers.indexOf(t),1);rebuildFree();
  burst(t.x,t.y,12,'#6b6252',50,.45,90);coins(t.x,t.y,3);
  SFX.build();
  G.sel=null;closePanel();syncUI();
}

/* ─────────── UI ─────────── */
const el=id=>document.getElementById(id);
const bar=el('bar');
TORDER.forEach(k=>{
  const cfg=TOWERS[k];
  const d=document.createElement('button');
  d.className='tcard';d.dataset.k=k;
  const ic=document.createElement('canvas');ic.width=14;ic.height=18;
  const ix=ic.getContext('2d');ix.imageSmoothingEnabled=false;
  ix.drawImage(S[k+'1'].cv,-1,-1);
  d.appendChild(ic);
  const n=document.createElement('div');n.className='tn';n.textContent=cfg.short;d.appendChild(n);
  const c=document.createElement('div');c.className='tc';c.textContent='◈'+cfg.cost;d.appendChild(c);
  d.addEventListener('click',()=>{
    audio();
    if(G.state!=='play')return;
    G.build=(G.build===k)?null:k;
    G.sel=null;closePanel();syncUI();
  });
  bar.appendChild(d);
});

function openPanel(){
  const t=G.sel;if(!t)return;
  const p=el('panel');p.classList.add('on');
  const cfg=TOWERS[t.type],st=t.st;
  el('pName').textContent=cfg.name;
  el('pLev').textContent='LIV '+t.lv+(t.lv>=MAXLV?' · MASSIMO':'');
  let s='';
  if(cfg.aura){
    s+='RALLENTAMENTO <span>'+Math.round(st.slow*100)+'%</span> · RINTOCCO <span>'+st.dmg+'</span><br>';
    s+='AURA <span>'+Math.round(st.range)+'</span> · OGNI <span>'+st.rate.toFixed(1)+'s</span><br>';
  }else{
    s+='DANNO <span>'+st.dmg+'</span> · CADENZA <span>'+st.rate.toFixed(2)+'s</span><br>';
    s+='GITTATA <span>'+Math.round(st.range)+'</span> · DPS <span>'+(st.dmg/st.rate).toFixed(1)+'</span><br>';
  }
  if(st.splash)s+='AREA <span>'+Math.round(st.splash)+'</span> · USTIONE <span>'+st.burn.toFixed(0)+'/s</span><br>';
  if(st.ap===1)s+='<span>TRAPASSA OGNI CORAZZA</span><br>';
  else if(st.ap>0)s+='<span>IGNORA METÀ CORAZZA</span><br>';
  el('pStats').innerHTML=s;
  const up=el('pUp');
  if(t.lv>=MAXLV){up.disabled=true;up.textContent='RITO COMPIUTO';}
  else{up.disabled=G.lacrime<upCost(t);up.textContent='POTENZIA ◈'+upCost(t);}
  el('pSell').textContent='DEMOLISCI +◈'+sellVal(t);
}
function closePanel(){el('panel').classList.remove('on');}
el('pClose').addEventListener('click',()=>{G.sel=null;closePanel();});
el('pUp').addEventListener('click',()=>{audio();upgrade();});
el('pSell').addEventListener('click',()=>{audio();sell();});

const UIC={sig:-1,lac:-1,build:'',waveOn:null,wave:-1,up:null,act:0};
const elSig=el('hSig'),elLac=el('hLac'),elBW=el('bWave'),elUp=el('pUp');
function syncSoft(){
  if(UIC.sig!==G.sigilli){UIC.sig=G.sigilli;elSig.textContent=G.sigilli;}
  if(UIC.lac!==G.lacrime||UIC.build!==G.build){
    const lacChanged=UIC.lac!==G.lacrime;
    UIC.lac=G.lacrime;UIC.build=G.build;
    elLac.textContent=G.lacrime;
    for(let i=0;i<bar.children.length;i++){
      const d=bar.children[i];
      d.classList.toggle('poor',G.lacrime<TOWERS[d.dataset.k].cost);
      d.classList.toggle('sel',G.build===d.dataset.k);
    }
    if(lacChanged&&G.sel&&G.sel.lv<MAXLV){
      const dis=G.lacrime<upCost(G.sel);
      if(UIC.up!==dis){UIC.up=dis;elUp.disabled=dis;}
    }
  }
  if(UIC.waveOn!==G.waveOn||UIC.wave!==G.wave||UIC.act!==G.act){
    UIC.waveOn=G.waveOn;UIC.wave=G.wave;UIC.act=G.act;
    if(G.waveOn){elBW.className='big ghost';elBW.textContent='ANTICIPA · +◈'+(10+G.wave*2);}
    else{elBW.className='big';
    elBW.textContent=ATTO[G.act].btn+ROMAN(G.wave+1-(G.act-1)*20);}
  }
}
function uiDirty(){UIC.lac=-1;UIC.sig=-1;UIC.wave=-2;UIC.up=null;}
function syncUI(){
  uiDirty();syncSoft();
  const rel=G.wave-(G.act-1)*20;
  el('hWave').textContent=ATTO[G.act].hud+ROMAN(Math.max(1,rel))+(G.endless?'':' / XX');
}

el('bWave').addEventListener('click',()=>{audio();if(G.state==='play')startWave();});
el('bSpeed').addEventListener('click',()=>{
  G.speed=G.speed===1?2:(G.speed===2?3:1);
  el('bSpeed').textContent='×'+G.speed;
  el('bSpeed').classList.toggle('on',G.speed>1);
});
el('bSound').addEventListener('click',()=>{
  audio();G.sound=!G.sound;
  el('bSound').textContent=G.sound?'♪':'✕';
  el('bSound').classList.toggle('on',G.sound);
});
el('bPause').addEventListener('click',()=>{
  if(G.state!=='play')return;
  G.paused=!G.paused;
  el('bPause').classList.toggle('on',G.paused);
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.state==='play'){G.paused=true;el('bPause').classList.add('on');}});

/* ─────────── SCHERMATE ─────────── */
const LORE_INTRO=
 'Il Sagrato è l\'ultima soglia consacrata. Dal valico a nord scende la <b>processione</b>: '+
 'penitenti che non ricordano più a chi si votarono.<br><br>'+
 'Tu sei il campanaro. Il portale parte <b>senza sigilli</b>: ogni ondata suonata te ne concede '+
 '<b>uno</b>, e ogni penitente che varca la soglia te ne toglie. Le prime veglie non perdonano '+
 'nulla; più a lungo reggi, più margine ti resta.<br><br>'+
 'Erigi il tuo rito lungo la via con le <b>lacrime</b> raccolte dai caduti.';
const LORE_HELP=
 '<b>1 ·</b> Tocca una torre nella barra, poi tocca una lastra libera del sagrato per consacrarla.<br>'+
 '<b>2 ·</b> Tocca una torre già eretta per vederne la gittata, potenziarla o demolirla (rimborso 60%). '+
 'Ogni torre ha <b>quattro gradi</b>: a ogni rito cambia forma, si alza e colpisce più forte.<br>'+
 '<b>3 ·</b> <b>SPINE</b> colpisce rapido. <b>BRACIERE</b> incendia gruppi. <b>CAMPANA</b> rallenta chi la ode. '+
 '<b>RELIQUIARIO</b> trapassa le corazze da lontano.<br>'+
 '<b>4 ·</b> I <b>Portatori</b> hanno corazza: braciere e reliquiario la superano. Le <b>Ombre</b> resistono al rallentamento.<br>'+
 '<b>5 ·</b> Il <b>Colosso del Giogo</b> scende dall\'ondata VI e poi ogni cinque: la sua corazza respinge '+
 'quasi tutto finché non gli spezzi le piastre a metà vita. Poi diventa vulnerabile — ma più rapido.<br>'+
 '<b>6 ·</b> Suonare la campana durante un\'ondata anticipa la successiva e frutta lacrime in più.<br>'+
 '<b>7 ·</b> Venti veglie ti separano dall\'alba. Ma i penitenti non scendevano: fuggivano.';

let smode='menu',HELPHTML=null;
/* le figure del compendio sono le stesse sprite che vedi in campo */
function spr(k,z){
  const c=S[k].cv;
  return '<img src="'+c.toDataURL()+'" width="'+(c.width*z)+'" height="'+(c.height*z)+'" alt="">';
}
function cmpR(imgs,titolo,testo){
  return '<div class="cmpR"><div class="cmpP">'+imgs+'</div>'+
         '<div class="cmpT"><b>'+titolo+'</b><br>'+testo+'</div></div>';
}
const RUOLI=[
 ['base','Fanteria. Lenta e senza corazza, ma non finisce mai.'],
 ['fast','Corre il doppio. Poca vita: il problema è che arriva prima che tu reagisca.'],
 ['tank','Corazzato. Le armi fisiche lo scalfiscono appena: servono braciere e reliquiario.'],
 ['ghost','Svelto e ostinato: resiste per più di metà al rallentamento della campana.']];
const LEGG=[
 ['big','Dall\'ondata VI, poi ogni cinque. La corazza respinge quasi tutto finché non gli '+
  'spezzi le piastre a metà vita: da lì diventa vulnerabile — e più rapido.'],
 ['boss','Chiude ogni decina. Mentre avanza genera fanteria dal proprio corpo.'],
 ['final','Chiude l\'atto. Più grande di ogni altra cosa in campo e con una riserva di vita che '+
  'nessuno avvicina. <u>Se varca la soglia hai perso, anche con tutti i sigilli intatti.</u>']];
function buildHelp(){
  if(HELPHTML)return HELPHTML;
  let h='<div class="cmpT cmpI">Tocca una torre nella barra, poi una lastra libera del sagrato '+
    'per consacrarla. Tocca una torre già eretta per vederne la gittata, potenziarla o demolirla '+
    '(rimborso 60%). Suonare la campana durante un\'ondata anticipa la successiva e frutta '+
    'lacrime in più.<br><br><b>I sigilli.</b> Parti da zero: ogni ondata te ne dà uno, ogni fuga '+
    'te ne toglie. All\'inizio non puoi sbagliare niente; alla lunga accumuli margine.<br><br>'+
    '<b>Tre atti</b> da venti ondate: la veglia sul sagrato, la discesa nel fuoco, il giudizio '+
    'che scende dal cielo aperto.</div>';
  h+='<div class="cmpH">LE CONSACRAZIONI · primo, quarto e quinto grado</div>';
  for(const k of TORDER)
    h+=cmpR(spr(k+'1',2)+spr(k+'4',2)+spr(k+'5',2),
      TOWERS[k].name+' · ◈'+TOWERS[k].cost,TOWERS[k].desc+
      ' <i>Al quinto rito la pietra diventa marmo e il fuoco si fa freddo.</i>');
  h+='<div class="cmpH">LE SCHIERE · veglia · discesa · giudizio</div>';
  for(const r of RUOLI){
    const t=[1,2,3].map(a=>ROSTER[a][r[0]]);
    h+=cmpR(t.map(k=>spr(k,3)).join(''),
      ENEMIES[t[0]].name+' · <i>'+ENEMIES[t[1]].name+'</i> · <i>'+ENEMIES[t[2]].name+'</i>',r[1]);
  }
  h+='<div class="cmpH">I LEGGENDARI</div>';
  for(const r of LEGG){
    const t=[1,2,3].map(a=>ROSTER[a][r[0]]);
    h+=cmpR(t.map(k=>spr(k,2)).join(''),
      ENEMIES[t[0]].name+' · <i>'+ENEMIES[t[1]].name+'</i> · <i>'+ENEMIES[t[2]].name+'</i>',r[1]);
  }
  HELPHTML=h;return h;
}
function showScreen(title,sub,lore,main,alt,score){
  const s=el('screen');s.classList.remove('off');s.classList.remove('wide');
  el('scTitle').innerHTML=title;
  el('scSub').textContent=sub;
  el('scLore').innerHTML=lore;
  el('scMain').textContent=main;
  const a=el('scAlt');
  if(alt){a.classList.remove('hidden');a.textContent=alt;}else a.classList.add('hidden');
  const sc=el('scScore');
  if(score){sc.classList.remove('hidden');sc.innerHTML=score;}else sc.classList.add('hidden');
}
function menu(){
  G.state='menu';smode='menu';
  showScreen("L'ULTIMA<br>VEGLIA",'TOWER DEFENSE · SAGRATO DI CENERE',LORE_INTRO,
    'INIZIA LA VEGLIA','IL RITO — COME SI GIOCA',
    G.best?'SPINTO FINO A: <b>'+ATTO[Math.min(3,Math.ceil(G.best/20))].hud+
      ROMAN(G.best-(Math.min(3,Math.ceil(G.best/20))-1)*20)+'</b>':null);
}
function help(){
  smode='help';
  showScreen('IL RITO','COMPENDIO DEL SAGRATO',buildHelp(),'TORNA INDIETRO',null,null);
  el('screen').classList.add('wide');
}
el('scMain').addEventListener('click',()=>{
  audio();
  if(smode==='help')menu();
  else if(smode==='won')startAct2();
  else if(smode==='atto3')startAct3();
  else if(smode==='fine')endless();
  else startGame();
});
el('scAlt').addEventListener('click',()=>{
  audio();
  if(smode==='menu')help();
  else if(smode==='won'||smode==='atto3'||smode==='fine')startGame();
  else menu();
});
function endless(){
  G.endless=true;G.state='play';smode='play';
  el('screen').classList.add('off');
  uiDirty();syncUI();banner('IL FUOCO','Non ha più numero');
}

function startGame(){
  G.state='play';smode='play';G.wave=0;G.lacrime=130;G.sigilli=0;G.paused=false;G.endless=false;
  if(G.act!==1)applyAct(1);else G.act=1;
  G.bossRef=null;G.bossIn=false;G.bossHp=0;
  G.enemies.length=0;G.towers.length=0;G.shots.length=0;G.beams.length=0;
  G.parts.length=0;G.rings.length=0;G.queue.length=0;
  G.sel=null;G.build=null;G.waveOn=false;G.t=0;G.killed=0;G.shake=0;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(grid[r][c]===3)grid[r][c]=0;
  rebuildFree();
  el('screen').classList.add('off');
  el('bPause').classList.remove('on');
  closePanel();syncUI();fit();
  banner('IL SAGRATO','Erigi il tuo rito');
}
function gameOver(){
  if(G.state!=='play')return;
  G.state='over';smode='over';SFX.over();
  saveBest(G.wave);
  const rel=G.wave-(G.act-1)*20;
  if(G.bossIn)
    showScreen(G.act===3?"L'AGNELLO<br>È PASSATO":(G.act===2?'IL SIGNORE<br>È PASSATO':'IL SANTO<br>È PASSATO'),
      'NESSUN SIGILLO POTEVA BASTARE',
      'Non serviva che i tuoi sigilli cadessero: è bastato che <b>lui</b> arrivasse alla soglia. '+
      'Si è chinato per entrare, e la porta era comunque troppo bassa.<br><br>'+
      'Contro una cosa simile non si resiste: la si ferma prima, oppure non la si ferma.',
      'RIPROVA',null,
      'FERMATO AL <b>'+Math.round((1-(G.bossHp||0))*100)+'%</b> · CADUTI: <b>'+G.killed+'</b>');
  else if(G.act===3)
    showScreen('IL LIBRO<br>SI CHIUDE','IL GIUDIZIO HA VINTO',
      'I sigilli sono finiti. Ciò che scendeva dal cielo aperto è entrato in ordine, '+
      'in fila, senza fretta, come chi non ha mai avuto dubbi.<br><br>'+
      'Il tuo nome era in quel libro. Adesso non c\'è più.',
      'RICOMINCIA DALLA VEGLIA',null,
      'ATTO III · GIUDIZIO <b>'+ROMAN(Math.max(1,rel))+'</b> · CADUTI: <b>'+G.killed+'</b>');
  else if(G.act===2)
    showScreen('IL FUOCO<br>È DENTRO','LA CREPA HA VINTO',
      'I sigilli sono cenere. Ciò che saliva dal fondo adesso siede dove sedeva il santo, '+
      'e la pietra sopra di te comincia a colare.<br><br>'+
      'Il sagrato tornerà a essere consacrato. Qualcuno dovrà rifare tutto daccapo.',
      'RICOMINCIA DALLA VEGLIA',null,
      'ATTO II · DISCESA <b>'+ROMAN(Math.max(1,rel))+'</b> · CADUTI: <b>'+G.killed+'</b>');
  else
    showScreen('LE CAMPANE<br>TACCIONO','IL CORTEO HA VARCATO LA SOGLIA',
      'I sigilli sono infranti. Ciò che scendeva dal valico ora è dentro la navata, '+
      'e canta con la tua voce.<br><br>Un\'altra veglia ti attende, campanaro.',
      'VEGLIA DI NUOVO',null,
      'ONDATE RESISTITE: <b>'+ROMAN(Math.max(1,rel))+'</b> · CADUTI: <b>'+G.killed+'</b>');
}
function victory(){
  G.state='won';smode='won';saveBest(G.wave);
  showScreen("CALA<br>L'INFERNO","VENTI VEGLIE COMPIUTE",
    'L\'ultimo Vescovo si disfa sulle lastre. Per un istante il valico è muto — '+
    'poi la pietra si apre e il sagrato comincia a scaldarsi sotto i piedi.<br><br>'+
    'Non erano loro a scendere: erano loro a <b>fuggire</b>. Ciò che li spingeva sale adesso, '+
    'e ha ossa che bruciano.<br><br>Le tue torri restano in piedi. Ti sono concesse '+
    '<b>200 lacrime</b>: non ti sarà dato altro.',
    'SCENDI NEL FUOCO','RICOMINCIA DACCAPO',
    'CADUTI: <b>'+G.killed+'</b> · LACRIME: <b>'+G.lacrime+'</b>');
}
function startAct2(){
  applyAct(2);
  G.state='play';smode='play';
  G.lacrime+=200;
  el('screen').classList.add('off');
  G.shake=7;SFX.over();
  for(let i=0;i<40;i++)part(Math.random()*W,H*Math.random(),Math.random()*30-15,
    -20-Math.random()*40,1.2,Math.random()<.5?C.ember:C.blood,-14);
  uiDirty();syncUI();
  banner('ATTO II · LA DISCESA','Il fondo sale al sagrato');
}
function victoryFinal(){
  G.state='won';smode='atto3';saveBest(G.wave);
  showScreen("SI APRE<br>IL CIELO",'QUARANTA ONDATE COMPIUTE',
    'Il Signore del Fondo si spegne sulle lastre calde e per un istante non sale più nulla.<br><br>'+
    'Poi il cielo si apre — non come si apre una nuvola: come si apre un <b>libro</b>. '+
    'Quello che scende adesso non brucia e non marcisce. È bianco, è in ordine, e ha sette occhi.<br><br>'+
    'Non era l\'inferno a volerti il sagrato. Era il <b>giudizio</b>, e arrivava ultimo.',
    'ALZA GLI OCCHI','RICOMINCIA DACCAPO',
    'CADUTI: <b>'+G.killed+'</b> · LACRIME: <b>'+G.lacrime+'</b>');
}
function startAct3(){
  applyAct(3);
  G.state='play';smode='play';
  G.lacrime+=400;
  el('screen').classList.add('off');
  G.shake=8;SFX.roar();
  for(let i=0;i<50;i++)part(Math.random()*W,H,Math.random()*30-15,
    -30-Math.random()*50,1.4,Math.random()<.5?'#f7e08a':'#ffffff',22);
  uiDirty();syncUI();
  banner('ATTO III · IL GIUDIZIO','Il cielo è un libro aperto');
}
function victoryTrue(){
  G.state='won';smode='fine';saveBest(G.wave);
  showScreen('NESSUNO<br>SCENDE PIÙ','SESSANTA ONDATE COMPIUTE',
    'L\'Agnello si è disfatto sulle lastre come tutti gli altri, e con lui il libro si è chiuso.<br><br>'+
    'Non c\'è alba, non c\'è fondo, non c\'è giudizio: c\'è un sagrato vuoto e una campana che nessuno '+
    'suona. Hai tenuto la soglia contro tre mondi.<br><br>Puoi restare a vegliare finché reggerai.',
    'RESTA A VEGLIARE','RICOMINCIA DACCAPO',
    'CADUTI: <b>'+G.killed+'</b> · LACRIME: <b>'+G.lacrime+'</b>');
}
function saveBest(w){
  if(w>G.best){G.best=w;
    try{if(window.storage&&window.storage.set)window.storage.set('veglia:best',String(w));}catch(e){}}
}
(async()=>{try{
  if(window.storage&&window.storage.get){
    const r=await window.storage.get('veglia:best');
    if(r&&r.value)G.best=parseInt(r.value,10)||0;
    if(G.state==='menu')menu();
  }
}catch(e){}})();

/* ─────────── AVVIO ─────────── */
menu();
fit();
setTimeout(fit,120);
requestAnimationFrame(frame);
</script>
</body>
</html>
